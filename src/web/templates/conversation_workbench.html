        status: "状态", period_start: "区间起点", as_of: "计算时点", start_close: "起始价",
        current_price: "当前价", trading_days: "交易日数", period_return: "区间收益",
        average_amount_10k: "日均成交额(万元)", momentum: "动量值", success_count: "成功数",
        failed_count: "失败数", matched: "是否命中", signal: "信号"
      };
      return labels[key] || String(key || "结果").replaceAll("_", " ");
    }

    function formatTestValue(key, value) {
      if (value === null || value === undefined || value === "") return "—";
      if (Array.isArray(value)) return value.map((item) => typeof item === "object" ? JSON.stringify(item) : String(item)).join("、");
      if (typeof value === "boolean") return value ? "是" : "否";
      if (typeof value === "number") {
        if (["period_return", "return", "pct_change"].includes(key)) return `${(value * 100).toFixed(2)}%`;
        return value.toLocaleString("zh-CN", { maximumFractionDigits: 6 });
      }
      if (typeof value === "object") return JSON.stringify(value);
      return String(value);
    }

    function renderTestKv(value) {
      if (!value || typeof value !== "object" || Array.isArray(value)) return "";
      const entries = Object.entries(value).filter(([, item]) => item !== "" && item !== null && item !== undefined && !Array.isArray(item));
      return entries.length ? `<div class="agent-kv-list">${entries.slice(0, 8).map(([key, item]) => `<div class="agent-kv-item"><span class="agent-kv-label">${escapeHtml(testFieldLabel(key))}</span><span class="agent-kv-value">${escapeHtml(formatTestValue(key, item))}</span></div>`).join("")}</div>` : "";
    }

    function renderTestRows(rows) {
      if (!Array.isArray(rows) || !rows.length) return "";
      const priority = ["name", "code", "status", "trading_days", "current_price", "period_return", "average_amount_10k", "momentum", "matched", "signal"];
      const available = new Set(rows.flatMap((row) => row && typeof row === "object" ? Object.keys(row) : []));
      const columns = priority.filter((key) => available.has(key)).slice(0, 8);
      if (!columns.length) return "";
      return `<div class="agent-test-table-wrap"><table class="agent-test-table"><thead><tr>${columns.map((key) => `<th>${escapeHtml(testFieldLabel(key))}</th>`).join("")}</tr></thead><tbody>${rows.slice(0, 5).map((row) => `<tr>${columns.map((key) => `<td>${escapeHtml(formatTestValue(key, row?.[key]))}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
    }

    function renderExecutionLogs(logs) {
      if (!Array.isArray(logs) || !logs.length) return "";
      return `<div class="agent-execution-logs">${logs.map((log) => {
        const level = String(log?.level || "debug").toLowerCase();
        return `<div class="agent-execution-log"><span class="agent-log-level ${escapeHtml(level)}">${escapeHtml(level)}</span><div class="agent-log-content"><div class="agent-log-message">${escapeHtml(log?.message || "核心计算")}</div>${renderTestKv(log?.data || {})}</div></div>`;
      }).join("")}</div>`;
    }

    function renderTestCase(test) {
      const input = test?.input && typeof test.input === "object" ? test.input : {};
      const actual = test?.actual && typeof test.actual === "object" ? test.actual : {};
      const logs = Array.isArray(test?.logs) ? test.logs : [];
      const rows = Array.isArray(actual.results) ? actual.results : [];
      const actualSummary = Object.fromEntries(Object.entries(actual).filter(([key]) => key !== "results" && key !== "error"));
      return `<div class="agent-test-case">
        <div class="agent-test-case-head"><span>${escapeHtml(test?.summary || test?.name || "运行样例")}</span><span class="agent-test-case-status">${escapeHtml(test?.status === "passed" ? "实际运行通过" : (test?.status || "待确认"))}</span></div>
        <div class="agent-test-section"><div class="agent-test-section-title">测试输入</div>${renderTestKv(input)}</div>
        ${rows.length ? `<div class="agent-test-section"><div class="agent-test-section-title">实际结果</div>${renderTestRows(rows)}${renderTestKv(actualSummary)}</div>` : `<div class="agent-test-section"><div class="agent-test-section-title">实际结果</div>${renderTestKv(actual)}</div>`}
        ${logs.length ? `<div class="agent-test-section"><div class="agent-test-section-title">核心计算过程</div>${renderExecutionLogs(logs)}</div>` : ""}
      </div>`;
    }

    function renderWorkflowStreamBlock(block) {
      const data = block?.data && typeof block.data === "object" ? block.data : {};
      const items = Array.isArray(data.items) ? data.items : [];
      if (data.role === "live_progress") {
        const statusLabels = { running: "进行中", completed: "已完成", error: "失败", pending: "等待" };
        return `
          <div class="agent-live-workflow" aria-live="polite" aria-atomic="true">
            <div class="agent-live-workflow-head">
              <div class="agent-live-workflow-summary">${escapeHtml(data.summary || "正在处理…")}</div>
              <span class="agent-live-workflow-status ${escapeHtml(data.status || "running")}">${escapeHtml(statusLabels[data.status] || "进行中")}</span>
            </div>
            <div class="agent-progress-steps">
              ${items.map((item) => `<div class="agent-progress-step ${escapeHtml(item?.status || "pending")}"><span class="agent-progress-step-dot"></span><span>${escapeHtml(item?.title || "步骤")}</span></div>`).join("")}
            </div>
          </div>
        `;
      }
      return `
        <div class="agent-semantic-block">
          <div class="agent-semantic-body">
            ${data.summary ? `<div class="agent-semantic-summary">${escapeHtml(data.summary)}</div>` : ""}
            ${items.length ? `
              <ol class="agent-logic">
                ${items.slice(0, 10).map((item) => `
                  <li>${escapeHtml(item?.title || item?.label || "步骤")} · ${escapeHtml(item?.status || "pending")}</li>
                `).join("")}
              </ol>
            ` : ""}
          </div>
        </div>
      `;
    }

    function renderInteractionStreamBlock(block) {
      const data = block?.data && typeof block.data === "object" ? block.data : {};
      const actions = Array.isArray(data.actions) ? data.actions : [];
      const questions = Array.isArray(data.questions) ? data.questions.filter(Boolean) : [];
      const review = data.review && typeof data.review === "object" ? data.review : null;
      return `
        <div class="agent-semantic-block">
          <div class="agent-semantic-body">
            ${data.prompt || block?.content ? `<div class="agent-semantic-summary">${escapeHtml(data.prompt || block.content)}</div>` : ""}
            ${questions.length ? `<div class="agent-question-list">${questions.slice(0, 5).map((raw, index) => {
              const item = raw && typeof raw === "object" ? raw : { id: `Q${index + 1}`, question: String(raw || ""), required: true, options: [] };
              let options = Array.isArray(item.options) ? item.options : [];
              if (item.answer_type === "boolean" && !options.length) options = [{ value: "true", label: "是", description: "", recommended: false }, { value: "false", label: "否", description: "", recommended: false }];
              return `<div class="agent-question">
                <div class="agent-question-title">${escapeHtml(item.question || "需要补充")}${item.required ? ' <span class="agent-question-required">必答</span>' : ""}</div>
                ${item.reason ? `<div class="agent-question-reason">${escapeHtml(item.reason)}</div>` : ""}
                ${options.length ? `<div class="agent-question-options">${options.map((option) => `<button type="button" class="agent-question-option" data-question-option data-answer-type="${escapeHtml(item.answer_type || "single_choice")}" data-question-text="${escapeHtml(encodeURIComponent(item.question || ""))}" data-answer-label="${escapeHtml(encodeURIComponent(option?.label || option?.value || ""))}"><span>${escapeHtml(option?.label || option?.value || "选项")}${option?.recommended ? "<em>推荐</em>" : ""}</span>${option?.description ? `<small>${escapeHtml(option.description)}</small>` : ""}</button>`).join("")}</div>` : `<div class="result-note">请在下方对话输入框中回答。</div>`}
              </div>`;
            }).join("")}</div>` : ""}
            ${review ? `<div class="design-review-strip"><span>数据需求<strong>${escapeHtml(review.data_requirements || 0)} 项</strong></span><span>验收场景<strong>${escapeHtml(review.acceptance || 0)} 项</strong></span><span>关键假设<strong>${escapeHtml((review.assumptions || []).length)} 项</strong></span><span>约束<strong>${escapeHtml((review.constraints || []).length)} 项</strong></span></div>` : ""}
            ${actions.length ? `
              <div class="agent-actions">
                ${actions.map((action) => `
                  <button
                    class="agent-action-btn ${action.style === "primary" ? "primary" : ""}"
                    data-agent-action="${escapeHtml(action.action_id || "")}"
                    data-interaction-id="${escapeHtml(data.interaction_id || "")}"
                    data-action-intent="${escapeHtml(action.intent || "")}"
                    data-expected-revision="${escapeHtml(action.expected_revision ?? data.subject_revision ?? "")}"
                    ${state.resolvedInteractions[data.interaction_id] ? "disabled" : ""}
                  >${escapeHtml(action.label || "继续")}</button>
                `).join("")}
              </div>
            ` : ""}
          </div>
        </div>
      `;
    }

    function renderStreamBlock(block) {
      const blockType = String(block?.block_type || block?.type || "").trim();
      const title = escapeHtml(block?.title || "");
      const content = String(block?.content || "");
      let body = "";
      if (["markdown", "narrative"].includes(blockType)) {
        body = `<div class="agent-markdown">${escapeHtml(content)}</div>`;
      } else if (blockType === "code") {
        body = `<pre class="agent-code"><code>${escapeHtml(content)}</code></pre>`;
      } else if (blockType === "artifact") {
        body = renderArtifactStreamBlock(block);
      } else if (blockType === "assessment") {
        body = renderAssessmentStreamBlock(block);
      } else if (blockType === "workflow") {
        body = renderWorkflowStreamBlock(block);
      } else if (blockType === "interaction") {
        body = renderInteractionStreamBlock(block);
      } else if (blockType === "action") {
        body = `<div class="agent-markdown">${escapeHtml(content || "请在对话输入框中继续。")}</div>`;
      } else if (["table", "bar_chart", "line_chart", "flowchart"].includes(blockType)) {
        body = renderBlock(streamBlockToRenderBlock(block));
      } else {
        body = `<div class="agent-markdown">${escapeHtml(content || previewStructuredValue(block?.data || {}))}</div>`;
      }
      return `
        <div class="agent-stream-block">
          ${title ? `<div class="agent-stream-title">${title}</div>` : ""}
          ${body}
        </div>
      `;
    }

    function mergeStreamBlock(list, block) {
      if (!Array.isArray(list) || !block) return;
      const id = String(block.block_id || block.id || `block_${block.seq || list.length + 1}`);
      const mode = String(block.mode || "replace");
      const next = { ...block, block_id: id };
      const index = list.findIndex((item) => String(item.block_id || "") === id);
      if (index < 0) {
        list.push(next);
        return;
      }
      if (mode === "append") {
        list[index] = {
          ...list[index],
          ...next,
          content: `${String(list[index].content || "")}${String(next.content || "")}`,
          data: next.data || list[index].data || {},
        };
        return;
      }
      list[index] = next;
    }

    function isProcessStreamBlock(block) {
      const blockType = String(block?.block_type || "").trim();
      const blockId = String(block?.block_id || "").trim();
      return blockType === "status" || blockId.includes("_thinking") || blockId.includes("_assistant") || blockId.includes("_tool_output");
    }

    function applyAgentStreamEvent(message, payload) {
      if (!message || !payload || typeof payload !== "object") return;
      const agentRun = message.payload.agent_run && typeof message.payload.agent_run === "object"
        ? message.payload.agent_run
        : { status: "running", title: "Fin Agent", summary: "正在处理", artifacts: [], process: [] };
      if (payload.event === "run_started") {
        agentRun.status = "running";
        agentRun.summary = payload.message || "正在处理";
      } else if (payload.event === "block") {
        if (isProcessStreamBlock(payload)) {
          mergeStreamBlock(agentRun.process, payload);
          if (payload.block_type === "status" && payload.content) {
            agentRun.summary = payload.content;
          }
        } else {
          if (payload.block_type === "workflow" && payload.data?.role === "live_progress") {
            agentRun.artifacts = (Array.isArray(agentRun.artifacts) ? agentRun.artifacts : [])
              .filter((block) => block?.data?.role !== "live_progress" || block?.block_id === payload.block_id);
          }
          mergeStreamBlock(agentRun.artifacts, payload);
          if (payload.block_type === "workflow" && payload.data?.role === "live_progress") {
            agentRun.progress = payload.data;
            agentRun.summary = payload.data.summary || agentRun.summary;
          }
        }
      } else if (payload.event === "done") {
        agentRun.status = "done";
        agentRun.summary = "任务已完成";
        agentRun.artifacts = (Array.isArray(agentRun.artifacts) ? agentRun.artifacts : [])
          .filter((block) => block?.data?.role !== "live_progress");
        message.body = "";
        message.payload = {
          ...message.payload,
          ...(payload.result && typeof payload.result === "object" ? payload.result : {}),
        };
        const finalMessage = String(payload.result?.message || "").trim();
        if (finalMessage && finalMessage.length <= 600) {
          mergeStreamBlock(agentRun.artifacts, {
            block_id: "final_message",
            block_type: "markdown",
            mode: "replace",
            title: "结果说明",
            content: finalMessage,
          });
        }
        if (payload.thread_id) state.threadId = payload.thread_id;
        const patch = payload.result?.thread_context_patch;
        if (patch && Object.prototype.hasOwnProperty.call(patch, "custom_tool_state")) {
          state.customToolActive = Boolean(patch.custom_tool_state);
        }
      } else if (payload.event === "error") {
        agentRun.status = "error";
        agentRun.summary = payload.message || "任务失败";
        mergeStreamBlock(agentRun.artifacts, {
          block_id: "stream_error",
          block_type: "markdown",
          mode: "replace",
          title: "处理失败",
          content: agentRun.summary,
        });
      }
      message.payload.agent_run = agentRun;
      renderMessages();
    }

    function testEvidenceBlock(block, resultPayload) {
      if (String(block?.block_id || "") !== "custom_tool_test_result") return block;
      const existingTests = block?.data?.details?.tests;
      if (Array.isArray(existingTests) && existingTests.some((item) => item?.actual && Object.keys(item.actual).length)) return block;
      const cases = Array.isArray(resultPayload?.test_result?.cases) ? resultPayload.test_result.cases : [];
      if (!cases.length) return block;
      return {
        ...block,
        data: {
          ...(block.data || {}),
          details: {
            ...(block?.data?.details || {}),
            tests: cases.map((item) => ({
              name: String(item?.test_id || ""),
              status: String(item?.status || ""),
              summary: String(item?.purpose || item?.error || ""),
              input: item?.input && typeof item.input === "object" ? item.input : {},
              expected: item?.expected && typeof item.expected === "object" ? item.expected : {},
              actual: item?.actual && typeof item.actual === "object" ? item.actual : {},
              logs: Array.isArray(item?.logs) ? item.logs : [],
            })),
          },
        },
      };
    }

    function renderAgentRun(agentRun, resultPayload = {}) {
      if (!agentRun || typeof agentRun !== "object") return "";
      const status = String(agentRun.status || "running");
      const statusLabel = status === "done" ? "已完成" : (status === "error" ? "失败" : "运行中");
      const artifacts = Array.isArray(agentRun.artifacts) ? agentRun.artifacts : [];
      const runHead = status === "done" ? "" : `
        <div class="agent-run-head">
          <div>
            <div class="agent-run-title">${escapeHtml(agentRun.title || "Fin Agent")}</div>
            ${agentRun.summary ? `<div class="agent-run-subtitle">${escapeHtml(agentRun.summary)}</div>` : ""}
          </div>
          <div class="agent-run-status ${escapeHtml(status)}">${statusLabel}</div>
        </div>
      `;
      return `
        <div class="agent-run">
          ${runHead}
          ${artifacts.length ? `<div class="agent-artifacts">${artifacts.map((block) => renderStreamBlock(testEvidenceBlock(block, resultPayload))).join("")}</div>` : ""}
        </div>
      `;
    }

    function latestAgentRun() {
      for (let index = state.messages.length - 1; index >= 0; index -= 1) {
        const run = state.messages[index]?.payload?.agent_run;
        if (run && typeof run === "object") return run;
      }
      return null;
    }

    function renderUnifiedRunInfo() {
      const content = document.getElementById("harnessContent");
      const label = document.getElementById("harnessStatusLabel");
      const statusPill = document.getElementById("globalRunStatus");
      const statusText = document.getElementById("globalRunStatusText");
      if (!content || !label || !statusPill || !statusText) return;
      const run = latestAgentRun();
      if (!run) {
        label.textContent = "就绪";
        statusText.textContent = "就绪";
        statusPill.className = "status-pill";
        content.innerHTML = `<section class="harness-section"><div class="harness-empty">开始对话后，这里会显示当前运行阶段和精简过程。业务产物仍显示在对话回答中。</div></section>`;
        return;
      }
      const status = String(run.status || "running");
      const statusLabel = status === "done" ? "已完成" : (status === "error" ? "失败" : "运行中");
      const process = Array.isArray(run.process) ? run.process : [];
      const artifacts = Array.isArray(run.artifacts) ? run.artifacts : [];
      const progressBlock = artifacts.find((block) => block?.data?.role === "live_progress");
      const progress = run.progress && typeof run.progress === "object" ? run.progress : (progressBlock?.data || {});
      const progressItems = Array.isArray(progress.items) ? progress.items : [];
      const completedCount = progressItems.filter((item) => item?.status === "completed").length;
      const elapsedMs = Number(progressBlock?.elapsed_ms || 0);
      const statusLabels = { running: "进行中", completed: "已完成", error: "失败", pending: "等待" };
      label.textContent = statusLabel;
      statusText.textContent = statusLabel;
      statusPill.className = `status-pill ${status === "done" ? "done" : (status === "error" ? "error" : "")}`;
      content.innerHTML = `
        <section class="harness-section">
          <h3>当前运行</h3>
          <div class="run-line"><span>状态</span><strong>${escapeHtml(statusLabel)}</strong></div>
          <div class="run-line"><span>当前步骤</span><strong>${escapeHtml(run.summary || "正在处理")}</strong></div>
          ${progressItems.length ? `<div class="run-line"><span>阶段进度</span><strong>${escapeHtml(completedCount)} / ${escapeHtml(progressItems.length)}</strong></div>` : ""}
          ${elapsedMs > 0 ? `<div class="run-line"><span>已用时间</span><strong>${escapeHtml(Math.max(1, Math.round(elapsedMs / 1000)))} 秒</strong></div>` : ""}
        </section>
        <section class="harness-section">
          <h3>阶段时间线</h3>
          ${progressItems.length ? `<div class="harness-timeline">${progressItems.map((item) => `<div class="harness-step ${escapeHtml(item?.status || "pending")}"><span class="harness-step-dot"></span><span>${escapeHtml(item?.title || "步骤")}</span><span class="harness-step-state">${escapeHtml(statusLabels[item?.status] || "等待")}</span></div>`).join("")}</div>` : `<div class="harness-empty">当前没有进行中的阶段。</div>`}
        </section>
        ${process.length ? `<section class="harness-section"><h3>系统里程碑</h3>${process.slice(-6).map((block) => `<div class="harness-event">${escapeHtml(block.content || "")}</div>`).join("")}</section>` : ""}
      `;
    }

    function renderUnifiedThreadTitle() {
      const active = (Array.isArray(state.threads) ? state.threads : [])
        .find((item) => Number(item.thread_id) === Number(state.threadId || 0));
      const title = String(active?.title || state.applicationDisplayName || "Fin Agent");
      const threadTitle = document.getElementById("threadTitle");
      const threadMeta = document.getElementById("threadMeta");
      if (threadTitle) threadTitle.textContent = title;
      if (threadMeta) threadMeta.textContent = state.threadId ? `会话 #${state.threadId}` : "新对话";
    }

    function renderProtocolPayload(renderPayload) {
      const sections = Array.isArray(renderPayload?.sections) ? renderPayload.sections : [];
      if (!sections.length) return "";
      return `
        <div class="render-sections">
          ${sections.map((section) => `
            <div class="render-section">
              <div class="render-section-head">
                <div class="render-section-title">${escapeHtml(section.title || section.section_id || "Section")}</div>
                ${section.description ? `<div class="render-section-desc">${escapeHtml(section.description)}</div>` : ""}
              </div>
              <div class="render-section-blocks">
                ${(Array.isArray(section.blocks) ? section.blocks : []).map((block) => renderBlock(block)).join("")}
              </div>
            </div>
          `).join("")}
        </div>
      `;
    }

    function renderPresentationContract(contract, resultPayload) {
      if (!contract || typeof contract !== "object") return "";
      const hero = contract.hero && typeof contract.hero === "object" ? contract.hero : null;
      const sections = Array.isArray(contract.sections) ? contract.sections : [];
      const parts = [];
      if (hero && (hero.summary || hero.title)) {
        parts.push(`
          <div class="result-hero">
            ${hero.title ? `<div class="result-hero-title">${escapeHtml(hero.title)}</div>` : ""}
            ${hero.summary ? `<div class="result-hero-summary">${escapeHtml(hero.summary)}</div>` : ""}
          </div>
        `);
      }
      const sectionHtml = sections.map((section) => {
        if (!section || typeof section !== "object") return "";
        const sectionType = String(section.section_type || "").trim();
        if (sectionType === "analysis") {
          const fragments = [];
          if (Array.isArray(section.facts) && section.facts.length) {
            fragments.push(`
              <div class="result-section">
                <div class="result-section-title">关键事实</div>
                <div class="result-section-body">${renderList(section.facts)}</div>
              </div>
            `);
          }
          if (Array.isArray(section.risks) && section.risks.length) {
            fragments.push(`
              <div class="result-section">
                <div class="result-section-title">风险提示</div>
                <div class="result-section-body">${renderList(section.risks)}</div>
              </div>
            `);
          }
          if (!fragments.length) return "";
          return `
            <div class="result-panel-section">
              <div class="result-panel-section-title">${escapeHtml(section.title || "结论与提示")}</div>
              ${fragments.join("")}
            </div>
          `;
        }
        const blocks = Array.isArray(section.blocks) ? section.blocks : [];
        if (!blocks.length) return "";
        return `
          <div class="result-panel-section">
            <div class="result-panel-section-title">${escapeHtml(section.title || "结果")}</div>
            <div class="render-sections">
              ${blocks.map((block) => renderBlock(block)).join("")}
            </div>
          </div>
        `;
      }).filter(Boolean).join("");
      if (sectionHtml) {
        parts.push(`<div class="result-panel"><div class="result-panel-title">结果展示</div>${sectionHtml}</div>`);
      }
      return parts.length ? `<div class="assistant-result">${parts.join("")}</div>` : "";
    }

    function groupProcessSteps(steps) {
      const items = Array.isArray(steps) ? steps : [];
      const groups = [];
      const keyMap = new Map();
      items.forEach((step, idx) => {
        const rawStage = String(step?.stage || step?.step_type || "progress").trim();
        const groupKey = rawStage || "progress";
        if (!keyMap.has(groupKey)) {
          const group = { key: groupKey, title: groupKey, items: [] };
          keyMap.set(groupKey, group);
          groups.push(group);
        }
        keyMap.get(groupKey).items.push({
          id: idx + 1,
          title: String(step?.title || step?.step_type || step?.stage || "步骤").trim(),
          message: String(step?.message || step?.status || "").trim(),
          status: String(step?.status || "").trim(),
        });
      });
      return groups;
    }

    function processHtml(taskState, panelTitle = "执行过程") {
      if (!taskState || typeof taskState !== "object") return "";
      const job = taskState.job || {};
      const steps = Array.isArray(taskState.steps) ? taskState.steps : [];
      const stage = String(job.current_stage || job.status || "running");
      const progress = Number(job.progress || 0);
      const grouped = groupProcessSteps(steps.slice(-18));
      const panelClass = panelTitle.includes("思考") ? "thinking" : panelTitle.includes("执行") ? "runtime" : "";
      return `
        <div class="process-panel ${panelClass}">
          <details class="process-frame" open>
            <summary>
              <div class="process-head">
                <div class="process-title">${escapeHtml(panelTitle)}</div>
                <div class="process-badge">${escapeHtml(stage)}</div>
              </div>
            </summary>
            <div class="process-meta">
              <span>job_id: ${escapeHtml(job.job_id || "-")}</span>
              <span>progress: ${escapeHtml(`${progress}%`)}</span>
            </div>
            <div class="process-bar"><div class="process-bar-fill" style="width:${Math.max(0, Math.min(progress, 100))}%"></div></div>
            <div class="process-steps">
              ${grouped.map((group, index) => `
                <div class="process-group">
                  <details ${index >= grouped.length - 2 ? "open" : ""}>
                    <summary>
                      <span class="process-group-head">
                        <span>${escapeHtml(group.title)}</span>
                        <span class="process-group-count">${escapeHtml(`${group.items.length} steps`)}</span>
                      </span>
                    </summary>
                    <ol class="process-outline">
                      ${group.items.map((step) => `
                        <li class="process-step">
                          <div class="process-step-title">${escapeHtml(step.title || `步骤 ${step.id}`)}</div>
                          ${step.message ? `<div class="process-step-message">${escapeHtml(step.message)}</div>` : ""}
                        </li>
                      `).join("")}
                    </ol>
                  </details>
                </div>
              `).join("")}
            </div>
          </details>
        </div>
      `;
    }

    function processPanelsHtml(payload) {
      if (!payload || typeof payload !== "object") return "";
      const planningTaskState = payload.planning_task_state && typeof payload.planning_task_state === "object"
        ? payload.planning_task_state
        : null;
      const runtimeTaskState = payload.runtime_task_state && typeof payload.runtime_task_state === "object"
        ? payload.runtime_task_state
        : null;
      const mergedTaskState = payload.task_state && typeof payload.task_state === "object"
        ? payload.task_state
        : null;
      const blocks = [];
      if (planningTaskState) {
        blocks.push(processHtml(planningTaskState, "思考过程"));
      }
      if (runtimeTaskState) {
        blocks.push(processHtml(runtimeTaskState, "执行进展"));
      }
      if (!blocks.length && mergedTaskState) {
        blocks.push(processHtml(mergedTaskState, "执行过程"));
      }
      return blocks.join("");
    }

    function resultHtml(resultPayload) {
      if (!resultPayload || typeof resultPayload !== "object") return "";
      const finalOutput = resultPayload.final_output && typeof resultPayload.final_output === "object" ? resultPayload.final_output : null;
      const renderPayload = resultPayload.render_payload && typeof resultPayload.render_payload === "object" ? resultPayload.render_payload : null;
      const presentationContract = renderPayload && renderPayload.presentation_contract && typeof renderPayload.presentation_contract === "object"
        ? renderPayload.presentation_contract
        : null;
      if (presentationContract) {
        return renderPresentationContract(presentationContract, resultPayload);
      }
      const blocks = [];
      if (finalOutput) {
        blocks.push(`
          <div class="result-block">
            <div class="result-block-title">结果</div>
            ${renderFinalOutputPreferred(finalOutput)}
          </div>
        `);
      }
      if (renderPayload) {
        blocks.push(`
          <div class="result-block">
            <div class="result-block-title">结构化展示</div>
            ${renderProtocolPayload(renderPayload) || renderStructuredValue(renderPayload)}
          </div>
        `);
      }
      return blocks.length ? `<div class="result-blocks">${blocks.join("")}</div>` : "";
    }

    function renderReferenceMaterials(resultPayload) {
      if (!resultPayload || typeof resultPayload !== "object") return "";
      const items = Array.isArray(resultPayload.reference_materials)
        ? resultPayload.reference_materials
        : (Array.isArray(resultPayload.render_payload?.reference_materials) ? resultPayload.render_payload.reference_materials : []);
      if (!items.length) return "";
      return `
        <div class="reference-materials">
          <div class="reference-block">
            <div class="reference-title">参考资料</div>
            <div class="reference-list">
              ${items.map((item) => {
                const title = escapeHtml(item?.title || item?.path || "参考资料");
                const url = String(item?.url || "").trim();
                const meta = escapeHtml(item?.meta || item?.tool_name || "");
                const summary = escapeHtml(item?.summary || "");
                return `
                  <div class="reference-item">
                    ${url ? `<a class="reference-link" href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">${title}</a>` : `<div>${title}</div>`}
                    ${meta ? `<div class="reference-meta">${meta}</div>` : ""}
                    ${!url && summary ? `<div class="reference-meta">${summary}</div>` : ""}
                  </div>
                `;
              }).join("")}
            </div>
          </div>
        </div>
      `;
    }

    function renderMessages() {
      const root = document.getElementById("messages");
      root.innerHTML = "";
      for (const item of state.messages) {
        const node = document.createElement("div");
        node.className = `message ${item.role}`;
        node.dataset.messageId = String(item.id);
        const cards = Array.isArray(item.payload.items) && item.payload.items.length
          ? `<div class="cards">${item.payload.items.slice(0, 8).map(cardHtml).join("")}</div>`
          : "";
        const attachments = messageAttachmentsHtml(item.payload.attachments);
        const process = processPanelsHtml(item.payload);
        const agentRun = renderAgentRun(item.payload.agent_run, item.payload);
        const result = resultHtml(item.payload.task_result);
        const references = renderReferenceMaterials(item.payload.task_result);
        const bubbleHtml = String(item.body || "").trim()
          ? `<div class="bubble">${escapeHtml(item.body)}</div>`
          : "";
        const contentHtml = item.role === "assistant"
          ? `
            ${process}
            ${agentRun}
            ${bubbleHtml}
            ${attachments}
            ${cards}
            ${result}
            ${references}
          `
          : `
            ${bubbleHtml}
            ${attachments}
            ${cards}
            ${process}
            ${result}
          `;
        node.innerHTML = `
          <div class="role">${item.role}</div>
          ${contentHtml}
        `;
        root.appendChild(node);
      }
      root.scrollTop = root.scrollHeight;
      root.querySelectorAll(".message").forEach((node) => {
        node.addEventListener("contextmenu", (event) => {
          event.preventDefault();
          const messageId = Number(node.dataset.messageId || 0);
          if (!messageId) return;
          state.contextMenu.visible = true;
          state.contextMenu.messageId = messageId;
          state.contextMenu.x = event.clientX;
          state.contextMenu.y = event.clientY;
          renderContextMenu();
        });
      });
      root.querySelectorAll("[data-open-url]").forEach((node) => {
        node.addEventListener("click", () => {
          const url = node.getAttribute("data-open-url") || "";
          if (!url) return;
          window.open(withScriptRoot(url), "_blank", "noopener");
        });
      });
      root.querySelectorAll("[data-switch-application]").forEach((node) => {
        node.addEventListener("click", async () => {
          const target = node.getAttribute("data-switch-application") || "";
          if (!target) return;
          try {
            const appCtx = await loadApplicationContext(target);
            applyApplicationContext(appCtx);
            addMessage("assistant", `已切换 application：${target}`);
            setStatus("");
          } catch (err) {
            setStatus(String(err.message || err));
          }
        });
      });
      root.querySelectorAll("[data-agent-action]").forEach((node) => {
        node.addEventListener("click", () => {
          handleAgentInteraction(node).catch((err) => setStatus(String(err.message || err)));
        });
      });
      root.querySelectorAll("[data-design-tab]").forEach((node) => {
        node.addEventListener("click", () => {
          const artifact = String(node.getAttribute("data-design-artifact") || "");
          const tab = String(node.getAttribute("data-design-tab") || "overview");
          root.querySelectorAll(`[data-design-artifact="${artifact}"]`).forEach((item) => item.classList.toggle("active", item === node));
          root.querySelectorAll(`[data-design-artifact-view="${artifact}"]`).forEach((item) => item.classList.toggle("active", String(item.getAttribute("data-design-view")) === tab));
        });
      });
      root.querySelectorAll("[data-question-option]").forEach((node) => {
        node.addEventListener("click", () => {
          const answerType = String(node.getAttribute("data-answer-type") || "single_choice");
          const question = decodeURIComponent(String(node.getAttribute("data-question-text") || ""));
          const answer = decodeURIComponent(String(node.getAttribute("data-answer-label") || ""));
          const optionRoot = node.closest(".agent-question-options");
          if (answerType === "multiple_choice") {
            node.classList.toggle("selected");
          } else if (optionRoot) {
            optionRoot.querySelectorAll("[data-question-option]").forEach((item) => item.classList.toggle("selected", item === node));
          }
          const selected = optionRoot
            ? Array.from(optionRoot.querySelectorAll("[data-question-option].selected")).map((item) => decodeURIComponent(String(item.getAttribute("data-answer-label") || ""))).filter(Boolean)
            : [answer];
          const input = document.getElementById("inputBox");
          const prefix = `${question}：`;
          const lines = String(input.value || "")
            .split("\n")
            .map((line) => line.trim())
            .filter((line) => line && !line.startsWith(prefix));
          if (selected.length) lines.push(`${prefix}${selected.join("、")}`);
          input.value = lines.join("\n");
          input.focus();
          updateSlashMenu();
        });
      });
      hideContextMenu();
      renderSessionList();
      renderUnifiedRunInfo();
      renderUnifiedThreadTitle();
      renderMermaidDiagrams(root);
    }

    async function loadApplicationContext(applicationName) {
      const target = String(applicationName || "").trim();
      if (!target) return null;
      const res = await fetch(`${apiApplicationBaseUrl}/${encodeURIComponent(target)}/context`);
      const payload = await res.json();
      if (!res.ok || payload.ok === false) {
        throw new Error((payload && payload.error) || `HTTP ${res.status}`);
      }
      return payload.context || null;
    }

    function applyApplicationContext(appCtx) {
      if (!appCtx || typeof appCtx !== "object") return;
      const nextApplicationName = String(appCtx.application_name || "").trim();
      if (nextApplicationName && nextApplicationName !== state.applicationName) {
        state.threadId = null;
      }
      state.applicationName = nextApplicationName || state.applicationName;
      state.applicationDisplayName = String(appCtx.display_name || state.applicationDisplayName || "").trim();
      state.chatPlaceholder = String(appCtx.chat_placeholder || state.chatPlaceholder || "").trim();
      state.assistantIntro = String(appCtx.assistant_intro || state.assistantIntro || "").trim();
      state.assistantAgent = (appCtx.assistant_agent && typeof appCtx.assistant_agent === "object") ? appCtx.assistant_agent : {};
      state.defaultAgent = (appCtx.default_agent && typeof appCtx.default_agent === "object") ? appCtx.default_agent : {};
      document.title = state.applicationDisplayName || "Assistant";
      const globalTitle = document.getElementById("globalTitle");
      if (globalTitle) globalTitle.textContent = state.applicationDisplayName || "Assistant";
      document.getElementById("inputBox").placeholder = state.chatPlaceholder || "输入问题，或输入 / 查看命令";
      renderUnifiedThreadTitle();
    }

    async function dispatchText(text, attachmentIds = []) {
      const res = await fetch(apiDispatchUrl, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          text,
          thread_id: state.threadId,
          application_name: state.applicationName,
          attachment_ids: Array.isArray(attachmentIds) ? attachmentIds.filter(Boolean) : [],
        }),
      });
      const payload = await res.json();
      if (!res.ok || payload.ok === false) {
        throw new Error((payload && payload.error) || `HTTP ${res.status}`);
      }
      return payload;
    }

    function shouldUseCustomToolStream(text, attachmentIds = []) {
      if (Array.isArray(attachmentIds) && attachmentIds.length) return false;
      const raw = String(text || "").trim();
      if (!raw) return false;
      if (/^\/custom_tool\s+(create|edit)\b/i.test(raw)) return true;
      return state.customToolActive && !raw.startsWith("/");
    }

    async function startCustomToolStream(text, assistantMessage, interactionResponse = null) {
      const res = await fetch(apiCustomToolStreamStartUrl, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          text,
          thread_id: state.threadId,
          application_name: state.applicationName,
          ...(interactionResponse ? { interaction_response: interactionResponse } : {}),
        }),
      });
      const payload = await res.json();
      if (!res.ok || payload.ok === false) {
        throw new Error((payload && payload.error) || `HTTP ${res.status}`);
      }
      const streamUrl = withScriptRoot(payload.stream_url || "");
      if (!streamUrl) throw new Error("stream_url 为空");
      updateMessage(assistantMessage, {
        body: "",
        payload: {
          agent_run: {
            status: "running",
            title: "Fin Agent",
            summary: "连接中",
            artifacts: [],
            process: [],
          },
        },
      });
      await new Promise((resolve, reject) => {
        const source = new EventSource(streamUrl);
        source.onmessage = (event) => {
          try {
            const data = JSON.parse(event.data || "{}");
            applyAgentStreamEvent(assistantMessage, data);
            if (data.event === "done") {
              source.close();
              resolve(data);
            }
            if (data.event === "error") {
              source.close();
              reject(new Error(data.message || "stream failed"));
            }
          } catch (err) {
            source.close();
            reject(err);
          }
        };
        source.onerror = () => {
          source.close();
          reject(new Error("智能体运行流连接中断"));
        };
      });
    }

    async function handleAgentInteraction(node) {
      const actionId = String(node?.getAttribute("data-agent-action") || "").trim();
      const interactionId = String(node?.getAttribute("data-interaction-id") || "").trim();
      const intent = String(node?.getAttribute("data-action-intent") || "").trim();
      const expectedRevision = Number(node?.getAttribute("data-expected-revision"));
      if (!actionId || !interactionId) return;
      const input = document.getElementById("inputBox");
      if (intent === "edit") {
        input.value = "";
        input.placeholder = "请直接说明需要修改的内容…";
        input.focus();
        return;
      }
      if (intent !== "accept") return;

      const response = {
        interaction_id: interactionId,
        action_id: actionId,
        action: "accept",
        expected_revision: expectedRevision,
      };
      state.resolvedInteractions[interactionId] = actionId;
      rootActionButtons(actionId).forEach((button) => { button.disabled = true; });
      addMessage("user", node.textContent.trim() || "确认并继续", { interaction_response: response });
      const assistantMessage = addMessage("assistant", "", {
        agent_run: {
          status: "running",
          title: "Fin Agent",
          summary: "正在继续当前任务",
          artifacts: [],
          process: [],
        },
      });
      try {
        await startCustomToolStream("", assistantMessage, response);
        loadThreads().catch(() => null);
        setStatus("");
      } catch (err) {
        delete state.resolvedInteractions[interactionId];
        applyAgentStreamEvent(assistantMessage, {
          event: "error",
          message: String(err.message || err),
        });
        setStatus(String(err.message || err));
      }
    }

    function rootActionButtons(actionId) {
      return Array.from(document.querySelectorAll("[data-agent-action]"))
        .filter((button) => String(button.getAttribute("data-agent-action") || "") === actionId);
    }

    async function uploadFiles(files) {
      const list = Array.from(files || []).filter((file) => file && /^image\//i.test(String(file.type || "")));
      if (!list.length) return;
      const form = new FormData();
      list.forEach((file) => form.append("files", file));
      setStatus("上传图片中...");
      const res = await fetch(apiAttachmentUploadUrl, { method: "POST", body: form });
      const payload = await res.json();
      if (!res.ok || payload.ok === false) {
        throw new Error((payload && payload.error) || `HTTP ${res.status}`);
      }
      state.pendingAttachments.push(...(payload.items || []));
      renderPendingAttachments();
      setStatus("");
    }

    async function fetchJson(url) {
      const res = await fetch(url, { cache: "no-store" });
      const payload = await res.json();
      if (!res.ok || payload.ok === false) {
        throw new Error((payload && payload.error) || `HTTP ${res.status}`);
      }
      return payload;
    }

    async function pollTaskResult(messageItem, jobId) {
      const maxRounds = 120;
      for (let round = 0; round < maxRounds; round += 1) {
        const [jobPayload, stepsPayload] = await Promise.all([
          fetchJson(`${apiTaskBaseUrl}/${encodeURIComponent(jobId)}`),
          fetchJson(`${apiTaskBaseUrl}/${encodeURIComponent(jobId)}/steps`),
        ]);
        const job = jobPayload.job || {};
        const steps = stepsPayload.items || [];
        messageItem.payload.task_state = { job, steps };
        renderMessages();
        if (job.status === "succeeded") {
          const resultPayload = await fetchJson(`${apiTaskBaseUrl}/${encodeURIComponent(jobId)}/result`);
          const results = resultPayload.results || {};
          messageItem.body = `任务执行完成：${messageItem.payload.skill_name || job.task_type || "skill"}`;
          messageItem.payload.task_result = {
            final_output: results.final_output || null,
            render_payload: results.render_payload || null,
          };
          renderMessages();
          return;
        }
        if (job.status === "failed") {
          messageItem.body = `任务执行失败：${job.error_message || "未知错误"}`;
          renderMessages();
          return;
        }
        await new Promise((resolve) => window.setTimeout(resolve, 2000));
      }
      messageItem.body = "任务仍在运行中，请稍后查看任务详情。";
      renderMessages();
    }

    function toCatalogItems(items, kind) {
      if (!Array.isArray(items)) return [];
      if (kind === "skills") return items.map((item) => String(item.skill_name || "").trim()).filter(Boolean);
      if (kind === "tools") return items.map((item) => String(item.tool_name || "").trim()).filter(Boolean);
      if (kind === "agents") return items.map((item) => String(item.agent_name || "").trim()).filter(Boolean);
      if (kind === "applications") return items.map((item) => String(item.application_name || "").trim()).filter(Boolean);
      return [];
    }

    async function fetchCatalog(url, kind) {
      try {
        const res = await fetch(url, { cache: "no-store" });
        const payload = await res.json();
        if (!res.ok || payload.ok === false) return;
        state.catalogs[kind] = toCatalogItems(payload.items || [], kind);
      } catch (_err) {
        state.catalogs[kind] = [];
      }
    }

    async function preloadCatalogs() {
      await Promise.all([
        fetchCatalog(apiSkillCatalogUrl, "skills"),
        fetchCatalog(apiToolCatalogUrl, "tools"),
        fetchCatalog(apiAgentCatalogUrl, "agents"),
        fetchCatalog(apiApplicationCatalogUrl, "applications"),
      ]);
    }

    function hydrateMessagesFromTurns(turns) {
      const items = [];
      let nextId = 1;
      (Array.isArray(turns) ? turns : []).forEach((turn) => {
        const userText = String(turn.user_input_text || "").trim();
        const inputPayload = turn.input_payload && typeof turn.input_payload === "object" ? turn.input_payload : {};
        const inputAttachments = Array.isArray(inputPayload.attachments) ? inputPayload.attachments : [];
        if (userText || inputAttachments.length) {
          items.push({
            id: nextId++,
            role: "user",
            body: userText || `已发送 ${inputAttachments.length} 个图片附件`,
            payload: { attachments: inputAttachments },
          });
        }
        const assistantText = String(turn.assistant_output_text || "").trim();
        const outputPayload = turn.output_payload && typeof turn.output_payload === "object" ? turn.output_payload : {};
        const surfaceBlocks = Array.isArray(outputPayload.surface_blocks) ? outputPayload.surface_blocks : [];
        const hydratedPayload = surfaceBlocks.length ? {
          ...outputPayload,
          agent_run: {
            status: "done",
            title: "Fin Agent",
            summary: assistantText || "任务已完成",
            artifacts: surfaceBlocks.filter((block) => !isProcessStreamBlock(block)),
            process: surfaceBlocks.filter((block) => isProcessStreamBlock(block)),
          },
        } : outputPayload;
        if (assistantText || Object.keys(outputPayload).length) {
          items.push({
            id: nextId++,
            role: "assistant",
            body: surfaceBlocks.length ? "" : (assistantText || "已处理。"),
            payload: hydratedPayload,
          });
        }
      });
      state.messages = items;
      state.nextMessageId = nextId;
      renderMessages();
    }

    async function loadThreads() {
      const payload = await fetchJson(apiAssistantThreadsUrl);
      state.threads = Array.isArray(payload.items) ? payload.items : [];
      renderSessionList();
      return state.threads;
    }

    function refreshThreadsAfterResponse() {
      loadThreads().catch(() => null);
      window.setTimeout(() => loadThreads().catch(() => null), 3000);
    }

    async function loadThread(threadId) {
      const payload = await fetchJson(`${apiAssistantThreadsUrl}/${encodeURIComponent(threadId)}`);
      const thread = payload.thread || {};
      const turns = payload.turns || [];
      state.threadId = thread.thread_id || threadId;
      state.customToolActive = Boolean(payload.custom_tool_active);
      state.resolvedInteractions = {};
      hydrateMessagesFromTurns(turns);
      await loadThreads();
    }

    function buildEntitySuggestions(raw) {
      const normalized = String(raw || "").trimStart();
      const parts = normalized.split(/\s+/);
      const command = String(parts[0] || "").trim();
      const query = normalized.slice(command.length).trim();
      const mappings = {
        "/run-skill": { kind: "skills", label: "执行 skill", prefix: "/run-skill " },
        "/skill": { kind: "skills", label: "查看 skill", prefix: "/skill " },
        "/tool": { kind: "tools", label: "查看 tool", prefix: "/tool " },
        "/agent": { kind: "agents", label: "查看 agent", prefix: "/agent " },
        "/application": { kind: "applications", label: "切换 application", prefix: "/application " },
        "/refine-skill": { kind: "skills", label: "优化 skill", prefix: "/refine-skill " },
      };
      const spec = mappings[command];
      if (!spec) return [];
      if (parts.length > 2 && command !== "/refine-skill") return [];
      const needle = String(query || "").toLowerCase();
      return (state.catalogs[spec.kind] || [])
        .filter((name) => !needle || String(name).toLowerCase().includes(needle))
        .slice(0, 8)
        .map((name) => ({
          command: `${spec.prefix}${name}${command === "/run-skill" || command === "/skill" || command === "/tool" || command === "/agent" || command === "/application" ? " " : " "}`,
          desc: `${spec.label}: ${name}`,
        }));
    }

    function filteredSlashItems(text) {
      const raw = String(text || "").trimStart();
      if (!raw.startsWith("/")) return [];
      const entityItems = buildEntitySuggestions(raw);
      if (entityItems.length) return entityItems;
      return slashCatalog.filter((item) => item.command.startsWith(raw)).slice(0, 8);
    }

    function renderCommandMenu() {
      const menu = document.getElementById("commandMenu");
      if (!state.commandVisible || !state.slashItems.length) {
        menu.className = "command-menu";
        menu.innerHTML = "";
        return;
      }
      menu.className = "command-menu show";
      menu.innerHTML = state.slashItems.map((item, idx) => `
        <div class="command-item ${idx === state.commandIndex ? "active" : ""}" data-command="${escapeHtml(item.command)}">
          <div class="cmd">${escapeHtml(item.command)}</div>
          <div class="desc">${escapeHtml(item.desc)}</div>
        </div>
      `).join("");
      menu.querySelectorAll("[data-command]").forEach((node) => {
        node.addEventListener("mousedown", (event) => {
          event.preventDefault();
          applyCommand(node.getAttribute("data-command") || "");
        });
      });
    }

    function updateSlashMenu() {
      const text = document.getElementById("inputBox").value || "";
      state.slashItems = filteredSlashItems(text);
      state.commandIndex = 0;
      state.commandVisible = text.trimStart().startsWith("/") && state.slashItems.length > 0;
      renderCommandMenu();
    }

    function applyCommand(command) {
      const input = document.getElementById("inputBox");
      input.value = command;
      input.focus();
      state.commandVisible = false;
      renderCommandMenu();
    }

    async function send() {
      const input = document.getElementById("inputBox");
      const text = String(input.value || "").trim();
      const attachments = state.pendingAttachments.slice();
      const attachmentIds = attachments.map((item) => item.attachment_id).filter(Boolean);
      if (!text && !attachments.length) return;
      addMessage("user", text || `已发送 ${attachments.length} 个图片附件`, { attachments });
      input.value = "";
      state.pendingAttachments = [];
      renderPendingAttachments();
      state.commandVisible = false;
      renderCommandMenu();
      setStatus("");
      const useStream = shouldUseCustomToolStream(text, attachmentIds);
      const assistantMessage = addMessage("assistant", "", useStream ? {
        agent_run: {
          status: "running",
          title: "Fin Agent",
          summary: "正在处理",
          artifacts: [],
          process: [],
        },
      } : buildPendingAssistantPayload());
      const placeholderTimer = useStream ? null : startAssistantPlaceholderProgress(assistantMessage);
      try {
        if (useStream) {
          await startCustomToolStream(text, assistantMessage);
          refreshThreadsAfterResponse();
          setStatus("");
          return;
        }
        const payload = await dispatchText(text, attachmentIds);
        if (payload.thread_id) state.threadId = payload.thread_id;
        if (payload.application_context) applyApplicationContext(payload.application_context);
        const patch = payload.thread_context_patch;
        if (patch && Object.prototype.hasOwnProperty.call(patch, "custom_tool_state")) {
          state.customToolActive = Boolean(patch.custom_tool_state);
        }
        stopAssistantPlaceholderProgress(placeholderTimer);
        updateMessage(assistantMessage, {
          body: payload.message || "已处理。",
          payload,
        });
        refreshThreadsAfterResponse();
        const jobId = String(((payload.job || {}).job_id) || "").trim();
        if (payload.mode === "run_skill_submitted" && jobId) {
          pollTaskResult(assistantMessage, jobId).catch((err) => {
            assistantMessage.body = `任务结果同步失败：${String(err.message || err)}`;
            renderMessages();
          });
        }
        setStatus("");
      } catch (err) {
        stopAssistantPlaceholderProgress(placeholderTimer);
        if (useStream) {
          applyAgentStreamEvent(assistantMessage, {
            event: "error",
            message: String(err.message || err),
          });
        } else {
          updateMessage(assistantMessage, {
            body: `处理失败：${String(err.message || err)}`,
            payload: {},
          });
        }
        setStatus(String(err.message || err));
      }
    }

    const inputBox = document.getElementById("inputBox");
    const fileInput = document.getElementById("fileInput");
    const attachBtn = document.getElementById("attachBtn");
    document.getElementById("sendBtn").addEventListener("click", send);

    async function createNewThread() {
      try {
        await fetch(withScriptRoot("/api/assistant/thread/reset"), { method: "POST" });
      } catch (_err) {
      }
      state.messages = [];
      state.threadId = null;
      state.resolvedInteractions = {};
      state.pendingAttachments = [];
      renderPendingAttachments();
      renderMessages();
      addMessage("assistant", state.assistantIntro || "可以直接输入自然语言问题。");
      loadThreads().catch(() => null);
      document.getElementById("historyPanel").classList.remove("mobile-open");
    }

    function toggleMobilePanel(panelId) {
      const panel = document.getElementById(panelId);
      if (!panel) return;
      const shouldOpen = !panel.classList.contains("mobile-open");
      document.querySelectorAll(".sidebar.mobile-open, .harness.mobile-open").forEach((item) => item.classList.remove("mobile-open"));
      if (shouldOpen) panel.classList.add("mobile-open");
    }

    document.getElementById("newThreadBtn").addEventListener("click", createNewThread);
    document.getElementById("newThreadTopBtn").addEventListener("click", createNewThread);
    document.getElementById("mobileHistoryBtn").addEventListener("click", () => toggleMobilePanel("historyPanel"));
    document.getElementById("threadHistoryBtn").addEventListener("click", () => toggleMobilePanel("historyPanel"));
    document.getElementById("mobileHarnessBtn").addEventListener("click", () => toggleMobilePanel("harnessPanel"));
    document.getElementById("historySearch").addEventListener("input", (event) => {
      state.historyQuery = String(event.target.value || "");
      renderSessionList();
    });
    attachBtn.addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", async () => {
      try {
        await uploadFiles(fileInput.files);
      } catch (err) {
        setStatus(String(err.message || err));
      } finally {
        fileInput.value = "";
      }
    });
    document.getElementById("clearBtn").addEventListener("click", async () => {
      try {
        await fetch(withScriptRoot("/api/assistant/thread/reset"), { method: "POST" });
      } catch (_err) {
        // ignore reset transport failure and still clear local state
      }
      state.messages = [];
      state.threadId = null;
      state.resolvedInteractions = {};
      state.pendingAttachments = [];
      renderPendingAttachments();
      renderMessages();
      setStatus("");
      loadThreads().catch(() => null);
    });
    document.addEventListener("click", (event) => {
      const menu = document.getElementById("contextMenu");
      if (!menu.contains(event.target)) {
        hideContextMenu();
      }
    });
    document.getElementById("messages").addEventListener("scroll", hideContextMenu);
    window.addEventListener("resize", hideContextMenu);
    document.addEventListener("keydown", (event) => {
      if (event.key !== "Escape") return;
      document.querySelectorAll(".sidebar.mobile-open, .harness.mobile-open").forEach((item) => item.classList.remove("mobile-open"));
    });
    inputBox.addEventListener("input", updateSlashMenu);
    inputBox.addEventListener("paste", async (event) => {
      const items = Array.from(event.clipboardData?.items || []);
      const files = items
        .filter((item) => /^image\//i.test(String(item.type || "")))
        .map((item) => item.getAsFile())
        .filter(Boolean);
      if (!files.length) return;
      event.preventDefault();
      try {
        await uploadFiles(files);
      } catch (err) {
        setStatus(String(err.message || err));
      }
    });
    inputBox.addEventListener("keydown", (event) => {
      if ((event.metaKey || event.ctrlKey) && event.key === "Enter") {
        event.preventDefault();
        send();
        return;
      }
      if (!state.commandVisible || !state.slashItems.length) return;
      if (event.key === "ArrowDown") {
        event.preventDefault();
        state.commandIndex = (state.commandIndex + 1) % state.slashItems.length;
        renderCommandMenu();
      } else if (event.key === "ArrowUp") {
        event.preventDefault();
        state.commandIndex = (state.commandIndex - 1 + state.slashItems.length) % state.slashItems.length;
        renderCommandMenu();
      } else if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        applyCommand(state.slashItems[state.commandIndex]?.command || "");
      } else if (event.key === "Escape") {
        state.commandVisible = false;
        renderCommandMenu();
      }
    });

    applyApplicationContext({
      application_name: state.applicationName,
      display_name: state.applicationDisplayName,
      chat_placeholder: state.chatPlaceholder,
      assistant_intro: state.assistantIntro,
      default_agent: state.defaultAgent,
    });
    if (state.threadId) {
      loadThread(state.threadId).catch(() => {
        state.messages = [];
        state.resolvedInteractions = {};
        addMessage("assistant", state.assistantIntro || "可以直接输入自然语言问题。");
        loadThreads().catch(() => null);
      });
    } else {
      addMessage("assistant", state.assistantIntro || "可以直接输入自然语言问题。");
      loadThreads().catch(() => null);
    }
    renderPendingAttachments();
    preloadCatalogs().catch(() => null);
  </script>
</body>
</html>
