      const groups = Array.isArray(data?.groups) ? data.groups.filter((item) => item && Array.isArray(item.data) && Array.isArray(item.x_axis)) : [];
      if (groups.length) {
        return `
          <div class="line-chart-wrap">
            <div class="metric-strip">
              ${groups.map((group) => `
                <div class="metric-card" style="grid-column: 1 / -1;">
                  <div class="metric-label">${escapeHtml(group.name || "-")}</div>
                  <div class="render-list">
                    ${(group.x_axis || []).map((label, index) => `
                      <div class="render-list-item">
                        <strong>${escapeHtml(label)}</strong>
                        <span>${escapeHtml(Number(group.data?.[index]))}</span>
                      </div>
                    `).join("")}
                  </div>
                </div>
              `).join("")}
            </div>
          </div>
        `;
      }
      const categories = Array.isArray(data?.x_axis) ? data.x_axis : (Array.isArray(data?.categories) ? data.categories : []);
      const series = Array.isArray(data?.series) ? data.series.filter((item) => item && Array.isArray(item.data)) : [];
      if (!categories.length || !series.length) return '<div class="result-empty">无柱状图数据</div>';
      const primary = series[0];
      const values = primary.data.map((item) => Number(item)).filter((item) => Number.isFinite(item));
      if (!values.length) return '<div class="result-empty">无有效柱状图数值</div>';
      const max = Math.max(...values, 1);
      return `
        <div class="line-chart-wrap">
          <div class="metric-strip">
            ${categories.map((label, index) => {
              const rawValue = Number(primary.data[index]);
              const ratio = Number.isFinite(rawValue) ? Math.max(0, Math.min(100, rawValue / max * 100)) : 0;
              return `
                <div class="metric-card">
                  <div class="metric-label">${escapeHtml(label)}</div>
                  <div class="metric-value">${escapeHtml(Number.isFinite(rawValue) ? rawValue : "-")}</div>
                  <div style="margin-top:8px;height:8px;border-radius:999px;background:#e5e7eb;overflow:hidden;">
                    <div style="width:${ratio}%;height:100%;background:#155eef;"></div>
                  </div>
                </div>
              `;
            }).join("")}
          </div>
        </div>
      `;
    }

    function renderPieChartBlock(data) {
      const items = Array.isArray(data?.items)
        ? data.items.filter((item) => item && Number.isFinite(Number(item.value)))
        : (Array.isArray(data?.series) ? data.series.map((item) => ({ label: item?.label || item?.name, value: item?.value })) : []).filter((item) => item && Number.isFinite(Number(item.value)));
      if (!items.length) return '<div class="result-empty">无饼图数据</div>';
      const total = items.reduce((sum, item) => sum + Number(item.value || 0), 0);
      if (!total) return '<div class="result-empty">无有效饼图数值</div>';
      const colors = ["#155eef", "#f79009", "#12b76a", "#7a5af8", "#f04438", "#0ea5e9"];
      let offset = 0;
      const slices = items.map((item, index) => {
        const value = Number(item.value || 0);
        const angle = value / total * 360;
        const slice = `${colors[index % colors.length]} ${offset}deg ${offset + angle}deg`;
        offset += angle;
        return slice;
      }).join(", ");
      return `
        <div class="line-chart-wrap">
          <div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap;">
            <div style="width:180px;height:180px;border-radius:50%;background:conic-gradient(${slices});border:1px solid #e5e7eb;"></div>
            <div class="line-chart-legend">
              ${items.map((item, index) => `
                <span class="line-chart-legend-item">
                  <span class="line-chart-dot" style="background:${colors[index % colors.length]}"></span>
                  <span>${escapeHtml(item.label || "-")}：${escapeHtml(item.value)}</span>
                </span>
              `).join("")}
            </div>
          </div>
        </div>
      `;
    }

    function renderFlowBlock(data) {
      if (String(data?.format || "").toLowerCase() === "mermaid" && String(data?.code || "").trim()) {
        return renderMermaidMarkup(String(data.code), []);
      }
      const nodes = Array.isArray(data?.nodes) ? data.nodes : (Array.isArray(data) ? data : []);
      if (!nodes.length) return '<div class="result-empty">无流程数据</div>';
      return `
        <div class="render-list">
          ${nodes.map((node, index) => `
            <div class="render-list-item" style="display:grid;gap:8px;">
              <div style="font-weight:700;color:#0f172a;">${escapeHtml(node.label || node.title || node.name || `步骤 ${index + 1}`)}</div>
              ${index < nodes.length - 1 ? '<div style="color:#98a2b3;font-size:12px;">↓</div>' : ''}
            </div>
          `).join("")}
        </div>
      `;
    }

    function mermaidSafeText(value, limit = 56) {
      return String(value || "")
        .replace(/[\r\n\t]+/g, " ")
        .replace(/[<>|{}\[\]#;]/g, " ")
        .replace(/\s+/g, " ")
        .trim()
        .slice(0, limit);
    }

    function buildMermaidFlow(flow) {
      const steps = Array.isArray(flow?.steps) ? flow.steps.filter((item) => item && typeof item === "object") : [];
      const links = Array.isArray(flow?.links) ? flow.links.filter((item) => item && typeof item === "object") : [];
      if (!steps.length) return "";
      const ids = new Map();
      steps.forEach((step, index) => ids.set(String(step.id || `step_${index + 1}`), `N${index}`));
      const lines = ["flowchart TD"];
      const startEndNodes = [];
      const decisionNodes = [];
      const errorNodes = [];
      steps.forEach((step, index) => {
        const nodeId = `N${index}`;
        const label = mermaidSafeText(step.name || step.id || `步骤 ${index + 1}`) || `步骤 ${index + 1}`;
        const quoted = JSON.stringify(label);
        const type = String(step.type || "process").toLowerCase();
        if (["start", "end"].includes(type)) {
          lines.push(`${nodeId}([${quoted}])`);
          startEndNodes.push(nodeId);
        } else if (["decision", "condition"].includes(type)) {
          lines.push(`${nodeId}{${quoted}}`);
          decisionNodes.push(nodeId);
        } else {
          lines.push(`${nodeId}[${quoted}]`);
          if (type === "error") errorNodes.push(nodeId);
        }
      });
      let validLinkCount = 0;
      links.forEach((link) => {
        const from = ids.get(String(link.from || ""));
        const to = ids.get(String(link.to || ""));
        if (!from || !to) return;
        const condition = mermaidSafeText(link.condition || "", 34);
        lines.push(condition ? `${from} -->|${condition}| ${to}` : `${from} --> ${to}`);
        validLinkCount += 1;
      });
      if (!validLinkCount && steps.length > 1) {
        for (let index = 0; index < steps.length - 1; index += 1) lines.push(`N${index} --> N${index + 1}`);
      }
      lines.push("classDef startEnd fill:#edf3ff,stroke:#2457d6,color:#17202d,stroke-width:1.5px");
      lines.push("classDef decision fill:#fff7e8,stroke:#c17a16,color:#17202d,stroke-width:1.5px");
      lines.push("classDef error fill:#fff1f0,stroke:#b23b3b,color:#17202d,stroke-width:1.5px");
      if (startEndNodes.length) lines.push(`class ${startEndNodes.join(",")} startEnd`);
      if (decisionNodes.length) lines.push(`class ${decisionNodes.join(",")} decision`);
      if (errorNodes.length) lines.push(`class ${errorNodes.join(",")} error`);
      return lines.join("\n");
    }

    function renderMermaidMarkup(code, fallbackSteps) {
      const encoded = encodeURIComponent(String(code || ""));
      const steps = Array.isArray(fallbackSteps) ? fallbackSteps : [];
      return `
        <div class="design-mermaid" data-mermaid-code="${escapeHtml(encoded)}">
          <div class="design-mermaid-status">正在绘制流程图…</div>
        </div>
        ${steps.length ? `<details class="design-flow-fallback"><summary>查看文字流程</summary><div class="design-flow">${steps.map((item) => `<div class="design-flow-step"><strong>${escapeHtml(item?.name || item?.id || "步骤")}</strong><span>${escapeHtml(item?.description || "")}</span></div>`).join("")}</div></details>` : ""}
      `;
    }

    function loadMermaidRuntime() {
      if (window.mermaid) return Promise.resolve(window.mermaid);
      if (mermaidRuntimePromise) return mermaidRuntimePromise;
      mermaidRuntimePromise = new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = withScriptRoot(mermaidScriptUrl);
        script.async = true;
        script.onload = () => {
          if (!window.mermaid) {
            reject(new Error("Mermaid runtime 未加载"));
            return;
          }
          window.mermaid.initialize({
            startOnLoad: false,
            securityLevel: "strict",
            theme: "base",
            themeVariables: {
              fontFamily: 'Inter, "PingFang SC", "Microsoft YaHei", sans-serif',
              primaryColor: "#edf3ff",
              primaryBorderColor: "#2457d6",
              lineColor: "#98a2b3",
              textColor: "#17202d",
            },
            flowchart: { htmlLabels: false, curve: "basis", useMaxWidth: false },
          });
          resolve(window.mermaid);
        };
        script.onerror = () => reject(new Error("Mermaid 资源加载失败"));
        document.head.appendChild(script);
      });
      return mermaidRuntimePromise;
    }

    async function renderMermaidDiagrams(root) {
      const nodes = Array.from(root?.querySelectorAll?.("[data-mermaid-code]") || []);
      if (!nodes.length) return;
      try {
        const runtime = await loadMermaidRuntime();
        for (const node of nodes) {
          if (!node.isConnected || node.dataset.mermaidRendered === "true") continue;
          const code = decodeURIComponent(String(node.dataset.mermaidCode || ""));
          if (!code) continue;
          try {
            const renderId = `fin_agent_flow_${Date.now()}_${mermaidRenderSequence++}`;
            const result = await runtime.render(renderId, code);
            if (!node.isConnected) continue;
            node.innerHTML = result.svg;
            node.dataset.mermaidRendered = "true";
            if (typeof result.bindFunctions === "function") result.bindFunctions(node);
          } catch (_error) {
            node.classList.add("error");
            node.innerHTML = '<div class="design-mermaid-status">流程图绘制失败，请查看文字流程。</div>';
          }
        }
      } catch (_error) {
        nodes.forEach((node) => {
          node.classList.add("error");
          node.innerHTML = '<div class="design-mermaid-status">流程图组件加载失败，请查看文字流程。</div>';
        });
      }
    }

    function renderKlineBlock(data) {
      const standardizedCandles = Array.isArray(data?.candles)
        ? data.candles
            .filter((row) => row && typeof row === "object")
            .map((row) => [row.time, row.open, row.close, row.low, row.high, row.volume, row.pct])
        : [];
      const candles = standardizedCandles.length
        ? standardizedCandles
        : (Array.isArray(data?.kline) ? data.kline.filter((row) => Array.isArray(row) && row.length >= 6) : []);
      if (!candles.length) return '<div class="result-empty">无 K 线数据</div>';
      const sampled = candles.slice(-80);
      const width = 680;
      const height = 280;
      const padding = { top: 14, right: 16, bottom: 26, left: 44 };
      const innerWidth = width - padding.left - padding.right;
      const innerHeight = height - padding.top - padding.bottom;
      const lows = sampled.map((row) => Number(row[3])).filter((v) => Number.isFinite(v));
      const highs = sampled.map((row) => Number(row[4])).filter((v) => Number.isFinite(v));
      if (!lows.length || !highs.length) return '<div class="result-empty">无有效 K 线数值</div>';
      let min = Math.min(...lows);
      let max = Math.max(...highs);
      if (min === max) {
        min -= 1;
        max += 1;
      }
      const xFor = (idx) => padding.left + (sampled.length <= 1 ? innerWidth / 2 : (idx / (sampled.length - 1)) * innerWidth);
      const yFor = (value) => padding.top + innerHeight - ((value - min) / (max - min)) * innerHeight;
      const candleWidth = Math.max(4, Math.floor(innerWidth / Math.max(sampled.length, 1) * 0.56));
      const grid = Array.from({ length: 5 }, (_, idx) => {
        const ratio = idx / 4;
        const y = padding.top + ratio * innerHeight;
        const value = max - ratio * (max - min);
        return { y, value };
      });
      const standardizedIndicators = Array.isArray(data?.indicators)
        ? Object.fromEntries((data.indicators || []).filter((item) => item && item.name).map((item) => [item.name, (item.points || []).map((point) => [point.time, point.value])]))
        : {};
      const indicatorMap = Object.keys(standardizedIndicators).length ? standardizedIndicators : (data?.indicators && typeof data.indicators === "object" ? data.indicators : {});
      const indicatorColors = ["#155eef", "#12b76a", "#f79009", "#7a5af8"];
      const indicatorPaths = Object.entries(indicatorMap).slice(0, 4).map(([name, rows], idx) => {
        const points = (Array.isArray(rows) ? rows : [])
          .slice(-sampled.length)
          .map((row, pointIdx) => {
            if (!Array.isArray(row) || row.length < 2 || !Number.isFinite(Number(row[1]))) return "";
            return `${xFor(pointIdx)},${yFor(Number(row[1]))}`;
          })
          .filter(Boolean)
          .join(" ");
        return { name, color: indicatorColors[idx % indicatorColors.length], points };
      }).filter((item) => item.points);
      return `
        <div class="line-chart-wrap">
          <svg class="line-chart-svg" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none">
            ${grid.map((tick) => `
              <g>
                <line x1="${padding.left}" y1="${tick.y}" x2="${width - padding.right}" y2="${tick.y}" stroke="#eaecf0" stroke-width="1" />
                <text x="${padding.left - 8}" y="${tick.y + 4}" text-anchor="end" font-size="11" fill="#667085">${escapeHtml(tick.value.toFixed(2))}</text>
              </g>
            `).join("")}
            ${sampled.map((row, idx) => {
              const label = String(row[0] ?? "");
              const open = Number(row[1]);
              const close = Number(row[2]);
              const low = Number(row[3]);
              const high = Number(row[4]);
              const x = xFor(idx);
              const color = close >= open ? "#f04438" : "#12b76a";
              const top = yFor(Math.max(open, close));
              const bottom = yFor(Math.min(open, close));
              const bodyY = Math.min(top, bottom);
              const bodyH = Math.max(1.5, Math.abs(bottom - top));
              return `
                <g>
                  <line x1="${x}" y1="${yFor(low)}" x2="${x}" y2="${yFor(high)}" stroke="${color}" stroke-width="1.2" />
                  <rect x="${x - candleWidth / 2}" y="${bodyY}" width="${candleWidth}" height="${bodyH}" fill="${color}" opacity="0.82" rx="1" />
                  ${idx % Math.max(1, Math.floor(sampled.length / 6)) === 0 ? `<text x="${x}" y="${height - 6}" text-anchor="middle" font-size="11" fill="#667085">${escapeHtml(label)}</text>` : ""}
                </g>
              `;
            }).join("")}
            ${indicatorPaths.map((item) => `<polyline fill="none" stroke="${item.color}" stroke-width="1.8" points="${item.points}" />`).join("")}
          </svg>
          <div class="line-chart-legend">
            <span class="line-chart-legend-item"><span class="line-chart-dot" style="background:#f04438"></span><span>阳线</span></span>
            <span class="line-chart-legend-item"><span class="line-chart-dot" style="background:#12b76a"></span><span>阴线</span></span>
            ${indicatorPaths.map((item) => `
              <span class="line-chart-legend-item">
                <span class="line-chart-dot" style="background:${item.color}"></span>
                <span>${escapeHtml(item.name)}</span>
              </span>
            `).join("")}
          </div>
        </div>
      `;
    }

    function renderTextListBlock(data) {
      const items = Array.isArray(data?.items) ? data.items : [];
      if (!items.length) return '<div class="result-empty">无列表数据</div>';
      const visibleItems = items.slice(0, STRUCTURED_PREVIEW_MAX_LIST_ITEMS);
      const omitted = Math.max(0, items.length - visibleItems.length);
      return `
        <div class="result-group">
          <ul class="result-list">
          ${visibleItems.map((item) => {
            if (typeof item !== "object" || item == null) return `<li>${escapeHtml(item)}</li>`;
            const title = escapeHtml(item.title || "");
            const desc = escapeHtml(item.desc || item.text || "");
            const time = escapeHtml(item.time || "");
            return `<li><strong>${title}</strong>${time ? ` <span class="result-empty">(${time})</span>` : ""}${desc ? `<div>${desc}</div>` : ""}</li>`;
          }).join("")}
          </ul>
          ${omitted > 0 ? `<div class="result-note">列表共 ${items.length} 项，仅展示前 ${visibleItems.length} 项</div>` : ""}

    function renderMetricStripBlock(data) {
      const items = Array.isArray(data?.items) ? data.items : [];
      if (!items.length) return '<div class="result-empty">无指标数据</div>';
      return `
        <div class="metric-strip">
          ${items.map((item) => `
            <div class="metric-card">
              <div class="metric-label">${escapeHtml(item.label || item.title || "-")}</div>
              <div class="metric-value">${escapeHtml(item.value || "-")}</div>
              <div class="metric-change">${escapeHtml(item.change || item.desc || "")}</div>
            </div>

      `;

    function renderBlock(block) {
      const type = String(block?.type || "").trim();
      const title = escapeHtml(block?.title || "");
      const data = block?.data && typeof block.data === "object" ? block.data : {};
      let body = "";
      if (type === "table") {
        body = renderTableBlock(data);
      } else if (type === "line") {
        body = renderLineChartBlock(data);
      } else if (type === "bar") {
        body = renderBarChartBlock(data);
      } else if (type === "pie") {
        body = renderPieChartBlock(data);
      } else if (type === "flow") {
        body = renderFlowBlock(data);
      } else if (type === "text_list") {
        body = renderTextListBlock(data);
      } else if (type === "metric_strip" || type === "key_metrics") {
        body = renderMetricStripBlock(data.items ? data : { items: Object.entries(data || {}).map(([key, value]) => ({ label: key, value })) });
      } else if (type === "kline") {
        body = renderKlineBlock(data);
      } else {
        body = renderStructuredValue(data);
      }
      return `
        <div class="render-block">
          ${title ? `<div class="render-block-title">${title}</div>` : ""}
          <div class="render-block-body">${body}</div>
        </div>
      `;
    }

    function streamBlockToRenderBlock(block) {
      const blockType = String(block?.block_type || block?.type || "").trim();
      const data = block?.data && typeof block.data === "object" ? block.data : {};
      const mappedType = {
        table: "table",
        bar_chart: "bar",
        line_chart: "line",
        flowchart: "flow",
      }[blockType] || blockType;
      return {
        type: mappedType,
        title: block?.title || "",
        data,
      };
    }

        <div class="design-section"><div class="design-section-title">规则</div>${rules.length ? `<ul class="design-list">${rules.map((item) => `<li class="design-list-item"><strong>${escapeHtml(item?.name || "规则")}</strong><span>${escapeHtml(item?.logic || "")}</span>${Array.isArray(item?.parameters) && item.parameters.length ? `<span class="result-note">参数：${item.parameters.map(escapeHtml).join("；")}</span>` : ""}${item?.on_missing_data ? `<span class="result-note">数据不足：${escapeHtml(item.on_missing_data)}</span>` : ""}</li>`).join("")}</ul>` : renderDesignTextList(legacyLogic)}</div>

    function testFieldLabel(key) {
      const labels = {
