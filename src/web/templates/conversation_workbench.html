<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page_title or "Assistant" }}</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --panel: #ffffff;
      --line: #e4e7ec;
      --text: #101828;
      --muted: #667085;
      --accent: #155eef;
      --accent-soft: #eef4ff;
      --user-bg: #eef4ff;
      --assistant-bg: #ffffff;
      --shadow: 0 12px 32px rgba(16, 24, 40, 0.06);
      --sans: "PingFang SC", "Noto Sans SC", "Helvetica Neue", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      font-family: var(--sans);
      color: var(--text);
      background: linear-gradient(180deg, #f7f8fa 0%, #eef1f5 100%);
    }
    .shell {
      max-width: 1220px;
      height: 100vh;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 16px;
      padding: 20px 18px 24px;
    }
    .sidebar {
      grid-row: 1 / span 3;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 14px;
      display: grid;
      grid-template-rows: auto auto 1fr;
      gap: 12px;
      min-height: 0;
    }
    .sidebar-head {
      display: grid;
      gap: 8px;
    }
    .sidebar-title {
      font-size: 16px;
      font-weight: 700;
    }
    .sidebar-sub {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
    }
    .session-list {
      min-height: 0;
      overflow: auto;
      display: grid;
      gap: 8px;
      align-content: start;
    }
    .session-item {
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fcfcfd;
      padding: 10px;
      cursor: pointer;
      display: grid;
      gap: 5px;
      text-align: left;
    }
    .session-item.active {
      border-color: #cfe0ff;
      background: var(--accent-soft);
    }
    .session-title {
      font-size: 13px;
      font-weight: 700;
      line-height: 1.35;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .session-meta {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
    }
    .topbar,
    .messages,
    .composer {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
    }
    .title {
      display: grid;
      gap: 4px;
    }
    .title h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }
    .title .meta {
      font-size: 12px;
      color: var(--muted);
    }
    .pill-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .pill {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      color: var(--muted);
      background: #fff;
    }
    .messages {
      padding: 18px;
      overflow: auto;
      min-height: 0;
      display: grid;
      gap: 14px;
      align-content: start;
      overflow-x: hidden;
    }
    .message {
      display: grid;
      gap: 8px;
      min-width: 0;
    }
    .message.user {
      justify-items: end;
    }
    .message.assistant {
      justify-items: start;
    }
    .bubble {
      max-width: min(82%, 760px);
      width: fit-content;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 12px 14px;
      line-height: 1.65;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: break-word;
      background: var(--assistant-bg);
    }
    .bubble-attachments {
      width: min(82%, 760px);
      max-width: 100%;
      min-width: 0;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .thumb {
      width: 92px;
      height: 92px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: #fff;
      overflow: hidden;
      position: relative;
      flex: 0 0 auto;
    }
    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .thumb-remove {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 22px;
      height: 22px;
      border: 0;
      border-radius: 999px;
      background: rgba(16, 24, 40, 0.72);
      color: #fff;
      cursor: pointer;
      font-size: 12px;
      line-height: 1;
    }
    .message.user .bubble {
      background: var(--user-bg);
      border-color: #cfe0ff;
    }
    .message.assistant .bubble {
      background: #ffffff;
      border-color: #d0d5dd;
      box-shadow: 0 4px 14px rgba(16, 24, 40, 0.04);
    }
    .message .role {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .04em;
      padding: 0 2px;
    }
    .cards {
      width: min(82%, 760px);
      max-width: 100%;
      min-width: 0;
      display: grid;
      gap: 8px;
    }
    .card {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px;
      background: #fcfcfd;
    }
    .card-title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .card-kv {
      display: grid;
      gap: 6px;
      font-size: 13px;
      line-height: 1.5;
      color: var(--text);
    }
    .card-kv strong {
      color: var(--muted);
      font-weight: 600;
      margin-right: 6px;
    }
    .card-actions {
      margin-top: 10px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .process-panel,
    .result-blocks {
      width: min(82%, 760px);
      max-width: 100%;
      min-width: 0;
      display: grid;
      gap: 10px;
    }
    .assistant-result {
      width: min(82%, 760px);
      max-width: 100%;
      min-width: 0;
      display: grid;
      gap: 12px;
    }
    .process-panel {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 0;
      background: #fafbfc;
      max-height: 260px;
      overflow: hidden;
      color: #667085;
      font-size: 12px;
    }
    .process-panel.thinking {
      background: linear-gradient(180deg, #f8fbff 0%, #f5f8fc 100%);
      border-color: #d7e5ff;
    }
    .process-panel.thinking .process-title {
      color: #344054;
    }
    .process-panel.thinking .process-badge {
      color: #155eef;
      background: #eef4ff;
      border-color: #cfe0ff;
    }
    .process-panel.thinking .process-bar-fill {
      background: linear-gradient(90deg, #528bff 0%, #7aa2ff 100%);
    }
    .process-panel.runtime {
      background: linear-gradient(180deg, #f8fbf8 0%, #f4f8f5 100%);
      border-color: #d6eadb;
    }
    .process-panel.runtime .process-title {
      color: #344054;
    }
    .process-panel.runtime .process-badge {
      color: #027a48;
      background: #ecfdf3;
      border-color: #c7ead8;
    }
    .process-panel.runtime .process-bar-fill {
      background: linear-gradient(90deg, #16a34a 0%, #34c759 100%);
    }
    .process-frame {
      padding: 10px 12px;
    }
    .process-frame > summary {
      list-style: none;
      cursor: pointer;
    }
    .process-frame > summary::-webkit-details-marker {
      display: none;
    }
    .process-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .process-title,
    .result-block-title {
      font-size: 12px;
      font-weight: 700;
    }
    .process-badge {
      font-size: 10px;
      color: #475467;
      background: #f2f4f7;
      border: 1px solid #e4e7ec;
      border-radius: 999px;
      padding: 4px 8px;
    }
    .process-meta {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 11px;
      color: var(--muted);
    }
    .process-bar {
      height: 8px;
      border-radius: 999px;
      background: #edf2f7;
      overflow: hidden;
    }
    .process-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #155eef 0%, #528bff 100%);
    }
    .process-steps {
      display: grid;
      gap: 8px;
      max-height: 150px;
      overflow: auto;
      padding-right: 4px;
    }
    .process-group {
      border-left: 2px solid #d0d5dd;
      padding-left: 10px;
    }
    .process-group details {
      background: transparent;
    }
    .process-group summary {
      cursor: pointer;
      list-style: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 11px;
      font-weight: 600;
      color: #344054;
      padding: 2px 0;
    }
    .process-group summary::-webkit-details-marker {
      display: none;
    }
    .process-group-head {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .process-group-count {
      font-size: 11px;
      color: var(--muted);
      font-weight: 500;
    }
    .process-outline {
      margin: 6px 0 0;
      padding-left: 16px;
      display: grid;
      gap: 6px;
    }
    .process-step {
      font-size: 11px;
      line-height: 1.55;
      color: #475467;
    }
    .process-step-title {
      font-weight: 600;
    }
    .process-step-message {
      color: var(--muted);
      margin-top: 2px;
    }
    .result-block {
      border: 1px solid #d0d5dd;
      border-radius: 16px;
      padding: 14px;
      background: #ffffff;
      box-shadow: 0 8px 20px rgba(16, 24, 40, 0.05);
      display: grid;
      gap: 10px;
    }
    .result-hero {
      border: 1px solid #d0d5dd;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 8px 20px rgba(16, 24, 40, 0.05);
      padding: 14px;
      display: grid;
      gap: 6px;
    }
    .result-hero-title {
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
    }
    .result-hero-summary {
      font-size: 14px;
      line-height: 1.75;
      color: var(--text);
      white-space: pre-wrap;
    }
    .result-panel {
      border: 1px solid #d0d5dd;
      border-radius: 16px;
      background: #ffffff;
      box-shadow: 0 8px 20px rgba(16, 24, 40, 0.05);
      padding: 14px;
      display: grid;
      gap: 12px;
    }
    .result-panel-title {
      font-size: 12px;
      font-weight: 700;
      color: #344054;
    }
    .result-panel-section {
      display: grid;
      gap: 8px;
    }
    .result-panel-section + .result-panel-section {
      padding-top: 10px;
      border-top: 1px solid #eaecf0;
    }
    .result-panel-section-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
    }
    .result-group {
      display: grid;
      gap: 10px;
    }
    .result-section {
      display: grid;
      gap: 6px;
    }
    .result-section-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      text-transform: none;
    }
    .result-text,
    .result-empty {
      font-size: 14px;
      line-height: 1.7;
      white-space: pre-wrap;
    }
    .result-empty {
      color: var(--muted);
    }
    .result-list {
      margin: 0;
      padding-left: 18px;
      font-size: 14px;
      line-height: 1.7;
    }
    .result-note {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
    }
    .result-kv-list {
      display: grid;
      gap: 8px;
    }
    .result-kv-item {
      display: grid;
      grid-template-columns: 128px minmax(0, 1fr);
      gap: 8px;
      align-items: start;
    }
    .result-kv-key {
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
      word-break: break-word;
    }
    .result-kv-value {
      min-width: 0;
    }
    .result-table-wrap {
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      max-width: 100%;
    }
    .result-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    .result-table th,
    .result-table td {
      padding: 8px 10px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }
    .result-table th {
      color: var(--muted);
      font-weight: 700;
      background: #f8fafc;
    }
    .render-sections {
      display: grid;
      gap: 12px;
    }
    .render-section {
      display: grid;
      gap: 10px;
      padding: 0;
    }
    .render-section-head {
      display: grid;
      gap: 4px;
    }
    .render-section-title {
      font-size: 13px;
      font-weight: 700;
    }
    .render-section-desc {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
    }
    .render-block {
      display: grid;
      gap: 8px;
      padding: 10px 0 0;
    }
    .render-block-title {
      font-size: 12px;
      font-weight: 700;
    }
    .agent-run {
      width: min(100%, 860px);
      max-width: 100%;
      min-width: 0;
      display: grid;
      gap: 12px;
      background: transparent;
    }
    .agent-run-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      border-bottom: 1px solid #eef2f7;
      padding-bottom: 10px;
    }
    .agent-run-title {
      font-weight: 800;
      font-size: 14px;
      color: #101828;
    }
    .agent-run-subtitle {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      margin-top: 4px;
    }
    .agent-run-status {
      flex: 0 0 auto;
      border: 1px solid #c7d7fe;
      background: #eef4ff;
      color: #155eef;
      border-radius: 999px;
      padding: 5px 9px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }
    .agent-run-status.done {
      border-color: #abefc6;
      background: #ecfdf3;
      color: #067647;
    }
    .agent-run-status.error {
      border-color: #fecaca;
      background: #fef2f2;
      color: #b42318;
    }
    .agent-artifacts {
      display: grid;
      gap: 12px;
    }
    .agent-stream-block {
      display: grid;
      gap: 8px;
    }
    .agent-stream-title {
      font-size: 12px;
      font-weight: 800;
      color: #344054;
    }
    .agent-markdown {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.65;
      color: #1d2939;
      font-size: 13px;
    }
    .agent-code {
      margin: 0;
      padding: 12px;
      overflow: auto;
      max-height: 380px;
      border-radius: 10px;
      background: #0b1220;
      color: #e5e7eb;
      font-size: 12px;
      line-height: 1.55;
    }
    .agent-process {
      border-top: 1px solid #eef2f7;
      padding-top: 8px;
    }
    .agent-process summary {
      cursor: pointer;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      list-style: none;
    }
    .agent-process summary::-webkit-details-marker {
      display: none;
    }
    .agent-process-list {
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }
    .agent-process-item {
      border-left: 2px solid #d0d5dd;
      padding-left: 10px;
      color: #475467;
      font-size: 12px;
      line-height: 1.55;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .agent-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .agent-action-btn {
      border: 1px solid #d0d5dd;
      background: #fff;
      color: #344054;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .agent-action-btn.primary {
      border-color: #155eef;
      background: #155eef;
      color: #fff;
    }
    .agent-action-btn:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }
    .agent-semantic-block {
      border: 1px solid #dbe3ef;
      border-radius: 8px;
      background: #fff;
      overflow: hidden;
    }
    .agent-semantic-body {
      display: grid;
      gap: 10px;
      padding: 12px;
    }
    .agent-semantic-summary {
      color: #344054;
      font-size: 13px;
      line-height: 1.6;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .agent-kv-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 8px 16px;
      padding-top: 2px;
    }
    .agent-kv-item {
      display: grid;
      gap: 2px;
      min-width: 0;
    }
    .agent-kv-label {
      color: #667085;
      font-size: 11px;
    }
    .agent-kv-value {
      color: #101828;
      font-size: 13px;
      font-weight: 700;
      overflow-wrap: anywhere;
    }
    .agent-logic,
    .agent-issues,
    .agent-questions {
      margin: 0;
      padding-left: 20px;
      color: #475467;
      font-size: 12px;
      line-height: 1.65;
    }
    .agent-live-workflow {
      display: grid;
      gap: 12px;
      padding: 12px;
      border: 1px solid #c9d8fb;
      border-radius: 10px;
      background: #f7f9ff;
    }
    .agent-live-workflow-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .agent-live-workflow-summary {
      color: #1d2939;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.5;
    }
    .agent-live-workflow-status {
      flex: 0 0 auto;
      border-radius: 999px;
      padding: 3px 8px;
      color: #2457d6;
      background: #e8efff;
      font-size: 10px;
      font-weight: 750;
    }
    .agent-live-workflow-status.completed { color: #087a55; background: #eaf8f1; }
    .agent-live-workflow-status.error { color: #b23b3b; background: #fff1f0; }
    .agent-progress-steps {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px 14px;
    }
    .agent-progress-step {
      min-width: 0;
      display: grid;
      grid-template-columns: 14px minmax(0, 1fr);
      gap: 7px;
      align-items: center;
      color: #98a2b3;
      font-size: 11px;
    }
    .agent-progress-step-dot {
      width: 8px;
      height: 8px;
      border: 2px solid #cbd5e1;
      border-radius: 50%;
      background: #fff;
    }
    .agent-progress-step.completed { color: #475467; }
    .agent-progress-step.completed .agent-progress-step-dot { border-color: #12a071; background: #12a071; }
    .agent-progress-step.running { color: #2457d6; font-weight: 700; }
    .agent-progress-step.running .agent-progress-step-dot {
      border-color: #2457d6;
      box-shadow: 0 0 0 4px rgba(36, 87, 214, .12);
    }
    .agent-progress-step.error { color: #b23b3b; }
    .agent-progress-step.error .agent-progress-step-dot { border-color: #b23b3b; background: #b23b3b; }
    .agent-assessment-status {
      width: fit-content;
      border: 1px solid #d0d5dd;
      border-radius: 999px;
      padding: 3px 8px;
      color: #475467;
      font-size: 11px;
      font-weight: 700;
    }
    .agent-assessment-status.pass {
      border-color: #abefc6;
      background: #ecfdf3;
      color: #067647;
    }
    .agent-assessment-status.fail {
      border-color: #fecdca;
      background: #fef3f2;
      color: #b42318;
    }
    .agent-test-cases {
      display: grid;
      gap: 10px;
    }
    .agent-test-case {
      display: grid;
      gap: 10px;
      padding: 11px;
      border: 1px solid #e4e7ec;
      border-radius: 8px;
      background: #f9fafb;
    }
    .agent-test-case-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      color: #344054;
      font-size: 12px;
      font-weight: 750;
    }
    .agent-test-case-status {
      color: #067647;
      font-size: 11px;
    }
    .agent-test-section {
      display: grid;
      gap: 6px;
    }
    .agent-test-section-title {
      color: #667085;
      font-size: 11px;
      font-weight: 700;
    }
    .agent-test-table-wrap {
      overflow-x: auto;
      border: 1px solid #e4e7ec;
      border-radius: 7px;
      background: #fff;
    }
    .agent-test-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 620px;
      font-size: 11px;
    }
    .agent-test-table th,
    .agent-test-table td {
      padding: 7px 9px;
      border-bottom: 1px solid #eef2f6;
      text-align: left;
      white-space: nowrap;
    }
    .agent-test-table th {
      color: #667085;
      background: #f8fafc;
      font-weight: 700;
    }
    .agent-test-table td {
      color: #1d2939;
    }
    .agent-execution-logs {
      display: grid;
      gap: 6px;
    }
    .agent-execution-log {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 8px;
      align-items: start;
      padding: 8px;
      border-radius: 7px;
      background: #fff;
      border: 1px solid #e4e7ec;
    }
    .agent-log-level {
      border-radius: 999px;
      padding: 2px 6px;
      background: #eef4ff;
      color: #3538cd;
      font-size: 9px;
      font-weight: 800;
      text-transform: uppercase;
    }
    .agent-log-level.info {
      background: #ecfdf3;
      color: #067647;
    }
    .agent-log-content {
      display: grid;
      gap: 5px;
      min-width: 0;
    }
    .agent-log-message {
      color: #344054;
      font-size: 11px;
      font-weight: 700;
    }
    .design-artifact-tabs {
      display: flex;
      gap: 2px;
      overflow-x: auto;
      border-bottom: 1px solid #e4e7ec;
      scrollbar-width: thin;
    }
    .design-artifact-tab {
      flex: 0 0 auto;
      border: 0;
      border-bottom: 2px solid transparent;
      background: transparent;
      color: #667085;
      padding: 9px 10px 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .design-artifact-tab.active {
      border-bottom-color: #155eef;
      color: #155eef;
    }
    .design-artifact-view {
      display: none;
      gap: 14px;
      padding-top: 2px;
    }
    .design-artifact-view.active {
      display: grid;
    }
    .design-section {
      display: grid;
      gap: 7px;
      min-width: 0;
    }
    .design-section + .design-section {
      border-top: 1px solid #eef2f6;
      padding-top: 12px;
    }
    .design-section-title {
      color: #344054;
      font-size: 12px;
      font-weight: 800;
    }
    .design-copy {
      color: #475467;
      font-size: 12px;
      line-height: 1.65;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .design-list {
      display: grid;
      gap: 6px;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .design-list-item {
      display: grid;
      gap: 3px;
      border-left: 2px solid #d0d5dd;
      padding-left: 9px;
      color: #475467;
      font-size: 12px;
      line-height: 1.55;
    }
    .design-list-item strong {
      color: #1d2939;
    }
    .design-field-list {
      display: grid;
      border-top: 1px solid #eaecf0;
    }
    .design-field-row {
      display: grid;
      grid-template-columns: minmax(120px, .8fr) minmax(100px, .55fr) minmax(0, 1.65fr);
      gap: 12px;
      align-items: start;
      border-bottom: 1px solid #eaecf0;
      padding: 9px 0;
      font-size: 12px;
      line-height: 1.5;
    }
    .design-field-name {
      display: grid;
      gap: 2px;
      min-width: 0;
    }
    .design-field-name strong,
    .design-field-name span {
      overflow-wrap: anywhere;
    }
    .design-field-name span,
    .design-field-meta {
      color: #667085;
      font-size: 11px;
    }
    .design-flow {
      display: flex;
      gap: 8px;
      align-items: stretch;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .design-flow-step {
      position: relative;
      flex: 0 0 min(180px, 45vw);
      border-left: 3px solid #84adff;
      padding: 7px 10px;
      background: #f8faff;
      font-size: 11px;
      line-height: 1.5;
    }
    .design-flow-step + .design-flow-step::before {
      content: "→";
      position: absolute;
      left: -10px;
      top: 50%;
      transform: translate(-100%, -50%);
      color: #98a2b3;
    }
    .design-flow-step strong,
    .design-flow-step span {
      display: block;
    }
    .design-flow-step span {
      margin-top: 3px;
      color: #667085;
    }
    .design-mermaid {
      min-height: 180px;
      max-height: 540px;
      overflow: auto;
      padding: 12px;
      border: 1px solid #d9e0e8;
      border-radius: 10px;
      background: #fbfcfe;
    }
    .design-mermaid svg {
      display: block;
      min-width: 680px;
      max-width: none !important;
      height: auto;
      margin: 0 auto;
    }
    .design-mermaid-status {
      min-height: 154px;
      display: grid;
      place-items: center;
      color: #667085;
      font-size: 11px;
    }
    .design-mermaid.error .design-mermaid-status { color: #b42318; }
    .design-flow-fallback { margin-top: 8px; }
    .design-flow-fallback summary {
      cursor: pointer;
      color: #667085;
      font-size: 11px;
      font-weight: 650;
    }
    .design-flow-fallback .design-flow { margin-top: 8px; }
    .design-data-row {
      display: grid;
      grid-template-columns: minmax(120px, .8fr) minmax(0, 1.7fr) auto;
      gap: 10px;
      align-items: start;
      border-bottom: 1px solid #eaecf0;
      padding: 9px 0;
      font-size: 12px;
      line-height: 1.5;
    }
    .design-data-row:last-child {
      border-bottom: 0;
    }
    .design-data-status {
      border: 1px solid #d0d5dd;
      border-radius: 999px;
      padding: 2px 7px;
      color: #475467;
      font-size: 10px;
      font-weight: 700;
      white-space: nowrap;
    }
    .design-data-status.verified {
      border-color: #abefc6;
      background: #ecfdf3;
      color: #067647;
    }
    .design-data-status.unavailable {
      border-color: #fecdca;
      background: #fef3f2;
      color: #b42318;
    }
    .agent-question-list {
      display: grid;
      gap: 14px;
    }
    .agent-question {
      display: grid;
      gap: 7px;
      border-top: 1px solid #eaecf0;
      padding-top: 12px;
    }
    .agent-question:first-child {
      border-top: 0;
      padding-top: 0;
    }
    .agent-question-title {
      color: #1d2939;
      font-size: 13px;
      font-weight: 800;
      line-height: 1.5;
    }
    .agent-question-required {
      color: #b42318;
      font-size: 11px;
      font-weight: 700;
    }
    .agent-question-reason {
      color: #667085;
      font-size: 11px;
      line-height: 1.55;
    }
    .agent-question-options {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }
    .agent-question-option {
      border: 1px solid #d0d5dd;
      border-radius: 7px;
      background: #fff;
      color: #344054;
      padding: 7px 9px;
      text-align: left;
      font-size: 11px;
      line-height: 1.4;
      cursor: pointer;
    }
    .agent-question-option:hover,
    .agent-question-option.selected {
      border-color: #84adff;
      background: #f5f8ff;
      color: #1849a9;
    }
    .agent-question-option small {
      display: block;
      margin-top: 2px;
      color: #667085;
    }
    .agent-question-option em {
      margin-left: 5px;
      color: #155eef;
      font-style: normal;
      font-weight: 700;
    }
    .design-review-strip {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 8px 16px;
      border-top: 1px solid #eaecf0;
      padding-top: 10px;
      color: #667085;
      font-size: 11px;
    }
    .design-review-strip strong {
      display: block;
      margin-top: 2px;
      color: #1d2939;
      font-size: 12px;
    }
    .metric-strip {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 8px;
    }
    .metric-card {
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      display: grid;
      gap: 4px;
    }
    .metric-label {
      font-size: 11px;
      color: var(--muted);
    }
    .metric-value {
      font-size: 14px;
      font-weight: 700;
    }
    .metric-change {
      font-size: 11px;
      color: var(--muted);
    }
    .line-chart-wrap {
      display: grid;
      gap: 8px;
      overflow: auto;
    }
    .line-chart-svg {
      width: 100%;
      min-width: 520px;
      height: 240px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
    }
    .line-chart-legend {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 12px;
      color: var(--muted);
    }
    .line-chart-legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .line-chart-dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      display: inline-block;
    }
    .reference-materials {
      width: min(82%, 760px);
      max-width: 100%;
      min-width: 0;
      display: grid;
      gap: 8px;
    }
    .reference-block {
      border: 1px dashed #d0d5dd;
      border-radius: 14px;
      padding: 10px 12px;
      background: #fbfcfd;
      color: #475467;
      font-size: 12px;
      display: grid;
      gap: 8px;
    }
    .reference-title {
      font-size: 12px;
      font-weight: 700;
      color: #344054;
    }
    .reference-list {
      display: grid;
      gap: 6px;
    }
    .reference-item {
      display: grid;
      gap: 2px;
    }
    .reference-link {
      color: #155eef;
      text-decoration: none;
      word-break: break-all;
    }
    .reference-meta {
      color: #667085;
      font-size: 11px;
    }
    .mini-btn,
    .btn {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      color: var(--text);
      cursor: pointer;
      font: inherit;
    }
    .mini-btn {
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 600;
    }
    .composer {
      padding: 14px;
      display: grid;
      gap: 10px;
      position: relative;
    }
    .status {
      display: none;
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 13px;
      white-space: pre-wrap;
      background: #fff7ed;
      color: #9a3412;
      border: 1px solid #fed7aa;
    }
    .status.show { display: block; }
    .attachment-strip {
      display: none;
      gap: 8px;
      flex-wrap: wrap;
    }
    .attachment-strip.show {
      display: flex;
    }
    textarea {
      width: 100%;
      min-height: 96px;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      font: inherit;
      resize: vertical;
      background: #fff;
      color: var(--text);
      outline: none;
    }
    textarea:focus {
      border-color: #b2ccff;
      box-shadow: 0 0 0 4px rgba(21, 94, 239, 0.08);
    }
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .toolbar-left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .toolbar-right {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn {
      padding: 10px 14px;
      font-weight: 600;
    }
    .btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .hint {
      font-size: 12px;
      color: var(--muted);
    }
    .command-menu {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: calc(100% + 8px);
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
      box-shadow: var(--shadow);
      overflow: hidden;
      display: none;
      z-index: 20;
    }
    .command-menu.show { display: block; }
    .command-item {
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      cursor: pointer;
      display: grid;
      gap: 2px;
    }
    .command-item:last-child {
      border-bottom: 0;
    }
    .command-item.active {
      background: var(--accent-soft);
    }
    .command-item .cmd {
      font-size: 13px;
      font-weight: 700;
    }
    .command-item .desc {
      font-size: 12px;
      color: var(--muted);
    }
    .context-menu {
      position: fixed;
      min-width: 168px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      box-shadow: var(--shadow);
      overflow: hidden;
      display: none;
      z-index: 40;
    }
    .context-menu.show {
      display: block;
    }
    .context-item {
      width: 100%;
      text-align: left;
      border: 0;
      background: #fff;
      color: var(--text);
      cursor: pointer;
      padding: 10px 12px;
      font: inherit;
      font-size: 13px;
      border-bottom: 1px solid var(--line);
    }
    .context-item:last-child {
      border-bottom: 0;
    }
    .context-item:hover {
      background: var(--accent-soft);
    }
    @media (max-width: 760px) {
      body {
        height: auto;
        overflow: auto;
      }
      .shell {
        height: auto;
        padding: 10px;
        gap: 12px;
        grid-template-columns: 1fr;
        grid-template-rows: auto auto minmax(0, 1fr) auto;
      }
      .sidebar {
        grid-row: auto;
      }
      .topbar {
        align-items: start;
        padding: 12px;
      }
      .bubble,
      .cards,
      .process-panel,
      .result-blocks {
        max-width: 100%;
        width: 100%;
      }
      .messages {
        padding: 12px;
      }
      .composer {
        padding: 12px;
      }
      textarea {
        min-height: 84px;
        padding: 12px;
      }
      .toolbar {
        align-items: stretch;
      }
      .toolbar-left,
      .toolbar-right {
        width: 100%;
      }
      .toolbar-right {
        justify-content: space-between;
      }
      .btn {
        flex: 1 1 auto;
      }
      .design-field-row,
      .design-data-row {
        grid-template-columns: minmax(0, 1fr);
        gap: 4px;
      }
      .design-data-status {
        justify-self: start;
      }
      .agent-question-option {
        width: 100%;
      }
    }

    /* Unified Fin Agent shell. Scenario-specific UI stays inside message blocks. */
    :root {
      --bg: #f3f5f8;
      --panel: #ffffff;
      --line: #d9e0e8;
      --line-strong: #b9c4d1;
      --text: #17202d;
      --muted: #667085;
      --accent: #2457d6;
      --accent-soft: #edf3ff;
      --surface-soft: #f8fafc;
      --shadow: 0 16px 42px rgba(16, 24, 40, 0.1);
    }
    body {
      color: var(--text);
      background: var(--bg);
    }
    .app {
      height: 100vh;
      display: grid;
      grid-template-rows: 54px minmax(0, 1fr);
    }
    .global-bar {
      min-width: 0;
      display: grid;
      grid-template-columns: 238px minmax(0, 1fr) 314px;
      align-items: center;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      z-index: 30;
    }
    .brand {
      height: 100%;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 0 13px;
      border-right: 1px solid var(--line);
    }
    .brand-mark {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 7px;
      color: #fff;
      background: var(--text);
      font-size: 12px;
      font-weight: 800;
    }
    .brand strong { font-size: 13px; }
    .global-center {
      min-width: 0;
      padding: 0 14px;
    }
    .global-center strong {
      display: block;
      overflow: hidden;
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .global-actions {
      height: 100%;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 7px;
      padding: 0 12px;
      border-left: 1px solid var(--line);
    }
    .status-pill {
      min-height: 25px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid #c9d8fb;
      border-radius: 999px;
      padding: 3px 8px;
      color: var(--accent);
      background: var(--accent-soft);
      font-size: 10px;
      font-weight: 750;
      white-space: nowrap;
    }
    .status-pill.done { color: #087a55; border-color: #b9dfcd; background: #eaf8f1; }
    .status-pill.error { color: #b23b3b; border-color: #edc1bf; background: #fff1f0; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
    .icon-button {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 7px;
      color: var(--text);
      background: var(--panel);
      cursor: pointer;
      font: inherit;
      font-size: 17px;
    }
    .icon-button:hover { border-color: var(--line-strong); background: var(--surface-soft); }
    .mobile-only { display: none; }
    .shell {
      width: 100%;
      max-width: none;
      height: auto;
      min-height: 0;
      margin: 0;
      padding: 0;
      display: grid;
      grid-template-columns: 238px minmax(560px, 1fr) 314px;
      grid-template-rows: minmax(0, 1fr);
      gap: 1px;
      background: var(--line);
    }
    .sidebar,
    .conversation,
    .harness {
      min-width: 0;
      min-height: 0;
      background: var(--panel);
    }
    .sidebar {
      grid-row: auto;
      padding: 0;
      border: 0;
      border-radius: 0;
      box-shadow: none;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr) auto;
      gap: 0;
    }
    .sidebar-head {
      display: block;
      padding: 10px;
      border-bottom: 1px solid var(--line);
    }
    .sidebar-head .btn { width: 100%; justify-content: flex-start; }
    .history-search {
      padding: 8px 10px;
      border-bottom: 1px solid var(--line);
    }
    .history-search input {
      width: 100%;
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 7px 9px;
      color: var(--text);
      background: var(--surface-soft);
      outline: none;
    }
    .session-list {
      padding: 6px;
      gap: 2px;
    }
    .session-item {
      border: 1px solid transparent;
      border-radius: 7px;
      padding: 9px 10px;
      background: transparent;
    }
    .session-item:hover { background: var(--surface-soft); }
    .session-item.active {
      border-color: #c9d8fb;
      background: var(--accent-soft);
    }
    .sidebar-foot {
      padding: 10px 12px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 11px;
    }
    .conversation {
      display: grid;
      grid-template-rows: 46px minmax(0, 1fr) auto;
    }
    .topbar {
      min-width: 0;
      padding: 0 14px;
      border: 0;
      border-bottom: 1px solid var(--line);
      border-radius: 0;
      box-shadow: none;
    }
    .title h1 { font-size: 12px; }
    .title .meta { font-size: 10px; }
    .messages {
      min-height: 0;
      padding: 0;
      border: 0;
      border-radius: 0;
      box-shadow: none;
      gap: 0;
      background: var(--panel);
    }
    .message {
      width: 100%;
      padding: 18px clamp(18px, 5vw, 64px);
      display: grid;
      grid-template-columns: 28px minmax(0, 760px);
      justify-content: center;
      align-items: start;
      column-gap: 12px;
      row-gap: 8px;
      border-bottom: 1px solid #eef1f4;
    }
    .message.user,
    .message.assistant { justify-items: stretch; }
    .message.user { background: var(--surface-soft); }
    .message .role {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      margin: 0;
      border-radius: 7px;
      color: #fff;
      background: var(--text);
      font-size: 0;
      font-weight: 800;
      grid-row: 1 / span 20;
    }
    .message .role::after { content: "FA"; font-size: 9px; }
    .message.user .role { color: var(--text); background: #e4e9ef; }
    .message.user .role::after { content: "你"; font-size: 10px; }
    .message > :not(.role) { grid-column: 2; }
    .bubble,
    .bubble-attachments,
    .cards,
    .process-panel,
    .result-blocks,
    .agent-run,
    .reference-materials {
      width: 100%;
      max-width: 760px;
    }
    .bubble {
      width: 100%;
      padding: 1px 0;
      border: 0;
      border-radius: 0;
      line-height: 1.7;
      background: transparent;
    }
    .composer-shell {
      padding: 10px clamp(14px, 4vw, 50px) 14px;
      border-top: 1px solid var(--line);
      background: var(--panel);
    }
    .composer {
      max-width: 820px;
      margin: 0 auto;
      padding: 10px;
      border: 1px solid var(--line-strong);
      border-radius: 12px;
      box-shadow: 0 5px 18px rgba(16, 24, 40, 0.07);
    }
    .composer textarea {
      min-height: 64px;
      max-height: 180px;
      padding: 8px 9px;
      border: 0;
      border-radius: 6px;
      resize: none;
    }
    .composer textarea:focus { box-shadow: none; }
    .composer .btn { min-height: 34px; padding: 7px 11px; border-radius: 7px; font-size: 11px; }
    .harness {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
    }
    .panel-head {
      min-height: 46px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 0 12px;
      border-bottom: 1px solid var(--line);
      font-size: 11px;
      font-weight: 750;
    }
    .harness-scroll { min-height: 0; overflow: auto; }
    .harness-section { padding: 12px; border-bottom: 1px solid var(--line); }
    .harness-section h3 {
      margin: 0 0 9px;
      color: var(--muted);
      font-size: 9px;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .run-line {
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr);
      gap: 8px;
      padding: 6px 0;
      border-bottom: 1px solid #eef1f4;
      font-size: 11px;
    }
    .run-line:last-child { border-bottom: 0; }
    .run-line span { color: var(--muted); }
    .run-line strong { overflow-wrap: anywhere; font-weight: 650; }
    .harness-empty { color: var(--muted); font-size: 11px; line-height: 1.7; }
    .harness-event {
      padding: 8px 0;
      border-bottom: 1px solid #eef1f4;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.55;
    }
    .harness-event strong { display: block; margin-bottom: 2px; color: var(--text); font-size: 11px; }
    .harness-timeline { display: grid; }
    .harness-step {
      position: relative;
      display: grid;
      grid-template-columns: 14px minmax(0, 1fr) auto;
      gap: 7px;
      align-items: center;
      min-height: 30px;
      color: #98a2b3;
      font-size: 10px;
    }
    .harness-step::before {
      content: "";
      position: absolute;
      left: 5px;
      top: 20px;
      bottom: -10px;
      width: 1px;
      background: #e4e7ec;
    }
    .harness-step:last-child::before { display: none; }
    .harness-step-dot { width: 11px; height: 11px; border: 2px solid #d0d5dd; border-radius: 50%; background: #fff; z-index: 1; }
    .harness-step.completed { color: #475467; }
    .harness-step.completed .harness-step-dot { border-color: #12a071; background: #12a071; }
    .harness-step.running { color: #2457d6; font-weight: 700; }
    .harness-step.running .harness-step-dot { border-color: #2457d6; }
    .harness-step.error { color: #b23b3b; }
    .harness-step.error .harness-step-dot { border-color: #b23b3b; background: #b23b3b; }
    .harness-step-state { font-size: 9px; font-weight: 650; }
    .harness-foot {
      padding: 10px 12px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 10px;
      line-height: 1.5;
    }
    @media (max-width: 1100px) {
      .global-bar { grid-template-columns: 210px minmax(0, 1fr) 280px; }
      .shell { grid-template-columns: 210px minmax(480px, 1fr) 280px; }
      .message { padding-inline: 24px; }
    }
    @media (max-width: 860px) {
      body { height: 100vh; overflow: hidden; }
      .app { height: 100vh; }
      .global-bar { grid-template-columns: minmax(0, 1fr) auto; }
      .brand { border-right: 0; }
      .global-center, .global-actions .status-pill { display: none; }
      .global-actions { border-left: 0; }
      .mobile-only { display: grid; }
      .shell { height: auto; padding: 0; grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr); }
      .conversation { height: calc(100vh - 54px); }
      .sidebar, .harness {
        position: fixed;
        top: 54px;
        bottom: 0;
        z-index: 70;
        display: none;
        width: min(320px, 88vw);
      }
      .sidebar { left: 0; box-shadow: 16px 0 40px rgba(16,24,40,.16); }
      .harness { right: 0; box-shadow: -16px 0 40px rgba(16,24,40,.16); }
      .sidebar.mobile-open, .harness.mobile-open { display: grid; }
      .message { grid-template-columns: 26px minmax(0, 1fr); padding: 16px 13px; }
      .message .role { width: 26px; height: 26px; }
      .composer-shell { padding: 8px 10px 10px; }
      .toolbar-right { width: auto; }
      .btn { flex: initial; }
      .agent-progress-steps { grid-template-columns: minmax(0, 1fr); }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="global-bar">
      <div class="brand"><div class="brand-mark">FA</div><strong>Fin Agent</strong></div>
      <div class="global-center"><strong id="globalTitle">{{ application_display_name or "Assistant" }}</strong></div>
      <div class="global-actions">
        <span class="status-pill" id="globalRunStatus"><span class="status-dot"></span><span id="globalRunStatusText">就绪</span></span>
        <button class="icon-button mobile-only" id="mobileHistoryBtn" type="button" title="历史对话" aria-label="打开历史对话">☰</button>
        <button class="icon-button mobile-only" id="mobileHarnessBtn" type="button" title="运行信息" aria-label="打开运行信息">◫</button>
        <button class="icon-button" id="newThreadTopBtn" type="button" title="新建对话" aria-label="新建对话">＋</button>
      </div>
    </header>

    <div class="shell">
      <aside class="sidebar" id="historyPanel">
        <div class="sidebar-head"><button id="newThreadBtn" class="btn" type="button">＋ 新建对话</button></div>
        <div class="history-search"><input id="historySearch" type="search" aria-label="搜索对话" placeholder="搜索对话"></div>
        <div id="sessionList" class="session-list"></div>
        <div class="sidebar-foot">个人工作区</div>
      </aside>

      <section class="conversation">
        <header class="topbar">
          <button class="icon-button mobile-only" id="threadHistoryBtn" type="button" title="历史对话" aria-label="打开历史对话">☰</button>
          <div class="title">
            <h1 id="threadTitle">{{ application_display_name or "Assistant" }}</h1>
            <div class="meta" id="threadMeta">统一对话工作台</div>
          </div>
        </header>

        <main id="messages" class="messages"></main>

        <footer class="composer-shell">
          <section class="composer">
            <div id="commandMenu" class="command-menu"></div>
            <div id="status" class="status"></div>
            <div id="attachmentStrip" class="attachment-strip"></div>
            <textarea id="inputBox" aria-label="消息输入" placeholder="{{ chat_placeholder or '输入问题，或输入 / 查看命令' }}"></textarea>
            <input id="fileInput" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden>
            <div class="toolbar">
              <div class="hint">⌘ / Ctrl + Enter 发送</div>
              <div class="toolbar-right">
                <button id="attachBtn" class="btn" type="button">上传图片</button>
                <button id="clearBtn" class="btn" type="button">清空</button>
                <button id="sendBtn" class="btn primary" type="button">发送</button>
              </div>
            </div>
          </section>
        </footer>
      </section>

      <aside class="harness" id="harnessPanel">
        <div class="panel-head"><span>运行信息</span><span id="harnessStatusLabel">就绪</span></div>
        <div class="harness-scroll" id="harnessContent">
          <section class="harness-section"><div class="harness-empty">开始对话后，这里会显示当前运行阶段和精简过程。业务产物仍显示在对话回答中。</div></section>
        </div>
        <div class="harness-foot">所有场景共用同一工作台；差异只体现在回答卡片与交互控件。</div>
      </aside>
    </div>
  </div>
  <div id="contextMenu" class="context-menu"></div>

  <script>
    const rawApiDispatchUrl = {{ api_dispatch_url|tojson }};
    const rawApiApplicationBaseUrl = {{ api_application_base_url|tojson }};
    const rawApiSkillCatalogUrl = {{ api_skill_catalog_url|tojson }};
    const rawApiToolCatalogUrl = {{ api_tool_catalog_url|tojson }};
    const rawApiAgentCatalogUrl = {{ api_agent_catalog_url|tojson }};
    const rawApiApplicationCatalogUrl = {{ api_application_catalog_url|tojson }};
    const rawApiTaskBaseUrl = {{ api_task_base_url|tojson }};
    const rawApiAttachmentUploadUrl = {{ api_attachment_upload_url|tojson }};
    const rawApiAssistantThreadsUrl = {{ api_assistant_threads_url|tojson }};
    const rawApiCustomToolStreamStartUrl = {{ api_custom_tool_stream_start_url|tojson }};
    const mermaidScriptUrl = {{ url_for('static', filename='vendor/mermaid/mermaid.min.js')|tojson }};
    const rawScriptRoot = {{ (script_root or "")|tojson }};
    let mermaidRuntimePromise = null;
    let mermaidRenderSequence = 0;
    const state = {
      messages: [],
      nextMessageId: 1,
      threadId: {{ initial_thread_id|tojson }},
      applicationName: {{ application_name|tojson }},
      applicationDisplayName: {{ application_display_name|tojson }},
      chatPlaceholder: {{ (chat_placeholder or "")|tojson }},
      assistantIntro: {{ (assistant_intro or "可以直接输入自然语言问题。")|tojson }},
      assistantAgent: {{ (assistant_agent or {})|tojson }},
      defaultAgent: {{ (default_agent or {})|tojson }},
      guestUserId: {{ (guest_user_id or "")|tojson }},
      slashItems: [],
      commandVisible: false,
      commandIndex: 0,
      catalogs: {
        skills: [],
        tools: [],
        agents: [],
        applications: [],
      },
      pendingAttachments: [],
      customToolActive: false,
      resolvedInteractions: {},
      threads: [],
      historyQuery: "",
      contextMenu: {
        visible: false,
        x: 0,
        y: 0,
        messageId: null,
      },
    };

    const slashCatalog = [
      { command: "/applications", desc: "查看 applications" },
      { command: "/agents", desc: "查看 agents" },
      { command: "/skills", desc: "查看 skills" },
      { command: "/tools", desc: "查看 tools" },
      { command: "/tasks", desc: "查看 tasks" },
      { command: "/new-skill ", desc: "新建 skill 模板" },
      { command: "/draft-skill ", desc: "根据自然语言生成 skill 草稿" },
      { command: "/refine-skill ", desc: "基于已有 skill 生成优化草稿" },
      { command: "/run-skill ", desc: "直接执行指定 skill" },
      { command: "/custom_tool create ", desc: "用自然语言创建个人工具" },
      { command: "/custom_tool edit ", desc: "优化进行中的个人工具设计" },
      { command: "/custom_tool commit ", desc: "发布已通过测试的个人工具" },
      { command: "/new-application ", desc: "新建 application" },
      { command: "/new-agent ", desc: "新建 agent" },
      { command: "/application ", desc: "切换或查看 application" },
      { command: "/agent ", desc: "查看 agent" },
    ];

    function inferScriptRoot() {
      const explicit = String(rawScriptRoot || "").trim().replace(/\/+$/, "");
      if (explicit) return explicit;
      const pathname = String(window.location.pathname || "").trim();
      const markers = [
        "/assistant/",
        "/assistant",
        "/skills/studio/",
        "/skills/studio",
        "/applications/studio/",
        "/applications/studio",
        "/agents/studio/",
        "/agents/studio",
        "/tools/studio/",
        "/tools/studio",
        "/tools/",
        "/tools",
        "/router/studio/",
        "/router/studio",
        "/studio/",
        "/studio",
      ];
      for (const marker of markers) {
        const idx = pathname.indexOf(marker);
        if (idx > 0) return pathname.slice(0, idx);
        if (idx === 0) return "";
      }
      return "";
    }

    const scriptRoot = inferScriptRoot();

    function withScriptRoot(path) {
      const raw = String(path || "").trim();
      if (!raw) return "";
      if (/^https?:\/\//i.test(raw)) return raw;
      if (!raw.startsWith("/")) return raw;
      const base = String(scriptRoot || "").trim().replace(/\/+$/, "");
      if (!base) return raw;
      if (raw === base || raw.startsWith(`${base}/`)) return raw;
      return `${base}${raw}`;
    }

    const apiDispatchUrl = withScriptRoot(rawApiDispatchUrl);
    const apiApplicationBaseUrl = withScriptRoot(rawApiApplicationBaseUrl);
    const apiSkillCatalogUrl = withScriptRoot(rawApiSkillCatalogUrl);
    const apiToolCatalogUrl = withScriptRoot(rawApiToolCatalogUrl);
    const apiAgentCatalogUrl = withScriptRoot(rawApiAgentCatalogUrl);
    const apiApplicationCatalogUrl = withScriptRoot(rawApiApplicationCatalogUrl);
    const apiTaskBaseUrl = withScriptRoot(rawApiTaskBaseUrl);
    const apiAttachmentUploadUrl = withScriptRoot(rawApiAttachmentUploadUrl);
    const apiAssistantThreadsUrl = withScriptRoot(rawApiAssistantThreadsUrl);
    const apiCustomToolStreamStartUrl = withScriptRoot(rawApiCustomToolStreamStartUrl);

    function setStatus(text) {
      const el = document.getElementById("status");
      if (!text) {
        el.className = "status";
        el.textContent = "";
        return;
      }
      el.className = "status show";
      el.textContent = text;
    }

    function addMessage(role, body, payload = {}) {
      const item = { id: state.nextMessageId++, role, body, payload };
      state.messages.push(item);
      renderMessages();
      return item;
    }

    function updateMessage(message, { body, payload } = {}) {
      if (!message) return null;
      if (body != null) message.body = body;
      if (payload && typeof payload === "object") message.payload = payload;
      renderMessages();
      return message;
    }

    function buildProcessState(jobId, stage, progress, steps) {
      return {
        job: {
          job_id: jobId,
          current_stage: stage,
          progress,
        },
        steps,
      };
    }

    function buildPendingAssistantPayload() {
      return {
        planning_task_state: buildProcessState("planning_pending", "处理中", 8, [
          { seq: 1, stage: "planning", step_type: "planning", title: "理解问题", message: "正在理解你的问题与当前上下文", status: "running" },
          { seq: 2, stage: "planning", step_type: "planning", title: "整理上下文", message: "如有需要，将提取近几轮中真正相关的信息", status: "pending" },
          { seq: 3, stage: "planning", step_type: "planning", title: "整理任务", message: "正在把问题整理成明确的任务描述", status: "pending" },
          { seq: 4, stage: "planning", step_type: "planning", title: "生成执行方案", message: "正在选择合适的工具与步骤", status: "pending" },
        ]),
        runtime_task_state: buildProcessState("runtime_pending", "等待执行", 0, [
          { seq: 1, stage: "runtime", step_type: "runtime", title: "等待执行", message: "执行步骤会在方案生成后显示在这里", status: "pending" },
        ]),
      };
    }

    function startAssistantPlaceholderProgress(message) {
      if (!message) return null;
      const stages = [
        { title: "理解问题", message: "正在理解你的问题与当前上下文", progress: 12 },
        { title: "整理上下文", message: "正在提取近几轮里真正相关的信息", progress: 28 },
        { title: "整理任务", message: "正在整理本轮明确的任务目标", progress: 46 },
        { title: "生成执行方案", message: "正在选择工具并生成步骤", progress: 66 },
      ];
      let index = 0;
      const tick = () => {
        const payload = message.payload && typeof message.payload === "object" ? message.payload : buildPendingAssistantPayload();
        const planningState = payload.planning_task_state && typeof payload.planning_task_state === "object"
          ? payload.planning_task_state
          : buildPendingAssistantPayload().planning_task_state;
        const current = stages[Math.min(index, stages.length - 1)];
        const steps = (Array.isArray(planningState.steps) ? planningState.steps : []).map((step, stepIndex) => {
          if (stepIndex < index) return { ...step, status: "completed" };
          if (stepIndex === index) return { ...step, title: current.title, message: current.message, status: "running" };
          return { ...step, status: "pending" };
        });
        message.payload = {
          ...payload,
          planning_task_state: buildProcessState(
            planningState.job?.job_id || "planning_pending",
            current.title,
            current.progress,
            steps,
          ),
        };
        renderMessages();
        if (index < stages.length - 1) index += 1;
      };
      tick();
      return window.setInterval(tick, 1600);
    }

    function stopAssistantPlaceholderProgress(timerId) {
      if (timerId) window.clearInterval(timerId);
    }

    function escapeHtml(text) {
      return String(text || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function renderPendingAttachments() {
      const root = document.getElementById("attachmentStrip");
      if (!state.pendingAttachments.length) {
        root.className = "attachment-strip";
        root.innerHTML = "";
        return;
      }
      root.className = "attachment-strip show";
      root.innerHTML = state.pendingAttachments.map((item, idx) => `
        <div class="thumb">
          <img src="${escapeHtml(withScriptRoot(item.preview_url || ""))}" alt="${escapeHtml(item.file_name || "attachment")}">
          <button class="thumb-remove" data-remove-attachment="${idx}" title="移除">×</button>
        </div>
      `).join("");
      root.querySelectorAll("[data-remove-attachment]").forEach((node) => {
        node.addEventListener("click", () => {
          const index = Number(node.getAttribute("data-remove-attachment") || -1);
          if (index < 0) return;
          state.pendingAttachments.splice(index, 1);
          renderPendingAttachments();
        });
      });
    }

    function renderSessionList() {
      const root = document.getElementById("sessionList");
      const query = String(state.historyQuery || "").trim().toLowerCase();
      const threads = (Array.isArray(state.threads) ? state.threads : []).filter((item) => {
        if (!query) return true;
        return [item.title, item.latest_user_input, item.latest_assistant_output]
          .some((value) => String(value || "").toLowerCase().includes(query));
      });
      if (!threads.length) {
        root.innerHTML = `<div class="session-meta">暂无最近会话</div>`;
        return;
      }
      root.innerHTML = threads.map((item) => `
        <button class="session-item ${Number(item.thread_id) === Number(state.threadId || 0) ? "active" : ""}" data-thread-id="${escapeHtml(item.thread_id)}" title="${escapeHtml(sessionTitleSource(item))}">
          <div class="session-title">${escapeHtml(compactSessionTitle(item))}</div>
          <div class="session-meta">${escapeHtml(formatSessionTime(item.last_event_at || item.updated_at || ""))}</div>
        </button>
      `).join("");
      root.querySelectorAll("[data-thread-id]").forEach((node) => {
        node.addEventListener("click", async () => {
          const threadId = Number(node.getAttribute("data-thread-id") || 0);
          if (!threadId) return;
          try {
            await loadThread(threadId);
            setStatus("");
          } catch (err) {
            setStatus(String(err.message || err));
          }
        });
      });
    }

    function sessionTitleSource(item) {
      return String(item?.title || item?.latest_user_input || `会话 ${item?.thread_id || ""}`)
        .replace(/\s+/g, " ")
        .trim() || "新对话";
    }

    function compactSessionTitle(item) {
      const source = sessionTitleSource(item)
        .replace(/^\/custom_tool\s+(?:create|edit)\s+/i, "")
        .replace(/^\/[a-z0-9_-]+\s+/i, "")
        .trim();
      const firstClause = source.split(/[，。！？!?；;\n]/, 1)[0].trim() || source;
      const characters = Array.from(firstClause);
      return characters.length > 18 ? `${characters.slice(0, 18).join("")}…` : firstClause;
    }

    function formatSessionTime(value) {
      const raw = String(value || "").trim();
      if (!raw) return "";
      const parsed = new Date(raw.includes("T") ? raw : raw.replace(" ", "T"));
      if (Number.isNaN(parsed.getTime())) return raw.slice(0, 16);
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const target = new Date(parsed.getFullYear(), parsed.getMonth(), parsed.getDate());
      const dayDiff = Math.round((today.getTime() - target.getTime()) / 86400000);
      const time = parsed.toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit", hour12: false });
      if (dayDiff === 0) return `今天 ${time}`;
      if (dayDiff === 1) return `昨天 ${time}`;
      if (parsed.getFullYear() === now.getFullYear()) return `${parsed.getMonth() + 1}月${parsed.getDate()}日`;
      return `${parsed.getFullYear()}年${parsed.getMonth() + 1}月${parsed.getDate()}日`;
    }

    function messageAttachmentsHtml(attachments) {
      if (!Array.isArray(attachments) || !attachments.length) return "";
      const items = attachments
        .filter((item) => item && typeof item === "object")
        .slice(0, 8)
        .map((item) => `
          <div class="thumb">
            <img src="${escapeHtml(withScriptRoot(item.preview_url || ""))}" alt="${escapeHtml(item.file_name || "attachment")}">
          </div>
        `);
      return items.length ? `<div class="bubble-attachments">${items.join("")}</div>` : "";
    }

    function cardTitle(item) {
      return item.display_name || item.skill_name || item.tool_name || item.application_name || item.agent_name || item.service_id || item.job_id || item.name || "-";
    }

    function cardMetaLines(item) {
      const lines = [];
      if (item.application_name) lines.push(`<div><strong>application</strong>${escapeHtml(item.application_name)}</div>`);
      if (item.agent_name) lines.push(`<div><strong>agent</strong>${escapeHtml(item.agent_name)}</div>`);
      if (item.skill_name) lines.push(`<div><strong>skill</strong>${escapeHtml(item.skill_name)}</div>`);
      if (item.tool_name) lines.push(`<div><strong>tool</strong>${escapeHtml(item.tool_name)}</div>`);
      if (item.role) lines.push(`<div><strong>role</strong>${escapeHtml(item.role)}</div>`);
      if (item.status) lines.push(`<div><strong>status</strong>${escapeHtml(item.status)}</div>`);
      if (item.created_from) lines.push(`<div><strong>created_from</strong>${escapeHtml(item.created_from)}</div>`);
      if (Object.prototype.hasOwnProperty.call(item, "llm_enabled")) lines.push(`<div><strong>llm_enabled</strong>${escapeHtml(item.llm_enabled ? "true" : "false")}</div>`);
      if (item.source_skill_name) lines.push(`<div><strong>source_skill</strong>${escapeHtml(item.source_skill_name)}</div>`);
      if (item.version) lines.push(`<div><strong>version</strong>${escapeHtml(item.version)}</div>`);
      if (item.tool_mode) lines.push(`<div><strong>tool_mode</strong>${escapeHtml(item.tool_mode)}</div>`);
      if (item.default_max_steps) lines.push(`<div><strong>max_steps</strong>${escapeHtml(item.default_max_steps)}</div>`);
      if (item.route_type) lines.push(`<div><strong>route_type</strong>${escapeHtml(item.route_type)}</div>`);
      if (item.submit_status) lines.push(`<div><strong>submit_status</strong>${escapeHtml(item.submit_status)}</div>`);
      if (item.input_error) lines.push(`<div><strong>input_error</strong>${escapeHtml(item.input_error)}</div>`);
      if (item.job_id) lines.push(`<div><strong>job_id</strong>${escapeHtml(item.job_id)}</div>`);
      if (Array.isArray(item.skills) && item.skills.length) lines.push(`<div><strong>skills</strong>${escapeHtml(item.skills.join(", "))}</div>`);
      if (Array.isArray(item.tools) && item.tools.length) lines.push(`<div><strong>tools</strong>${escapeHtml(item.tools.join(", "))}</div>`);
      if (Array.isArray(item.default_agents) && item.default_agents.length) lines.push(`<div><strong>default_agents</strong>${escapeHtml(item.default_agents.join(", "))}</div>`);
      if (item.example_count) lines.push(`<div><strong>examples</strong>${escapeHtml(item.example_count)}</div>`);
      return lines;
    }

    function cardWorkspaceUrl(item) {
      if (item.workspace_url) return withScriptRoot(item.workspace_url);
      if (item.application_name) return withScriptRoot(`/applications/studio/${encodeURIComponent(item.application_name)}`);
      if (item.agent_name) return withScriptRoot(`/agents/studio/${encodeURIComponent(item.agent_name)}`);
      if (item.skill_name) return withScriptRoot(`/skills/studio/${encodeURIComponent(item.skill_name)}`);
      if (item.tool_name) return withScriptRoot(`/tools/studio/${encodeURIComponent(item.tool_name)}`);
      return "";
    }

    function cardHtml(item) {
      const title = cardTitle(item);
      const meta = cardMetaLines(item);
      const workspaceUrl = cardWorkspaceUrl(item);
      const actions = [];
      if (workspaceUrl) {
        actions.push(`<button class="mini-btn" data-open-url="${workspaceUrl}">查看编辑</button>`);
      }
      if (item.application_name) {
        actions.push(`<button class="mini-btn" data-switch-application="${escapeHtml(item.application_name)}">切换上下文</button>`);
      }
      return `
        <div class="card">
          <div class="card-title">${escapeHtml(title)}</div>
          <div class="card-kv">${meta.join("") || `<div>${escapeHtml(JSON.stringify(item))}</div>`}</div>
          ${actions.length ? `<div class="card-actions">${actions.join("")}</div>` : ""}
        </div>
      `;
    }

    function getMessageById(messageId) {
      return state.messages.find((item) => item.id === Number(messageId)) || null;
    }

    function buildReferenceText(message) {
      const body = String(message?.body || "").trim();
      if (!body) return "";
      const compact = body.replace(/\s+/g, " ").trim();
      return compact.length > 180 ? `${compact.slice(0, 180)}...` : compact;
    }

    function appendToInput(text, { replace = false } = {}) {
      const input = document.getElementById("inputBox");
      const prefix = replace ? "" : (input.value && !input.value.endsWith("\n") ? "\n" : "");
      input.value = `${replace ? "" : input.value}${prefix}${text}`;
      input.focus();
      input.dispatchEvent(new Event("input", { bubbles: true }));
    }

    function hideContextMenu() {
      state.contextMenu.visible = false;
      state.contextMenu.messageId = null;
      const menu = document.getElementById("contextMenu");
      menu.className = "context-menu";
      menu.innerHTML = "";
    }

    function renderContextMenu() {
      const menu = document.getElementById("contextMenu");
      if (!state.contextMenu.visible || !state.contextMenu.messageId) {
        hideContextMenu();
        return;
      }
      const message = getMessageById(state.contextMenu.messageId);
      if (!message) {
        hideContextMenu();
        return;
      }
      menu.className = "context-menu show";
      menu.style.left = `${state.contextMenu.x}px`;
      menu.style.top = `${state.contextMenu.y}px`;
      menu.innerHTML = `
        <button class="context-item" data-action="quote">引用到输入框</button>
        <button class="context-item" data-action="followup">基于这条继续追问</button>
        <button class="context-item" data-action="copy">复制内容</button>
      `;
      menu.querySelectorAll("[data-action]").forEach((node) => {
        node.addEventListener("click", async () => {
          const action = node.getAttribute("data-action") || "";
          const referenceText = buildReferenceText(message);
          if (action === "quote") {
            appendToInput(`引用：${referenceText}`);
          } else if (action === "followup") {
            appendToInput(`基于刚才这条结果，请继续：${referenceText}`);
          } else if (action === "copy") {
            try {
              await navigator.clipboard.writeText(String(message.body || ""));
              setStatus("已复制到剪贴板");
              window.setTimeout(() => setStatus(""), 1200);
            } catch (_err) {
              setStatus("复制失败，请手动复制");
            }
          }
          hideContextMenu();
        });
      });
      const menuRect = menu.getBoundingClientRect();
      const maxLeft = Math.max(8, window.innerWidth - menuRect.width - 8);
      const maxTop = Math.max(8, window.innerHeight - menuRect.height - 8);
      menu.style.left = `${Math.min(state.contextMenu.x, maxLeft)}px`;
      menu.style.top = `${Math.min(state.contextMenu.y, maxTop)}px`;
    }

    const STRUCTURED_PREVIEW_MAX_TEXT = 420;
    const STRUCTURED_PREVIEW_MAX_LIST_ITEMS = 8;
    const STRUCTURED_PREVIEW_MAX_OBJECT_ENTRIES = 10;
    const STRUCTURED_PREVIEW_MAX_TABLE_COLUMNS = 8;
    const STRUCTURED_PREVIEW_MAX_DEPTH = 2;

    function truncateText(text, maxLen = STRUCTURED_PREVIEW_MAX_TEXT) {
      const raw = String(text == null ? "" : text);
      if (raw.length <= maxLen) return { text: raw, omitted: 0 };
      return { text: `${raw.slice(0, maxLen)}…`, omitted: raw.length - maxLen };
    }

    function previewStructuredValue(value) {
      if (value == null || value === "") return "无数据";
      if (Array.isArray(value)) return `列表，共 ${value.length} 项`;
      if (typeof value === "object") {
        const keys = Object.keys(value);
        if (!keys.length) return "空对象";
        return `对象，字段 ${keys.slice(0, 4).join("、")}${keys.length > 4 ? " 等" : ""}`;
      }
      return String(value);
    }

    function renderPrimitive(value) {
      const { text, omitted } = truncateText(value);
      return `
        <div class="result-text">${escapeHtml(text)}</div>
        ${omitted > 0 ? `<div class="result-note">已省略 ${escapeHtml(omitted)} 个字符</div>` : ""}
      `;
    }

    function renderList(items) {
      const rows = Array.isArray(items) ? items : [];
      if (!rows.length) return '<div class="result-empty">无数据</div>';
      const visibleRows = rows.slice(0, STRUCTURED_PREVIEW_MAX_LIST_ITEMS);
      const omitted = Math.max(0, rows.length - visibleRows.length);
      if (visibleRows.every((item) => item && typeof item === "object" && !Array.isArray(item))) {
        const keys = [];
        visibleRows.forEach((row) => {
          Object.keys(row).forEach((key) => {
            if (!keys.includes(key)) keys.push(key);
          });
        });
        const visibleKeys = keys.slice(0, STRUCTURED_PREVIEW_MAX_TABLE_COLUMNS);
        return `
          <div class="result-group">
            <div class="result-table-wrap">
              <table class="result-table">
                <thead><tr>${visibleKeys.map((key) => `<th>${escapeHtml(key)}</th>`).join("")}</tr></thead>
                <tbody>
                  ${visibleRows.map((row) => `<tr>${visibleKeys.map((key) => `<td>${escapeHtml(row[key] == null ? "" : typeof row[key] === "object" ? previewStructuredValue(row[key]) : row[key])}</td>`).join("")}</tr>`).join("")}
                </tbody>
              </table>
            </div>
            ${omitted > 0 ? `<div class="result-note">列表共 ${rows.length} 项，仅展示前 ${visibleRows.length} 项</div>` : ""}
            ${keys.length > visibleKeys.length ? `<div class="result-note">字段较多，仅展示前 ${visibleKeys.length} 列</div>` : ""}
          </div>
        `;
      }
      return `
        <div class="result-group">
          <ul class="result-list">${visibleRows.map((item) => `<li>${escapeHtml(typeof item === "object" ? previewStructuredValue(item) : item)}</li>`).join("")}</ul>
          ${omitted > 0 ? `<div class="result-note">列表共 ${rows.length} 项，仅展示前 ${visibleRows.length} 项</div>` : ""}
        </div>
      `;
    }

    function renderObjectEntries(data, depth = 0) {
      const entries = Object.entries(data || {});
      if (!entries.length) return '<div class="result-empty">无数据</div>';
      const visibleEntries = entries.slice(0, STRUCTURED_PREVIEW_MAX_OBJECT_ENTRIES);
      const omitted = Math.max(0, entries.length - visibleEntries.length);
      if (depth >= STRUCTURED_PREVIEW_MAX_DEPTH) {
        return `
          <div class="result-kv-list">
            ${visibleEntries.map(([key, value]) => `
              <div class="result-kv-item">
                <div class="result-kv-key">${escapeHtml(key)}</div>
                <div class="result-kv-value">${renderPrimitive(previewStructuredValue(value))}</div>
              </div>
            `).join("")}
            ${omitted > 0 ? `<div class="result-note">对象共 ${entries.length} 个字段，仅展示前 ${visibleEntries.length} 个</div>` : ""}
          </div>
        `;
      }
      return `
        <div class="result-kv-list">
          ${visibleEntries.map(([key, value]) => `
            <div class="result-kv-item">
              <div class="result-kv-key">${escapeHtml(key)}</div>
              <div class="result-kv-value">${renderStructuredValue(value, depth + 1)}</div>
            </div>
          `).join("")}
          ${omitted > 0 ? `<div class="result-note">对象共 ${entries.length} 个字段，仅展示前 ${visibleEntries.length} 个</div>` : ""}
        </div>
      `;
    }

    function renderStructuredValue(value, depth = 0) {
      if (value == null || value === "") return '<div class="result-empty">无数据</div>';
      if (Array.isArray(value)) return renderList(value);
      if (typeof value === "object") return renderObjectEntries(value, depth);
      return renderPrimitive(value);
    }

    function omitRenderPayload(finalOutput) {
      if (!finalOutput || typeof finalOutput !== "object") return finalOutput;
      const copy = { ...finalOutput };
      delete copy.render_payload;
      return copy;
    }

    function renderNamedSection(title, bodyHtml) {
      if (!bodyHtml) return "";
      return `
        <div class="result-panel-section">
          <div class="result-panel-section-title">${escapeHtml(title)}</div>
          <div class="result-section-body">${bodyHtml}</div>
        </div>
      `;
    }

    function renderFinalOutputPreferred(finalOutput) {
      const clean = omitRenderPayload(finalOutput);
      if (!clean || typeof clean !== "object") return "";

      const sections = [];
      if (Array.isArray(clean.facts) && clean.facts.length) {
        sections.push(renderNamedSection("关键事实", renderList(clean.facts)));
      }
      if (Array.isArray(clean.risks) && clean.risks.length) {
        sections.push(renderNamedSection("风险提示", renderList(clean.risks)));
      }

      const rest = { ...clean };
      delete rest.summary;
      delete rest.facts;
      delete rest.risks;
      if (Object.keys(rest).length) {
        sections.push(renderNamedSection("补充结果", renderStructuredValue(rest)));
      }
      return sections.join("");
    }

    function renderTableBlock(data) {
      const headers = Array.isArray(data?.headers) ? data.headers : (Array.isArray(data?.columns) ? data.columns : []);
      const rows = Array.isArray(data?.rows) ? data.rows : [];
      if (!headers.length || !rows.length) return '<div class="result-empty">无表格数据</div>';
      const visibleHeaders = headers.slice(0, STRUCTURED_PREVIEW_MAX_TABLE_COLUMNS);
      const visibleRows = rows.slice(0, STRUCTURED_PREVIEW_MAX_LIST_ITEMS);
      const omittedRows = Math.max(0, rows.length - visibleRows.length);
      return `
        <div class="result-group">
          <div class="result-table-wrap">
            <table class="result-table">
              <thead>
                <tr>${visibleHeaders.map((header) => `<th>${escapeHtml(header)}</th>`).join("")}</tr>
              </thead>
              <tbody>
                ${visibleRows.map((row) => `<tr>${(Array.isArray(row) ? row.slice(0, visibleHeaders.length) : visibleHeaders.map((key) => row?.[key])).map((cell) => `<td>${escapeHtml(cell == null ? "" : typeof cell === "object" ? previewStructuredValue(cell) : cell)}</td>`).join("")}</tr>`).join("")}
              </tbody>
            </table>
          </div>
          ${omittedRows > 0 ? `<div class="result-note">表格共 ${rows.length} 行，仅展示前 ${visibleRows.length} 行</div>` : ""}
          ${headers.length > visibleHeaders.length ? `<div class="result-note">表格共 ${headers.length} 列，仅展示前 ${visibleHeaders.length} 列</div>` : ""}
        </div>
      `;
    }

    function renderLineChartBlock(data) {
      const series = Array.isArray(data?.series) ? data.series.filter((item) => item && Array.isArray(item.data) && item.data.length) : [];
      if (!series.length) return '<div class="result-empty">无曲线数据</div>';
      const labels = Array.isArray(data?.x_axis) && data.x_axis.length
        ? data.x_axis
        : (Array.isArray(data?.labels) && data.labels.length
          ? data.labels
          : series.reduce((longest, item) => item.data.length > longest.length ? item.data.map((_, idx) => String(idx + 1)) : longest, []));
      const maxLen = labels.length || Math.max(...series.map((item) => item.data.length));
      const width = 640;
      const height = 220;
      const padding = { top: 16, right: 18, bottom: 26, left: 42 };
      const innerWidth = width - padding.left - padding.right;
      const innerHeight = height - padding.top - padding.bottom;
      const values = series.flatMap((item) => item.data.map((v) => Number(v)).filter((v) => Number.isFinite(v)));
      if (!values.length) return '<div class="result-empty">无有效数值</div>';
      let min = Math.min(...values);
      let max = Math.max(...values);
      if (min === max) {
        min -= 1;
        max += 1;
      }
      const colors = ["#155eef", "#f79009", "#12b76a", "#7a5af8", "#f04438"];
      const xFor = (idx) => padding.left + (maxLen <= 1 ? innerWidth / 2 : (idx / (maxLen - 1)) * innerWidth);
      const yFor = (value) => padding.top + innerHeight - ((value - min) / (max - min)) * innerHeight;
      const yTicks = 4;
      const grid = Array.from({ length: yTicks + 1 }, (_, idx) => {
        const ratio = idx / yTicks;
        const y = padding.top + ratio * innerHeight;
        const value = max - ratio * (max - min);
        return { y, value };
      });
      const polyline = series.map((item, idx) => {
        const points = item.data
          .map((value, pointIdx) => Number(value))
          .filter((value) => Number.isFinite(value) || value === 0)
          .map((value, pointIdx) => `${xFor(pointIdx)},${yFor(value)}`)
          .join(" ");
        return {
          name: item.name || `series_${idx + 1}`,
          color: colors[idx % colors.length],
          points,
        };
      }).filter((item) => item.points);
      return `
        <div class="line-chart-wrap">
          <svg class="line-chart-svg" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none">
            ${grid.map((tick) => `
              <g>
                <line x1="${padding.left}" y1="${tick.y}" x2="${width - padding.right}" y2="${tick.y}" stroke="#eaecf0" stroke-width="1" />
                <text x="${padding.left - 8}" y="${tick.y + 4}" text-anchor="end" font-size="11" fill="#667085">${escapeHtml(tick.value.toFixed(2))}</text>
              </g>
            `).join("")}
            ${labels.map((label, idx) => `
              <text x="${xFor(idx)}" y="${height - 6}" text-anchor="middle" font-size="11" fill="#667085">${escapeHtml(String(label))}</text>
            `).join("")}
            ${polyline.map((item) => `
              <polyline fill="none" stroke="${item.color}" stroke-width="2.2" points="${item.points}" />
            `).join("")}
          </svg>
          <div class="line-chart-legend">
            ${polyline.map((item) => `
              <span class="line-chart-legend-item">
                <span class="line-chart-dot" style="background:${item.color}"></span>
                <span>${escapeHtml(item.name)}</span>
              </span>
            `).join("")}
          </div>
        </div>
      `;
    }

    function renderBarChartBlock(data) {
