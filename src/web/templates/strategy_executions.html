<body><main class="shell">
<header class="toolbar"><h1>策略选股总览</h1><label for="strategy-filter">模型</label><select id="strategy-filter"><option value="">全部模型</option></select><label for="owner-filter" id="owner-label" class="hidden">用户</label><select id="owner-filter" class="hidden"></select><span class="spacer"></span><span class="live" id="refresh-state">每 10 秒自动刷新</span><button id="refresh" type="button">立即刷新</button><a id="home-link" href="#">工作台</a></header>
<div class="subtitle"><span id="summary">最近 20 个交易日 · 按选股日期</span><span id="asof">正在读取…</span></div>
<div id="error" class="error hidden" role="alert"></div><section id="stock-list" class="list" aria-label="选股与实时行情列表"><div class="empty">正在加载股票列表…</div></section>
<div id="load-footer" class="load-footer"><button id="load-more" type="button">再看 20 个交易日</button><small>向下滚动加载更早记录</small></div>
<dialog id="selection-history" class="history-dialog" aria-labelledby="history-title"><div class="dialog-head"><h2 id="history-title">选股历史</h2><button id="close-history" type="button" aria-label="关闭选股历史">关闭</button></div><div id="history-content" class="history-scroll"></div></dialog>
</main>
<script>
(()=>{
const base=location.pathname.replace(/\/strategies\/?$/,'').replace(/\/$/,'');
const $=id=>document.getElementById(id);
$('home-link').href=`${base}/assistant`;
const el=(tag,cls='',text)=>{const n=document.createElement(tag);n.className=cls;if(text!==undefined)n.textContent=String(text);return n;};
const price=x=>x==null?'—':Number(x).toFixed(2);
const signed=x=>x==null?'—':`${Number(x)>0?'+':''}${Number(x).toFixed(2)}%`;
const color=x=>x==null?'flat':Number(x)>0?'up':Number(x)<0?'down':'flat';
const dateTime=x=>x?String(x).replace('T',' ').slice(5,16):'—';
let pendingCharts=[];
const chartDrawers=new WeakMap();
const chartObserver=new IntersectionObserver(entries=>{for(const entry of entries){if(entry.isIntersecting){chartDrawers.get(entry.target)?.();chartObserver.unobserve(entry.target);}}},{rootMargin:'500px'});
const historicalMarkets=new Map(),rowNodes=new Map();
const minuteOffsets=new Map(),minuteMarkets=new Map(),minuteRequests=new Map();
const pickKey=p=>`${p.signal_date}:${p.strategy_id}:${p.stock_code}`;
const minuteKey=(p,offset)=>`${p.signal_date}:${offset}:${p.stock_code}`;
let historyEpoch=0;
let historyFocus=null;
let records=null,market=null,request=null,nextBefore=null,loadingPage=false,pageEpoch=0,needLiveDaily=true,owner=new URLSearchParams(location.search).get('user_id')||'';
function chart(bars,title,width,options={}){
 const canvas=el('canvas');canvas.setAttribute('role','img');canvas.setAttribute('aria-label',`${title} · ${bars.length} 根K线`);canvas.dataset.barCount=bars.length;canvas.dataset.firstTime=bars[0].time;canvas.dataset.lastTime=bars.at(-1).time;
 const height=118,ratio=window.devicePixelRatio||1;canvas.width=width*ratio;canvas.height=height*ratio;
 const ctx=canvas.getContext('2d');ctx.scale(ratio,ratio);ctx.font='10px system-ui';
 const left=42,right=options.reference>0?55:10,top=10,bottom=77;
 const lo=Math.min(...bars.map(b=>Number(b.low))),hi=Math.max(...bars.map(b=>Number(b.high))),pad=Math.max((hi-lo)*.08,.02),min=lo-pad,max=hi+pad;
 const y=p=>bottom-(Number(p)-min)/(max-min)*(bottom-top),step=(width-left-right)/bars.length,bw=Math.min(16,step*.62),volMax=Math.max(1,...bars.map(b=>Number(b.volume)||0));
 const line=(x1,y1,x2,y2,color)=>{ctx.strokeStyle=color;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();};
 for(let i=0;i<3;i++){const yy=top+(bottom-top)*i/2,tick=max-(max-min)*i/2;line(left,yy,width-right,yy,'#2b4359');ctx.fillStyle='#91abc1';ctx.textAlign='right';ctx.fillText(tick.toFixed(2),left-7,yy+3);if(options.reference>0){ctx.textAlign='left';ctx.fillText(signed((tick/options.reference-1)*100),width-right+5,yy+3);}}
 bars.forEach((b,i)=>{const x=left+(i+.5)*step,fill=Number(b.close)>=Number(b.open)?'#ff8b8b':'#70d9b9';line(x,y(b.high),x,y(b.low),fill);ctx.fillStyle=fill;ctx.fillRect(x-bw/2,Math.min(y(b.open),y(b.close)),Math.max(.6,bw),Math.max(1,Math.abs(y(b.open)-y(b.close))));const v=Number(b.volume)||0;ctx.globalAlpha=.5;ctx.fillRect(x-bw/2,101-v/volMax*16,Math.max(.6,bw),v/volMax*16);ctx.globalAlpha=1;if(i===0||i===Math.floor((bars.length-1)/2)||i===bars.length-1){ctx.fillStyle='#91abc1';ctx.textAlign='center';ctx.fillText(b.time,x,115);}});
 if(options.reference>=min&&options.reference<=max){ctx.setLineDash([3,3]);line(left,y(options.reference),width-right,y(options.reference),'#7894aa');ctx.setLineDash([]);}
 if(options.average){let volume=0,weighted=0,started=false;ctx.beginPath();bars.forEach((b,i)=>{const v=Number(b.volume)||0;if(v>0){volume+=v;weighted+=(Number(b.high)+Number(b.low)+Number(b.close))/3*v;}if(volume){const x=left+(i+.5)*step,yy=y(weighted/volume);if(started)ctx.lineTo(x,yy);else{ctx.moveTo(x,yy);started=true;}}});ctx.strokeStyle='#edc66b';ctx.stroke();}
 canvas.addEventListener('pointermove',e=>{const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*width/r.width,i=Math.max(0,Math.min(bars.length-1,Math.floor((x-left)/step))),b=bars[i];canvas.title=`${b.date} ${b.time} 开${price(b.open)} 高${price(b.high)} 低${price(b.low)} 收${price(b.close)}`;});
 return canvas;
}
function panel(title,caption,bars,empty,options={}){
 const p=el('div','chart-panel'),head=el('div','chart-head');head.append(el('h3','',title),el('span','',caption));p.append(head);
 const valid=bars.filter(b=>['open','high','low','close'].every(k=>b[k]!=null&&Number.isFinite(Number(b[k]))&&Number(b[k])>0));
 if(valid.length){const slot=el('div','chart-slot');p.append(slot);chartDrawers.set(slot,()=>slot.replaceChildren(chart(valid,title,Math.max(240,p.clientWidth-28),options)));pendingCharts.push(()=>chartObserver.observe(slot));}
 else p.append(el('div','empty-chart',empty));return p;
}
const modelName=p=>p.strategy_name||p.strategy_id;
function recentHistory(pick){const dates=new Set(records.trade_dates.slice(0,20));return records.picks.filter(p=>p.stock_code===pick.stock_code&&dates.has(p.signal_date)).sort((a,b)=>b.signal_date.localeCompare(a.signal_date)||a.strategy_id.localeCompare(b.strategy_id));}
function historyCount(rows){return new Set(rows.map(p=>`${p.signal_date}:${modelName(p)}`)).size;}
function showHistory(pick){
 const dialog=$('selection-history');historyFocus=document.activeElement;
 $('history-title').textContent=`${pick.stock_name} · 近 20 日选股`;
 const table=el('table','history-table'),head=el('thead'),hr=el('tr');
 for(const label of ['选股日期','模型','买','卖','收益'])hr.append(el('th','',label));head.append(hr);table.append(head);
 const body=el('tbody');
 for(const p of recentHistory(pick)){const row=el('tr');row.append(el('td','',p.signal_date),el('td','',p.strategy_id));
 for(const [label,value,at] of [['买',p.entry_price,p.entry_at],['卖',p.exit_price,p.exit_at]]){const cell=el('td','',label==='卖'&&value==null?'暂未卖出':price(value));if(at)cell.append(el('time','',dateTime(at)));row.append(cell);}
 row.append(el('td',color(p.gross_return_pct),signed(p.gross_return_pct)));body.append(row);}
 table.append(body);$('history-content').replaceChildren(table);dialog.showModal();
}
function drawCharts(){pendingCharts.forEach(draw=>draw());pendingCharts=[];}
function stockRow(pick,names,stockMap,dayMarket){
 const live=pick.signal_date===market?.trade_date;
 const stock=stockMap.get(pick.stock_code),q=stock?.quote,article=el('article','stock-row');article.dataset.code=pick.stock_code;article.dataset.model=pick.strategy_id;article.dataset.selectionDate=pick.signal_date;
 const head=el('div','row-head'),stamp=el('time','record-date',pick.signal_date);stamp.dateTime=pick.signal_date;stamp.prepend(el('small','','选股日期'));head.append(stamp);const identity=el('div','identity'),name=el('div');name.append(el('strong','',pick.stock_name),el('span','code',pick.stock_code));identity.append(name,el('span','model',names.get(pick.strategy_id)||pick.strategy_id));
 const quote=el('div',`quote ${color(q?.pct)}`);quote.append(el('b','',price(q?.close)),el('span','',signed(q?.pct)));const quoteBlock=el('div','quote-block');quoteBlock.append(quote);head.append(identity,quoteBlock);
 quoteBlock.append(el('div','quote-time',q?(live?`行情 ${q.snapshot_time?.slice(11,19)||''}`:`${pick.signal_date.slice(5)} 收盘`):dayMarket?.quote_error||dayMarket?.error||(dayMarket?'该日行情缺失':'加载中…')));
 const stats=el('div','stats');for(const [name,value]of [[live?'昨收':'前收',q?.preclose],[live?'今开':'开盘',q?.open],['最高',q?.high],['最低',q?.low]]){const v=el('div','stat',name);v.append(el('b','',price(value)));stats.append(v);}head.append(stats);article.append(head);
 const meta=el('div','selection-meta'),eligible=pick.actionable==null||Boolean(Number(pick.actionable));
 meta.append(el('span','selection-date',`${pick.signal_date} 选股`),el('span','',`第${pick.selection_rank}名`),el('span',`badge ${eligible?'holding':''}`,eligible?'被选中可交易':'观察 / 轮空'));
 const history=recentHistory(pick),same=history.filter(p=>modelName(p)===modelName(pick)),other=history.filter(p=>modelName(p)!==modelName(pick));
 const trigger=el('button','history-trigger',`本模型 ${historyCount(same)} 次 · 其他模型 ${historyCount(other)} 次 ›`);trigger.type='button';trigger.setAttribute('aria-label',`${pick.stock_name}近20日选股历史`);trigger.addEventListener('click',()=>showHistory(pick));meta.append(trigger);const decision=el('div','decision-summary');decision.append(meta);head.append(decision);
 const execution=el('div','execution');
 for(const [label,value,at]of [['买',pick.entry_price,pick.entry_at],['卖',pick.exit_price,pick.exit_at]]){const cell=el('div','trade');cell.append(el('span','trade-label',label),el('b',label==='卖'&&value==null?'waiting':'',label==='卖'&&value==null?'暂未卖出':price(value)));if(at)cell.append(el('time','',dateTime(at)));execution.append(cell);}
 const ret=el('div','trade-return','收益');ret.append(el('b',color(pick.gross_return_pct),signed(pick.gross_return_pct)));execution.append(ret);decision.append(execution);
 const body=el('div','row-body'),offset=minuteOffsets.get(pickKey(pick))||0;
 const minuteMarket=offset?minuteMarkets.get(minuteKey(pick,offset)):dayMarket;
 const minuteStock=offset?minuteMarket?.stocks?.find(s=>s.code===pick.stock_code):stock;
 const dates=dayMarket?.minute_dates||[pick.signal_date],index=dates.indexOf(pick.signal_date)+offset;
 const minuteDay=dates[index]||pick.signal_date,minuteLive=minuteDay===market?.trade_date;
 const minute=minuteStock?.bars||[],n=minuteMarket?.requested_minutes??(minuteLive?0:240);
 const minuteCaption=minuteMarket?.error||minuteStock?.minute_error||`${minute.length}/${n} 根 · 均价线`;
 const minutePanel=panel(`${minuteDay} · 1 分钟 K`,minuteCaption,minute,minuteMarket?.error||minuteStock?.minute_error||(minuteMarket?(n?'该日分钟数据缺失':'尚未开盘'):'加载中…'),{reference:minuteStock?.quote?.preclose,average:true});
 const nav=el('div','minute-nav'),prev=el('button','','‹'),next=el('button','','›'),reset=el('button','','选股日');
 prev.type=next.type=reset.type='button';prev.setAttribute('aria-label',`${pick.stock_name}前一交易日分钟K`);next.setAttribute('aria-label',`${pick.stock_name}后一交易日分钟K`);
 prev.disabled=index<=0;next.disabled=index>=dates.length-1||minuteDay>=market?.trade_date;
 reset.disabled=offset===0;reset.setAttribute('aria-label',`${pick.stock_name}返回选股日分钟K`);
 const change=value=>{minuteOffsets.set(pickKey(pick),value);replaceRow(pick);};
 prev.addEventListener('click',()=>change(offset-1));next.addEventListener('click',()=>change(offset+1));reset.addEventListener('click',()=>change(0));
 nav.append(prev,el('span','minute-date',`${minuteDay.slice(5)}${minuteLive?' 今日':''} · 1 分钟 K`),next,reset);
 minutePanel.querySelector('h3').replaceWith(nav);minutePanel.dataset.minuteDate=minuteDay;body.append(minutePanel);
 if(offset){ensureMinuteMarket(pick,offset);}
 let daily=[...(stock?.daily_bars||[])];if(live&&q&&q.open>0&&q.high>0&&q.low>0&&q.close>0){daily.push({date:market.trade_date,time:market.trade_date.slice(5),open:q.open,high:q.high,low:q.low,close:q.close,volume:q.volumn==null?null:Number(q.volumn)*100,amount:q.amount});}daily=daily.slice(-20);
 body.append(panel('近 20 日日 K',`截至 ${pick.signal_date.slice(5)}`,daily,dayMarket?.error||(dayMarket?'该日数据缺失':'加载中…'),{reference:q?.preclose}));article.append(body);return article;
}
async function ensureMinuteMarket(pick,offset,force=false){
 const key=minuteKey(pick,offset);if(minuteRequests.has(key)||(!force&&minuteMarkets.has(key)))return;
 const epoch=historyEpoch,params=new URLSearchParams({date:pick.signal_date,minute_offset:String(offset),stock_code:pick.stock_code});if(owner)params.set('user_id',owner);
 minuteRequests.set(key,true);
 try{const response=await fetch(`${base}/api/strategies/market?${params}`,{credentials:'same-origin',cache:'no-store'});const data=await response.json();if(!response.ok||!data.ok)throw new Error(data.error||'分钟行情加载失败');if(epoch===historyEpoch)minuteMarkets.set(key,data);}
 catch(e){if(epoch===historyEpoch)minuteMarkets.set(key,{stocks:[],error:e.message});}
 finally{if(epoch===historyEpoch){minuteRequests.delete(key);replaceRow(pick);}}
}
function rowKey(p){return `${pickKey(p)}:${p.selection_rank}`;}
function makeRow(p){const dayMarket=p.signal_date===market?.trade_date?market:historicalMarkets.get(p.signal_date),stocks=new Map((dayMarket?.stocks||[]).map(s=>[s.code,s]));return stockRow(p,new Map(records.strategies.map(s=>[s.strategy_id,s.name])),stocks,dayMarket);}
function replaceRow(p){const key=rowKey(p),old=rowNodes.get(key);if(!old?.isConnected)return;const node=makeRow(p);node.className=old.className;old.replaceWith(node);rowNodes.set(key,node);drawCharts();}
function render(){
 if(!records)return;pendingCharts=[];
 const selected=$('strategy-filter').value,picks=records.picks.filter(p=>!selected||p.strategy_id===selected).sort((a,b)=>b.signal_date.localeCompare(a.signal_date)||a.strategy_id.localeCompare(b.strategy_id)||a.selection_rank-b.selection_rank);
 const fragment=document.createDocumentFragment();let last=null,tone=-1;
 for(const p of picks){const newDate=p.signal_date!==last;if(newDate){tone++;last=p.signal_date;}const key=rowKey(p);let node=rowNodes.get(key);if(!node){node=makeRow(p);rowNodes.set(key,node);}node.className=`stock-row date-tone-${tone%2}${newDate?' new-date':''}`;fragment.append(node);}
 $('stock-list').replaceChildren(fragment);if(!picks.length)$('stock-list').append(el('div','empty','这个日期范围暂无选股记录。'));
 const dates=records.trade_dates;$('summary').textContent=`已加载 ${dates.length} 个交易日 · ${dates.at(-1)||''} — ${dates[0]||''}`;
 $('load-more').disabled=loadingPage||!nextBefore;$('load-more').textContent=loadingPage?'正在读取更早记录…':nextBefore?'再看 20 个交易日':'已显示全部记录';
 drawCharts();
}
function options(){
 const selected=$('strategy-filter').value;const opts=[{strategy_id:'',name:'全部模型'},...records.strategies];
 if(JSON.stringify([...$('strategy-filter').options].map(o=>[o.value,o.textContent]))!==JSON.stringify(opts.map(s=>[s.strategy_id,s.name]))){$('strategy-filter').replaceChildren(...opts.map(s=>{const o=el('option','',s.name);o.value=s.strategy_id;return o;}));$('strategy-filter').value=opts.some(o=>o.strategy_id===selected)?selected:'';}
 if(records.owners.length){$('owner-filter').classList.remove('hidden');$('owner-label').classList.remove('hidden');const owners=[...new Set([...records.owners,records.owner_user_id])];$('owner-filter').replaceChildren(...owners.map(v=>{const o=el('option','',v);o.value=v;return o;}));$('owner-filter').value=records.owner_user_id;owner=records.owner_user_id;const url=new URL(location.href);url.searchParams.set('user_id',owner);history.replaceState(null,'',url);}
}
async function getData(path,params={}){const q=new URLSearchParams(params);if(owner)q.set('user_id',owner);const r=await fetch(`${base}${path}?${q}`,{credentials:'same-origin',cache:'no-store'});const data=await r.json();if(!r.ok||!data.ok)throw new Error(data.error||`HTTP ${r.status}`);return data;}
function mergeRecords(previous,next){if(!previous)return next;const picks=new Map(previous.picks.map(p=>[rowKey(p),p]));for(const p of next.picks)picks.set(rowKey(p),p);return {...previous,...next,owners:next.owners.length?next.owners:previous.owners,trade_dates:[...new Set([...previous.trade_dates,...next.trade_dates])].sort().reverse(),picks:[...picks.values()]};}
async function loadPage(reset=false){
 if(loadingPage&&!reset)return;if(!reset&&!nextBefore)return;
 const epoch=reset?++pageEpoch:pageEpoch;loadingPage=true;$('load-more').disabled=true;$('load-more').textContent='正在整批读取 20 个交易日…';
 if(reset){historyEpoch++;historicalMarkets.clear();minuteMarkets.clear();minuteRequests.clear();minuteOffsets.clear();rowNodes.clear();chartObserver.disconnect();records=null;market=null;needLiveDaily=true;$('stock-list').replaceChildren(el('div','empty','正在读取选股和历史图表…'));}
 try{const data=await getData('/api/strategies/page',!reset&&nextBefore?{before:nextBefore}:{});if(epoch!==pageEpoch)return;
 records=mergeRecords(records,data.records);nextBefore=data.next_before;for(const [day,value]of Object.entries(data.markets))historicalMarkets.set(day,value);
 if(!market)market={trade_date:data.trade_date,as_of:'',stocks:[]};const todayHistory=historicalMarkets.get(market.trade_date);if(todayHistory&&!market.stocks.length)market={...todayHistory,as_of:''};
 options();render();$('error').classList.add('hidden');if(reset)await refresh(true);
 }catch(e){if(epoch===pageEpoch){$('error').textContent=e.message;$('error').classList.remove('hidden');}}
 finally{if(epoch===pageEpoch){loadingPage=false;if(records)render();else{$('load-more').disabled=false;$('load-more').textContent='重试加载';}}}
}
async function refresh(force=false){
 if(!records||document.hidden&&!force||request)return;const epoch=pageEpoch;request=true;
 try{const data=await getData('/api/strategies/live',needLiveDaily?{daily:'1'}:{});if(epoch!==pageEpoch)return;
 const prior=new Map((market?.stocks||[]).map(s=>[s.code,s]));for(const s of data.market.stocks)if(!s.daily_bars?.length)s.daily_bars=prior.get(s.code)?.daily_bars||[];
 market=data.market;needLiveDaily=market.stocks.some(s=>!s.daily_bars.length);
 const day=market.trade_date,oldToday=records.picks.filter(p=>p.signal_date===day),changed=JSON.stringify(oldToday)!==JSON.stringify(data.records.picks);
 records=mergeRecords({...records,picks:records.picks.filter(p=>p.signal_date!==day)},data.records);
 if(changed){for(const p of oldToday)rowNodes.delete(rowKey(p));options();render();}else for(const p of data.records.picks)replaceRow(p);
 for(const p of records.picks){const offset=minuteOffsets.get(pickKey(p))||0;const d=historicalMarkets.get(p.signal_date),dates=d?.minute_dates||[];if(offset&&dates[dates.indexOf(p.signal_date)+offset]===day&&rowNodes.get(rowKey(p))?.isConnected)await ensureMinuteMarket(p,offset,true);}
 $('asof').textContent=`${market.trade_date} · ${market.as_of.slice(11,19)} 更新`;$('refresh-state').textContent='当天行情 · 每 10 秒刷新';
 }catch(e){if(epoch===pageEpoch){$('refresh-state').textContent='实时行情暂不可用 · 正在重试';}}
 finally{request=null;}
}
$('strategy-filter').addEventListener('change',render);
$('close-history').addEventListener('click',()=>$('selection-history').close());
$('selection-history').addEventListener('close',()=>historyFocus?.isConnected&&historyFocus.focus());
$('owner-filter').addEventListener('change',()=>{owner=$('owner-filter').value;$('selection-history').close();loadPage(true);});
$('load-more').addEventListener('click',()=>loadPage(!records));
const pageObserver=new IntersectionObserver(entries=>{if(entries.some(e=>e.isIntersecting)&&records&&nextBefore&&!loadingPage)loadPage();},{rootMargin:'300px'});pageObserver.observe($('load-footer'));
$('refresh').addEventListener('click',()=>loadPage(true));setInterval(()=>refresh(),10000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh(true);});loadPage(true);
})();
</script></body></html>
