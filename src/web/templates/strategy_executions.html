<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>策略选股总览 · Fin Agent</title>
<style>
:root{color-scheme:dark;font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;background:#0b1320;color:#e7eef6;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,select{font:inherit}a{color:#91c7e8;text-decoration:none}button,select{background:#18293b;border:1px solid #36516a;border-radius:7px;color:#e7eef6;padding:7px 10px}button{cursor:pointer}button:hover{border-color:#5dc9b8}.shell{max-width:1900px;margin:auto;padding:16px 24px 40px}.toolbar{position:sticky;top:0;z-index:2;background:#0b1320f5;border-bottom:1px solid #304259;padding:10px 0 12px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;backdrop-filter:blur(12px)}h1{font-size:22px;margin:0 12px 0 0;letter-spacing:-.5px}.toolbar label{font-size:12px;color:#91a6ba}.toolbar select{max-width:260px}.spacer{flex:1}.live{color:#79d9c5;font-size:12px}.live:before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;margin-right:6px}.subtitle{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:#93a8bd;font-size:12px;margin:13px 0 16px}.list{display:flex;flex-direction:column;gap:14px}.stock-row{border:1px solid #2b4359;border-radius:11px;background:#112032;overflow:hidden}.row-head{display:flex;gap:18px;align-items:center;flex-wrap:wrap;padding:12px 16px;background:#15263a;border-bottom:1px solid #294056}.identity{min-width:185px}.identity strong{font-size:20px}.code{font-size:12px;color:#a0b4c8;margin-left:9px}.model{font-size:12px;color:#75d5c3;display:block;margin-top:6px}.quote{display:flex;align-items:baseline;gap:12px;min-width:154px}.quote b{font-size:27px;letter-spacing:-.5px}.quote span{font-size:14px;font-weight:600}.up{color:#ff8b8b}.down{color:#70d9b9}.flat{color:#b4c7d7}.quote-time{font-size:11px;color:#88a0b7;white-space:nowrap}.stats{display:flex;gap:20px;flex-wrap:wrap;margin-left:auto}.stat{font-size:11px;color:#8da5bb}.stat b{display:block;color:#d9e7f3;font-size:13px;margin-top:4px;font-weight:500}.row-body{display:grid;grid-template-columns:minmax(210px,.7fr) minmax(400px,1.7fr) minmax(290px,1fr);gap:0}.execution{padding:15px 16px;border-right:1px solid #293e54;font-size:12px;line-height:1.55}.execution h3{font-size:12px;color:#aac0d2;margin:0 0 9px}.record{padding:8px 0;border-bottom:1px solid #24384d}.record:last-child{border:0}.record-top{display:flex;justify-content:space-between;gap:10px;margin-bottom:7px}.badge{padding:2px 7px;border-radius:4px;font-size:10px;background:#293b50;color:#b0c3d5}.badge.holding{color:#f0d18e;background:#443e30}.badge.done{color:#7fe0c7;background:#1b443e}.trade-values{display:flex;justify-content:space-between;gap:6px;color:#a5bbcf}.trade-values b.up{color:#ff8b8b}.trade-values b.down{color:#70d9b9}.trade-values b{display:block;font-size:16px;color:#e4edf6;font-weight:500}.record-note{font-size:10px;color:#8199ae;margin-top:6px}.chart-panel{padding:12px 14px 8px;min-width:0}.chart-panel+ .chart-panel{border-left:1px solid #293e54}.chart-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:2px}.chart-head h3{font-size:13px;margin:0}.chart-head span{color:#91a7bd;font-size:10px}.chart{display:block;width:100%;height:240px}.chart-grid{stroke:#2a4055;stroke-width:.7}.chart-label{fill:#88a1b9;font-size:10px}.empty-chart{height:240px;display:flex;align-items:center;justify-content:center;color:#839db6;font-size:13px;border:1px dashed #2d465f;border-radius:6px}.error{padding:10px 14px;background:#402a2f;color:#ffb8b8;border:1px solid #89585f;border-radius:7px;margin:12px 0}.hidden{display:none!important}.empty{padding:28px;color:#9ab1c7;text-align:center;border:1px dashed #2e4c67;border-radius:10px}.footer{font-size:11px;color:#8098af;margin:18px 0;line-height:1.7}.stale{color:#efc87b!important}
@media(min-width:1600px){.chart{height:275px}.empty-chart{height:275px}.row-body{grid-template-columns:minmax(230px,.65fr) minmax(560px,1.8fr) minmax(380px,1.1fr)}}
@media(max-width:1100px){.row-body{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr)}.execution{grid-column:1/-1;border-right:0;border-bottom:1px solid #293e54;display:flex;gap:20px;align-items:center;padding:8px 14px}.execution h3{margin:0}.record{border:0;min-width:240px;padding:0}.chart{height:250px}.stats{gap:14px}.quote-time{margin-left:auto}}
@media(max-width:680px){.shell{padding:8px 10px 24px}.row-body{display:block}.chart-panel+.chart-panel{border-left:0;border-top:1px solid #293e54}.execution{display:block}.record{padding:7px 0}.row-head{gap:12px}.stats{margin-left:0;flex:1}.identity{min-width:145px}.quote{min-width:130px}.quote b{font-size:24px}.chart{height:260px}.toolbar{gap:9px}h1{font-size:19px}.toolbar select{max-width:180px}}
</style>
</head>
<body><main class="shell">
<header class="toolbar"><h1>策略选股总览</h1><label for="strategy-filter">模型</label><select id="strategy-filter"><option value="">全部模型</option></select><label for="owner-filter" id="owner-label" class="hidden">用户</label><select id="owner-filter" class="hidden"></select><span class="spacer"></span><span class="live" id="refresh-state">每 10 秒自动刷新</span><button id="refresh" type="button">立即刷新</button><a id="home-link" href="#">工作台</a></header>
<div class="subtitle"><span id="summary">最近 20 个交易日选股 · 未卖出持仓保留</span><span id="asof">正在读取…</span></div>
<div id="error" class="error hidden" role="alert"></div><section id="stock-list" class="list" aria-label="选股与实时行情列表"><div class="empty">正在加载股票列表…</div></section>
<p class="footer">分钟图直接读取 1 分钟行情接口，仅保留今天开盘后的已完成 K 线，午休不计时。日 K 为近 20 个交易日未复权价格，今日一根随实时报价变化。买卖标为模拟或代理时，不代表券商成交；收益按策略任务回填展示。</p>
</main>
<script>
(()=>{
const base=location.pathname.replace(/\/strategies\/?$/,'').replace(/\/$/,'');
const $=id=>document.getElementById(id);
$('home-link').href=`${base}/assistant`;
const el=(tag,cls='',text)=>{const n=document.createElement(tag);n.className=cls;if(text!==undefined)n.textContent=String(text);return n;};
const svg=(tag,attrs={})=>{const n=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const [k,v] of Object.entries(attrs))n.setAttribute(k,String(v));return n;};
const price=x=>x==null?'—':Number(x).toFixed(2);
const signed=x=>x==null?'—':`${Number(x)>0?'+':''}${Number(x).toFixed(2)}%`;
const color=x=>x==null?'flat':Number(x)>0?'up':Number(x)<0?'down':'flat';
const dateTime=x=>x?String(x).replace('T',' ').slice(5,16):'—';
let pendingCharts=[];
let records=null,market=null,request=null,owner=new URLSearchParams(location.search).get('user_id')||'';
function chart(bars,title,width){
 const height=248,left=49,right=14,top=18,bottom=175;
 const root=svg('svg',{class:'chart',viewBox:`0 0 ${width} ${height}`,preserveAspectRatio:'none',role:'img','aria-label':`${title} · ${bars.length} 根K线`});
 root.dataset.barCount=String(bars.length);root.dataset.firstTime=bars[0].time;root.dataset.lastTime=bars.at(-1).time;
 const lo=Math.min(...bars.map(b=>Number(b.low))),hi=Math.max(...bars.map(b=>Number(b.high))),pad=Math.max((hi-lo)*.08,.02);
 const min=lo-pad,max=hi+pad,y=p=>bottom-(Number(p)-min)/(max-min)*(bottom-top);
 for(let i=0;i<4;i++){const yy=top+(bottom-top)*i/3;root.append(svg('line',{x1:left,y1:yy,x2:width-right,y2:yy,class:'chart-grid'}));const t=svg('text',{x:left-7,y:yy+3,'text-anchor':'end',class:'chart-label'});t.textContent=(max-(max-min)*i/3).toFixed(2);root.append(t);}
 const step=(width-left-right)/bars.length,barWidth=Math.min(16,step*.62),volMax=Math.max(1,...bars.map(b=>Number(b.volume)||0));
 bars.forEach((b,i)=>{const x=left+(i+.5)*step,up=Number(b.close)>=Number(b.open),fill=up?'#ff8b8b':'#70d9b9';
 const g=svg('g'),tip=svg('title');tip.textContent=`${b.date} ${b.time} 开${price(b.open)} 高${price(b.high)} 低${price(b.low)} 收${price(b.close)}`;g.append(tip);
 g.append(svg('line',{x1:x,x2:x,y1:y(b.high),y2:y(b.low),stroke:fill,'stroke-width':1.2}),svg('rect',{x:x-barWidth/2,y:Math.min(y(b.open),y(b.close)),width:barWidth,height:Math.max(1,Math.abs(y(b.open)-y(b.close))),fill}));root.append(g);
 const v=Number(b.volume)||0;root.append(svg('rect',{x:x-barWidth/2,y:222-v/volMax*29,width:barWidth,height:v/volMax*29,fill,opacity:.5}));
 if(i===0||i===bars.length-1||(i%Math.max(1,Math.floor(bars.length/4))===0&&i<bars.length-2&&i>1)){const t=svg('text',{x,y:240,'text-anchor':'middle',class:'chart-label'});t.textContent=b.time;root.append(t);}
 });return root;
}
function panel(title,caption,bars,empty){
 const p=el('div','chart-panel'),head=el('div','chart-head');head.append(el('h3','',title),el('span','',caption));p.append(head);
 const valid=bars.filter(b=>['open','high','low','close'].every(k=>b[k]!=null&&Number.isFinite(Number(b[k]))&&Number(b[k])>0));
 if(valid.length){const slot=el('div');p.append(slot);pendingCharts.push(()=>slot.replaceWith(chart(valid,title,Math.max(280,p.clientWidth-28))));}
 else p.append(el('div','empty-chart',empty));return p;
}
function render(){
 if(!records)return;pendingCharts=[];
 const selected=$('strategy-filter').value,groups=new Map(),names=new Map(records.strategies.map(s=>[s.strategy_id,s.name]));
 for(const p of records.picks){if(selected&&p.strategy_id!==selected)continue;const key=`${p.strategy_id}:${p.stock_code}`;if(!groups.has(key))groups.set(key,[]);groups.get(key).push(p);}
 const stockMap=new Map((market?.stocks||[]).map(s=>[s.code,s])),container=$('stock-list');container.replaceChildren();
 $('summary').textContent=`最近 20 个交易日 · ${groups.size} 个模型选股窗口 · 未卖出持仓持续保留`;
 $('asof').textContent=market?`${market.trade_date} · ${market.as_of.slice(11,19)} 更新`:'行情正在加载…';
 if(!groups.size){container.append(el('div','empty','此模型暂无选股记录。'));return;}
 for(const entries of groups.values()){
 const pick=entries[0],stock=stockMap.get(pick.stock_code),q=stock?.quote,article=el('article','stock-row');article.dataset.code=pick.stock_code;article.dataset.model=pick.strategy_id;
 const head=el('div','row-head'),identity=el('div','identity'),name=el('div');name.append(el('strong','',pick.stock_name),el('span','code',pick.stock_code));identity.append(name,el('span','model',names.get(pick.strategy_id)||pick.strategy_id));
 const quote=el('div',`quote ${color(q?.pct)}`);quote.append(el('b','',price(q?.close)),el('span','',signed(q?.pct)));head.append(identity,quote);
 const stamp=el('div','quote-time',q?.snapshot_time?`行情 ${q.snapshot_time.slice(11,19)}`:market?.quote_error||'等待今日实时报价');head.append(stamp);
 const stats=el('div','stats');for(const [name,value]of [['昨收',q?.preclose],['今开',q?.open],['最高',q?.high],['最低',q?.low]]){const v=el('div','stat',name);v.append(el('b','',price(value)));stats.append(v);}head.append(stats);article.append(head);
 const body=el('div','row-body'),execution=el('div','execution');execution.append(el('h3','','策略执行记录'));
 for(const p of entries){const rec=el('div','record'),top=el('div','record-top');const state=p.exit_price!=null?'已卖出':p.entry_price!=null?'持有中':!p.actionable?'观察 / 轮空':'待买入';top.append(el('span','',`${p.signal_date.slice(5)} 选股 · 第${p.selection_rank}名`),el('span',`badge ${p.exit_price!=null?'done':p.entry_price!=null?'holding':''}`,state));rec.append(top);
 const values=el('div','trade-values');for(const [label,v]of [['买入',p.entry_price],['卖出',p.exit_price]]){const vEl=el('span','',label);vEl.append(el('b','',price(v)));values.append(vEl);}const ret=el('span','','毛收益');ret.append(el('b',color(p.gross_return_pct),signed(p.gross_return_pct)));values.append(ret);rec.append(values);
 if(p.entry_price==null)rec.append(el('div','record-note',`信号价 ${price(p.signal_price)}`));
 else rec.append(el('div','record-note',`${dateTime(p.entry_at)} 买入 · ${/broker|fill/i.test(p.entry_price_basis||'')?'成交回报':'模拟 / 行情代理'}`));
 if(p.exit_at)rec.append(el('div','record-note',`${dateTime(p.exit_at)} 卖出${p.net_return_pct!=null?' · 净收益 '+signed(p.net_return_pct):''}`));execution.append(rec);}
 body.append(execution);
 const minute=stock?.bars||[],n=market?.requested_minutes??0;const minuteCaption=stock?.minute_error||`${market?.trade_date||'今日'} · ${minute.length}/${n} 根${minute.length?' · '+minute[0].time+'–'+minute.at(-1).time:''}`;
 body.append(panel('今日 · 1 分钟 K',minuteCaption,minute,stock?.minute_error||(n?'等待今日分钟行情':'尚未开盘')));
 let daily=[...(stock?.daily_bars||[])];if(q&&q.open>0&&q.high>0&&q.low>0&&q.close>0){daily.push({date:market.trade_date,time:market.trade_date.slice(5),open:q.open,high:q.high,low:q.low,close:q.close,volume:q.volumn==null?null:Number(q.volumn)*100,amount:q.amount});}daily=daily.slice(-20);
 body.append(panel('近 20 日日 K','未复权 · 今日动态更新',daily,'等待日 K 数据'));article.append(body);container.append(article);
 }
 pendingCharts.forEach(draw=>draw());pendingCharts=[];
}
function options(){
 const selected=$('strategy-filter').value;const opts=[{strategy_id:'',name:'全部模型'},...records.strategies];
 if(JSON.stringify([...$('strategy-filter').options].map(o=>[o.value,o.textContent]))!==JSON.stringify(opts.map(s=>[s.strategy_id,s.name]))){$('strategy-filter').replaceChildren(...opts.map(s=>{const o=el('option','',s.name);o.value=s.strategy_id;return o;}));$('strategy-filter').value=opts.some(o=>o.strategy_id===selected)?selected:'';}
 if(records.owners.length){$('owner-filter').classList.remove('hidden');$('owner-label').classList.remove('hidden');const owners=[...new Set([...records.owners,records.owner_user_id])];$('owner-filter').replaceChildren(...owners.map(v=>{const o=el('option','',v);o.value=v;return o;}));$('owner-filter').value=records.owner_user_id;owner=records.owner_user_id;const url=new URL(location.href);url.searchParams.set('user_id',owner);history.replaceState(null,'',url);}
}
async function refresh(force=false){
 if(document.hidden&&!force)return;if(request&&!force)return;if(request)request.abort();const active=new AbortController();request=active;
 $('refresh-state').textContent='正在刷新…';
 const params=owner?`?user_id=${encodeURIComponent(owner)}`:'';
 async function get(path){const r=await fetch(`${base}${path}${params}`,{credentials:'same-origin',cache:'no-store',signal:active.signal});const data=await r.json();if(!r.ok||!data.ok)throw new Error(data.error||`HTTP ${r.status}`);return data;}
 try{const [r,m]=await Promise.all([get('/api/strategies/executions'),get('/api/strategies/today-market')]);if(request!==active)return;records=r;market=m;options();render();$('error').classList.add('hidden');$('refresh-state').textContent='每 10 秒自动刷新';}
 catch(e){if(request!==active||e.name==='AbortError')return;$('error').textContent=`更新失败，保留上次画面：${e.message}`;$('error').classList.remove('hidden');$('refresh-state').textContent='更新失败 · 10 秒后重试';}
 finally{if(request===active)request=null;}
}
$('strategy-filter').addEventListener('change',render);
$('owner-filter').addEventListener('change',()=>{owner=$('owner-filter').value;records=null;market=null;$('stock-list').replaceChildren(el('div','empty','正在切换用户…'));refresh(true);});
$('refresh').addEventListener('click',()=>refresh(true));setInterval(()=>refresh(),10000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh(true);});refresh();
})();
</script></body></html>
