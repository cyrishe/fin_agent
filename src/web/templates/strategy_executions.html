:#d9e7f3;font-size:13px;margin-top:4px;font-weight:500}.row-body{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr)}.decision-summary{flex:1;min-width:400px;border-left:1px solid #345064;margin-left:6px;padding-left:20px}.execution{display:flex;gap:24px;align-items:center;padding:8px 0 0;font-size:12px}.trade{display:grid;grid-template-columns:auto auto;column-gap:10px;align-items:baseline}.trade-label{color:#9ab0c5}.trade b{font-size:16px;font-weight:500}.trade time{grid-column:2;font-size:10px;color:#8ba2b9;margin-top:3px}.trade-return{margin-left:8px;font-size:12px}.trade-return b{margin-left:10px}.badge{padding:3px 7px;border-radius:4px;font-size:10px;background:#293b50;color:#b0c3d5}.badge.holding{color:#f0d18e;background:#443e30}.selection-meta{display:flex;flex-wrap:wrap;gap:12px;align-items:center;font-size:11px;color:#8ba2b9;padding:0}.selection-date{font-variant-numeric:tabular-nums;color:#c4d7e7}.history-trigger{margin-left:10px;border:0;padding:0;background:transparent;color:#8ebad1;font-size:11px}.day-section{display:flex;flex-direction:column;gap:12px;margin-top:18px}.day-section:first-child{margin-top:0}.day-toggle{position:sticky;top:calc(var(--toolbar-height,105px) + 8px);z-index:1;display:flex;width:100%;align-items:center;gap:14px;text-align:left;padding:15px 17px;background:#254655;border:1px solid #487783;border-left:5px solid #80e0cd;border-radius:8px;box-shadow:0 5px 14px #02081266}.day-toggle strong{font-size:23px;letter-spacing:.5px;color:#effffa}.day-toggle span{font-size:12px;color:#c1dedf}.day-toggle .day-label{font-size:11px;color:#9ed2cc}.day-toggle .arrow{margin-left:auto;padding:6px 10px;border:1px solid #638b93;border-radius:5px;color:#e1f8f2;white-space:nowrap}.trade b.waiting{font-size:12px;font-weight:400;color:#9ab0c5}.day-stocks[hidden]{display:none}.day-stocks{display:flex;flex-direction:column;gap:10px}.history-dialog{background:#112032;border:1px solid #36516a;border-radius:12px;color:#e7eef6;width:min(720px,calc(100vw - 24px));padding:18px;max-height:75vh}.history-dialog::backdrop{background:#020812b8}.dialog-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.dialog-head h2{font-size:17px;margin:0}.history-scroll{overflow:auto}.history-table{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap;text-align:left}.history-table th{color:#91a7bd;font-weight:400}.history-table th,.history-table td{padding:9px 12px;border-bottom:1px solid #2b4054}.history-table th:first-child,.history-table td:first-child{padding-left:0}.history-table time{display:block;font-size:10px;color:#8ba2b9;margin-top:4px}
.minute-nav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.minute-nav button{padding:3px 7px;font-size:11px}.minute-nav button:disabled{opacity:.3;cursor:default}.minute-nav .minute-date{color:#d5e8f4;font-size:12px;font-variant-numeric:tabular-nums}

<body><main class="shell">
<header class="toolbar"><h1>策略选股总览</h1><label for="strategy-filter">模型</label><select id="strategy-filter"><option value="">全部模型</option></select><label for="owner-filter" id="owner-label" class="hidden">用户</label><select id="owner-filter" class="hidden"></select><span class="spacer"></span><span class="live" id="refresh-state">每 10 秒自动刷新</span><button id="refresh" type="button">立即刷新</button><a id="home-link" href="#">工作台</a></header>
<div class="subtitle"><span id="summary">最近 20 个交易日 · 按选股日期</span><span id="asof">正在读取…</span></div>
<div id="error" class="error hidden" role="alert"></div><section id="stock-list" class="list" aria-label="选股与实时行情列表"><div class="empty">正在加载股票列表…</div></section>
<dialog id="selection-history" class="history-dialog" aria-labelledby="history-title"><div class="dialog-head"><h2 id="history-title">选股历史</h2><button id="close-history" type="button" aria-label="关闭选股历史">关闭</button></div><div id="history-content" class="history-scroll"></div></dialog>
</main>
<script>
(()=>{
const base=location.pathname.replace(/\/strategies\/?$/,'').replace(/\/$/,'');
const $=id=>document.getElementById(id);
$('home-link').href=`${base}/assistant`;
const el=(tag,cls='',text)=>{const n=document.createElement(tag);n.className=cls;if(text!==undefined)n.textContent=String(text);return n;};
const svg=(tag,attrs={})=>{const n=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const [k,v] of Object.entries(attrs))n.setAttribute(k,String(v));return n;};
const price=x=>x==null?'—':Number(x).toFixed(2);
const signed=x=>x==null?'—':`${Number(x)>0?'+':''}${Number(x).toFixed(2)}%`;
const color=x=>x==null?'flat':Number(x)>0?'up':Number(x)<0?'down':'flat';
const dateTime=x=>x?String(x).replace('T',' ').slice(5,16):'—';
let pendingCharts=[];
const expandedDates=new Map(),historicalMarkets=new Map(),historyRequests=new Map();
const minuteOffsets=new Map(),minuteMarkets=new Map(),minuteRequests=new Map(),visibleMinuteViews=new Map();
const pickKey=p=>`${p.signal_date}:${p.strategy_id}:${p.stock_code}`;
const minuteKey=(p,offset)=>`${p.signal_date}:${offset}:${p.stock_code}`;
let historyEpoch=0;
let historyFocus=null;
let records=null,market=null,request=null,owner=new URLSearchParams(location.search).get('user_id')||'';
function chart(bars,title,width,options={}){
 const height=118,left=42,right=options.reference>0?55:10,top=10,bottom=77;
 const root=svg('svg',{class:'chart',viewBox:`0 0 ${width} ${height}`,preserveAspectRatio:'none',role:'img','aria-label':`${title} · ${bars.length} 根K线`});
 root.dataset.barCount=String(bars.length);root.dataset.firstTime=bars[0].time;root.dataset.lastTime=bars.at(-1).time;
 const lo=Math.min(...bars.map(b=>Number(b.low))),hi=Math.max(...bars.map(b=>Number(b.high))),pad=Math.max((hi-lo)*.08,.02);
 const min=lo-pad,max=hi+pad,y=p=>bottom-(Number(p)-min)/(max-min)*(bottom-top);
 for(let i=0;i<3;i++){const yy=top+(bottom-top)*i/2;root.append(svg('line',{x1:left,y1:yy,x2:width-right,y2:yy,class:'chart-grid'}));const t=svg('text',{x:left-7,y:yy+3,'text-anchor':'end',class:'chart-label'});const tick=max-(max-min)*i/2;t.textContent=tick.toFixed(2);root.append(t);if(options.reference>0){const pct=svg('text',{x:width-right+5,y:yy+3,class:'chart-label'});pct.textContent=signed((tick/options.reference-1)*100);root.append(pct);}}
 const step=(width-left-right)/bars.length,barWidth=Math.min(16,step*.62),volMax=Math.max(1,...bars.map(b=>Number(b.volume)||0));
 bars.forEach((b,i)=>{const x=left+(i+.5)*step,up=Number(b.close)>=Number(b.open),fill=up?'#ff8b8b':'#70d9b9';
 const g=svg('g'),tip=svg('title');tip.textContent=`${b.date} ${b.time} 开${price(b.open)} 高${price(b.high)} 低${price(b.low)} 收${price(b.close)}`;g.append(tip);
 g.append(svg('line',{x1:x,x2:x,y1:y(b.high),y2:y(b.low),stroke:fill,'stroke-width':1.2}),svg('rect',{x:x-barWidth/2,y:Math.min(y(b.open),y(b.close)),width:barWidth,height:Math.max(1,Math.abs(y(b.open)-y(b.close))),fill}));root.append(g);
 const v=Number(b.volume)||0;root.append(svg('rect',{x:x-barWidth/2,y:101-v/volMax*16,width:barWidth,height:v/volMax*16,fill,opacity:.5}));
 if(new Set([0,Math.floor((bars.length-1)/2),bars.length-1]).has(i)){const t=svg('text',{x,y:115,'text-anchor':'middle',class:'chart-label'});t.textContent=b.time;root.append(t);}
 });
 if(options.reference>0&&options.reference>=min&&options.reference<=max)root.append(svg('line',{x1:left,x2:width-right,y1:y(options.reference),y2:y(options.reference),stroke:'#8ba3b8','stroke-dasharray':'3 3',opacity:.7}));
 if(options.average){let volume=0,weighted=0;const points=[];bars.forEach((b,i)=>{const v=Number(b.volume)||0;if(v>0){volume+=v;weighted+=((Number(b.high)+Number(b.low)+Number(b.close))/3)*v;}if(volume)points.push(`${left+(i+.5)*step},${y(weighted/volume)}`);});if(points.length)root.append(svg('polyline',{points:points.join(' '),fill:'none',stroke:'#edc66b','stroke-width':1.3,'aria-label':'当日成交均价估算线'}));}
 return root;
}
function panel(title,caption,bars,empty,options={}){
 const p=el('div','chart-panel'),head=el('div','chart-head');head.append(el('h3','',title),el('span','',caption));p.append(head);
 const valid=bars.filter(b=>['open','high','low','close'].every(k=>b[k]!=null&&Number.isFinite(Number(b[k]))&&Number(b[k])>0));
 if(valid.length){const slot=el('div');p.append(slot);pendingCharts.push(()=>slot.replaceWith(chart(valid,title,Math.max(240,p.clientWidth-28),options)));}
 else p.append(el('div','empty-chart',empty));return p;
}
const modelName=p=>p.strategy_name||p.strategy_id;
function recentHistory(pick){const dates=new Set(records.trade_dates);return records.picks.filter(p=>p.stock_code===pick.stock_code&&dates.has(p.signal_date)).sort((a,b)=>b.signal_date.localeCompare(a.signal_date)||a.strategy_id.localeCompare(b.strategy_id));}
function historyCount(rows){return new Set(rows.map(p=>`${p.signal_date}:${modelName(p)}`)).size;}
function showHistory(pick){
 const dialog=$('selection-history');historyFocus=document.activeElement;
 $('history-title').textContent=`${pick.stock_name} · 近 20 日选股`;
 const table=el('table','history-table'),head=el('thead'),hr=el('tr');
 for(const label of ['选股日期','模型','买','卖','收益'])hr.append(el('th','',label));head.append(hr);table.append(head);
 const body=el('tbody');
 for(const p of recentHistory(pick)){const row=el('tr');row.append(el('td','',p.signal_date),el('td','',p.strategy_id));
 for(const [label,value,at] of [['买',p.entry_price,p.entry_at],['卖',p.exit_price,p.exit_at]]){const cell=el('td','',label==='卖'&&value==null?'暂未卖出':price(value));if(at)cell.append(el('time','',dateTime(at)));row.append(cell);}
 row.append(el('td',color(p.gross_return_pct),signed(p.gross_return_pct)));body.append(row);}
 table.append(body);$('history-content').replaceChildren(table);dialog.showModal();
}
function drawCharts(){pendingCharts.forEach(draw=>draw());pendingCharts=[];}
function stockRow(pick,names,stockMap,dayMarket){
 const live=pick.signal_date===market?.trade_date;
 const stock=stockMap.get(pick.stock_code),q=stock?.quote,article=el('article','stock-row');article.dataset.code=pick.stock_code;article.dataset.model=pick.strategy_id;article.dataset.selectionDate=pick.signal_date;
 const head=el('div','row-head'),identity=el('div','identity'),name=el('div');name.append(el('strong','',pick.stock_name),el('span','code',pick.stock_code));identity.append(name,el('span','model',names.get(pick.strategy_id)||pick.strategy_id));
 const quote=el('div',`quote ${color(q?.pct)}`);quote.append(el('b','',price(q?.close)),el('span','',signed(q?.pct)));const quoteBlock=el('div','quote-block');quoteBlock.append(quote);head.append(identity,quoteBlock);
 quoteBlock.append(el('div','quote-time',q?(live?`行情 ${q.snapshot_time?.slice(11,19)||''}`:`${pick.signal_date.slice(5)} 收盘`):dayMarket?.quote_error||dayMarket?.error||(dayMarket?'该日行情缺失':'加载中…')));
 const stats=el('div','stats');for(const [name,value]of [[live?'昨收':'前收',q?.preclose],[live?'今开':'开盘',q?.open],['最高',q?.high],['最低',q?.low]]){const v=el('div','stat',name);v.append(el('b','',price(value)));stats.append(v);}head.append(stats);article.append(head);
 const meta=el('div','selection-meta'),eligible=pick.actionable==null||Boolean(Number(pick.actionable));
 meta.append(el('span','selection-date',`${pick.signal_date} 选股`),el('span','',`第${pick.selection_rank}名`),el('span',`badge ${eligible?'holding':''}`,eligible?'被选中可交易':'观察 / 轮空'));
 const history=recentHistory(pick),same=history.filter(p=>modelName(p)===modelName(pick)),other=history.filter(p=>modelName(p)!==modelName(pick));
 const trigger=el('button','history-trigger',`本模型 ${historyCount(same)} 次 · 其他模型 ${historyCount(other)} 次 ›`);trigger.type='button';trigger.setAttribute('aria-label',`${pick.stock_name}近20日选股历史`);trigger.addEventListener('click',()=>showHistory(pick));meta.append(trigger);const decision=el('div','decision-summary');decision.append(meta);head.append(decision);
 const execution=el('div','execution');
 for(const [label,value,at]of [['买',pick.entry_price,pick.entry_at],['卖',pick.exit_price,pick.exit_at]]){const cell=el('div','trade');cell.append(el('span','trade-label',label),el('b',label==='卖'&&value==null?'waiting':'',label==='卖'&&value==null?'暂未卖出':price(value)));if(at)cell.append(el('time','',dateTime(at)));execution.append(cell);}
 const ret=el('div','trade-return','收益');ret.append(el('b',color(pick.gross_return_pct),signed(pick.gross_return_pct)));execution.append(ret);decision.append(execution);
 const body=el('div','row-body'),offset=minuteOffsets.get(pickKey(pick))||0;
 const minuteMarket=offset?minuteMarkets.get(minuteKey(pick,offset)):dayMarket;
 const minuteStock=offset?minuteMarket?.stocks?.find(s=>s.code===pick.stock_code):stock;
 const dates=dayMarket?.minute_dates||[pick.signal_date],index=dates.indexOf(pick.signal_date)+offset;
 const minuteDay=dates[index]||pick.signal_date,minuteLive=minuteDay===market?.trade_date;
 const minute=minuteStock?.bars||[],n=minuteMarket?.requested_minutes??(minuteLive?0:240);
 const minuteCaption=minuteMarket?.error||minuteStock?.minute_error||`${minute.length}/${n} 根 · 均价线`;
 const minutePanel=panel(`${minuteDay} · 1 分钟 K`,minuteCaption,minute,minuteMarket?.error||minuteStock?.minute_error||(minuteMarket?(n?'该日分钟数据缺失':'尚未开盘'):'加载中…'),{reference:minuteStock?.quote?.preclose,average:true});
 const nav=el('div','minute-nav'),prev=el('button','','‹'),next=el('button','','›'),reset=el('button','','选股日');
 prev.type=next.type=reset.type='button';prev.setAttribute('aria-label',`${pick.stock_name}前一交易日分钟K`);next.setAttribute('aria-label',`${pick.stock_name}后一交易日分钟K`);
 prev.disabled=index<=0;next.disabled=index>=dates.length-1||minuteDay>=market?.trade_date;
 reset.disabled=offset===0;reset.setAttribute('aria-label',`${pick.stock_name}返回选股日分钟K`);
 const change=value=>{minuteOffsets.set(pickKey(pick),value);render();};
 prev.addEventListener('click',()=>change(offset-1));next.addEventListener('click',()=>change(offset+1));reset.addEventListener('click',()=>change(0));
 nav.append(prev,el('span','minute-date',`${minuteDay.slice(5)}${minuteLive?' 今日':''} · 1 分钟 K`),next,reset);
 minutePanel.querySelector('h3').replaceWith(nav);minutePanel.dataset.minuteDate=minuteDay;body.append(minutePanel);
 if(offset){visibleMinuteViews.set(minuteKey(pick,offset),{pick,offset,day:minuteDay});ensureMinuteMarket(pick,offset);}
 let daily=[...(stock?.daily_bars||[])];if(live&&q&&q.open>0&&q.high>0&&q.low>0&&q.close>0){daily.push({date:market.trade_date,time:market.trade_date.slice(5),open:q.open,high:q.high,low:q.low,close:q.close,volume:q.volumn==null?null:Number(q.volumn)*100,amount:q.amount});}daily=daily.slice(-20);
 body.append(panel('近 20 日日 K',`截至 ${pick.signal_date.slice(5)}`,daily,dayMarket?.error||(dayMarket?'该日数据缺失':'加载中…'),{reference:q?.preclose}));article.append(body);return article;
}
async function ensureMinuteMarket(pick,offset,force=false){
 const key=minuteKey(pick,offset);if(minuteRequests.has(key)||(!force&&minuteMarkets.has(key)))return;
 const epoch=historyEpoch,params=new URLSearchParams({date:pick.signal_date,minute_offset:String(offset),stock_code:pick.stock_code});if(owner)params.set('user_id',owner);
 minuteRequests.set(key,true);
 try{const response=await fetch(`${base}/api/strategies/market?${params}`,{credentials:'same-origin',cache:'no-store'});const data=await response.json();if(!response.ok||!data.ok)throw new Error(data.error||'分钟行情加载失败');if(epoch===historyEpoch)minuteMarkets.set(key,data);}
 catch(e){if(epoch===historyEpoch)minuteMarkets.set(key,{stocks:[],error:e.message});}
 finally{if(epoch===historyEpoch){minuteRequests.delete(key);render();}}
}
async function ensureHistoricalMarket(day){
 if(day===market?.trade_date||historicalMarkets.has(day)||historyRequests.has(day))return;
 const epoch=historyEpoch,params=new URLSearchParams({date:day});if(owner)params.set('user_id',owner);
 historyRequests.set(day,true);
 try{const response=await fetch(`${base}/api/strategies/market?${params}`,{credentials:'same-origin',cache:'no-store'});const data=await response.json();if(!response.ok||!data.ok)throw new Error(data.error||'历史行情加载失败');if(epoch===historyEpoch)historicalMarkets.set(day,data);}
 catch(e){if(epoch===historyEpoch)historicalMarkets.set(day,{trade_date:day,stocks:[],error:e.message});}
 finally{if(epoch===historyEpoch){historyRequests.delete(day);render();}}
}
function render(){
 if(!records)return;pendingCharts=[];visibleMinuteViews.clear();
 const selected=$('strategy-filter').value,groups=new Map(),names=new Map(records.strategies.map(s=>[s.strategy_id,s.name]));
 const picks=records.picks.filter(p=>!selected||p.strategy_id===selected).sort((a,b)=>b.signal_date.localeCompare(a.signal_date)||a.strategy_id.localeCompare(b.strategy_id)||a.selection_rank-b.selection_rank);
 for(const p of picks){if(!groups.has(p.signal_date))groups.set(p.signal_date,[]);groups.get(p.signal_date).push(p);}
 const container=$('stock-list');container.replaceChildren();
 $('summary').textContent=`${market&&!groups.has(market.trade_date)?'今日暂无新选股 · ':''}最近 20 个交易日 · 按选股日期`;
 $('asof').textContent=market?`${market.trade_date} · ${market.as_of.slice(11,19)} 更新`:'行情正在加载…';
 if(!groups.size){container.append(el('div','empty','此模型暂无选股记录。'));return;}
 const latest=groups.keys().next().value;
 for(const [day,entries] of groups){
 const key=`${selected}:${day}`;if(!expandedDates.has(key))expandedDates.set(key,day===latest);
 const section=el('section','day-section'),toggle=el('button','day-toggle');toggle.type='button';toggle.setAttribute('aria-expanded',String(expandedDates.get(key)));
 toggle.append(el('span','day-label','选股日期'),el('strong','',day),el('span','',`${day===market?.trade_date?'今日 · ':day===latest?'最近选股 · ':''}${entries.length} 条选股`),el('span','arrow',expandedDates.get(key)?'收起 −':'展开 +'));
 section.dataset.date=day;section.append(toggle);
 const list=el('div','day-stocks');
 function fill(){const dayMarket=day===market?.trade_date?market:historicalMarkets.get(day),stockMap=new Map((dayMarket?.stocks||[]).map(s=>[s.code,s]));list.replaceChildren(...entries.map(p=>stockRow(p,names,stockMap,dayMarket)));ensureHistoricalMarket(day);}
 if(expandedDates.get(key))fill();else list.hidden=true;
 toggle.addEventListener('click',()=>{const open=!expandedDates.get(key);expandedDates.set(key,open);toggle.setAttribute('aria-expanded',String(open));toggle.querySelector('.arrow').textContent=open?'收起 −':'展开 +';list.hidden=!open;if(open){fill();drawCharts();}});
 section.append(list);container.append(section);
 }
 drawCharts();
}
function options(){
 const selected=$('strategy-filter').value;const opts=[{strategy_id:'',name:'全部模型'},...records.strategies];
 if(JSON.stringify([...$('strategy-filter').options].map(o=>[o.value,o.textContent]))!==JSON.stringify(opts.map(s=>[s.strategy_id,s.name]))){$('strategy-filter').replaceChildren(...opts.map(s=>{const o=el('option','',s.name);o.value=s.strategy_id;return o;}));$('strategy-filter').value=opts.some(o=>o.strategy_id===selected)?selected:'';}
 if(records.owners.length){$('owner-filter').classList.remove('hidden');$('owner-label').classList.remove('hidden');const owners=[...new Set([...records.owners,records.owner_user_id])];$('owner-filter').replaceChildren(...owners.map(v=>{const o=el('option','',v);o.value=v;return o;}));$('owner-filter').value=records.owner_user_id;owner=records.owner_user_id;const url=new URL(location.href);url.searchParams.set('user_id',owner);history.replaceState(null,'',url);}
}
async function refresh(force=false){
 if(document.hidden&&!force)return;if(request&&!force)return;if(request)request.abort();const active=new AbortController();request=active;
 $('refresh-state').textContent='正在刷新…';
 const params=owner?`?user_id=${encodeURIComponent(owner)}`:'';
 async function get(path){const r=await fetch(`${base}${path}${params}`,{credentials:'same-origin',cache:'no-store',signal:active.signal});const data=await r.json();if(!r.ok||!data.ok)throw new Error(data.error||`HTTP ${r.status}`);return data;}
 try{const [r,m]=await Promise.all([get('/api/strategies/executions'),get('/api/strategies/market')]);if(request!==active)return;records=r;market=m;options();render();await Promise.all([...visibleMinuteViews.values()].filter(v=>v.day===market.trade_date).map(v=>ensureMinuteMarket(v.pick,v.offset,true)));if(request!==active)return;$('error').classList.add('hidden');$('refresh-state').textContent='每 10 秒自动刷新';}
 catch(e){if(request!==active||e.name==='AbortError')return;$('error').textContent=`更新失败，保留上次画面：${e.message}`;$('error').classList.remove('hidden');$('refresh-state').textContent='更新失败 · 10 秒后重试';}
 finally{if(request===active)request=null;}
}
$('strategy-filter').addEventListener('change',render);
$('close-history').addEventListener('click',()=>$('selection-history').close());
$('selection-history').addEventListener('close',()=>{const target=historyFocus?.isConnected?historyFocus:[...document.querySelectorAll('.history-trigger')].find(n=>n.getAttribute('aria-label')===historyFocus?.getAttribute('aria-label'));target?.focus();});
$('owner-filter').addEventListener('change',()=>{owner=$('owner-filter').value;historyEpoch++;minuteOffsets.clear();minuteMarkets.clear();minuteRequests.clear();historicalMarkets.clear();historyRequests.clear();expandedDates.clear();$('selection-history').close();records=null;market=null;$('stock-list').replaceChildren(el('div','empty','正在切换用户…'));refresh(true);});
new ResizeObserver(([entry])=>document.documentElement.style.setProperty('--toolbar-height',`${entry.target.getBoundingClientRect().bottom-entry.target.getBoundingClientRect().top}px`)).observe(document.querySelector('.toolbar'));
$('refresh').addEventListener('click',()=>{minuteMarkets.clear();historicalMarkets.clear();refresh(true);});setInterval(()=>refresh(),10000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh(true);});refresh();
})();
</script></body></html>
