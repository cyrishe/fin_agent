<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page_title or "Skills" }}</title>
  <style>
    :root {
      --bg: #f2eee5;
      --panel: #fffdf8;
      --line: #d9cfbf;
      --text: #1f1c17;
      --muted: #6d6458;
      --accent: #8e5b2d;
      --ok: #1d6b45;
      --warn: #a65d00;
      --err: #a12626;
      --shadow: 0 16px 40px rgba(74, 52, 23, 0.08);
      --sans: "PingFang SC", "Noto Sans SC", "Helvetica Neue", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: var(--sans); color: var(--text); background: radial-gradient(circle at top left, rgba(222,186,137,.28), transparent 28%), linear-gradient(180deg, #f8f3ea 0%, #f0e8db 100%); }
    .shell { max-width: 1480px; margin: 0 auto; padding: 24px; display: grid; gap: 18px; }
    .hero, .panel { background: var(--panel); border: 1px solid rgba(151, 90, 43, 0.12); border-radius: 22px; box-shadow: var(--shadow); }
    .hero { padding: 22px 24px; display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; }
    .hero h1 { margin: 0; font-size: 28px; }
    .hero p { margin: 8px 0 0; color: var(--muted); line-height: 1.6; max-width: 780px; }
    .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .btn { border: 1px solid var(--line); background: #f6f0e5; color: var(--text); padding: 10px 14px; border-radius: 12px; cursor: pointer; font-weight: 600; text-decoration: none; }
    .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .status { padding: 12px 14px; border-radius: 14px; font-size: 13px; line-height: 1.5; display: none; white-space: pre-wrap; }
    .status.show { display: block; }
    .status.err { background: #fdeeee; color: var(--err); border: 1px solid rgba(161,38,38,.18); }
    .status.ok { background: #eef9f2; color: var(--ok); border: 1px solid rgba(29,107,69,.18); }
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
    .card { border: 1px solid var(--line); border-radius: 18px; background: #fffaf3; padding: 16px; display: grid; gap: 10px; }
    .title { font-weight: 700; font-size: 18px; color: var(--text); text-decoration: none; }
    .muted { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .chips, .actions { display: flex; flex-wrap: wrap; gap: 10px; }
    .chip { background: #f3dfc7; color: #744117; border-radius: 999px; padding: 6px 10px; font-size: 12px; }
    .switch {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      border-radius: 999px;
      padding: 6px 10px 6px 8px;
      min-height: 34px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 12px;
    }
    .switch-track {
      width: 34px;
      height: 20px;
      border-radius: 999px;
      background: #d8ccba;
      position: relative;
      transition: background .18s ease;
      flex: 0 0 auto;
    }
    .switch-track::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 3px rgba(0,0,0,.18);
      transition: transform .18s ease;
    }
    .switch.on {
      background: #eef9f2;
      color: var(--ok);
      border-color: rgba(29,107,69,.18);
    }
    .switch.on .switch-track { background: #4ca06f; }
    .switch.on .switch-track::after { transform: translateX(14px); }
    .switch-label { white-space: nowrap; font-weight: 600; }
    @media (max-width: 1180px) { .grid { grid-template-columns: 1fr 1fr; } .hero { display: grid; } }
    @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="shell">
    <section class="hero">
      <div>
        <h1>Skills</h1>
        <p>统一查看 Finance CC 专业方法与历史 compiled Skill。两类 Skill 的执行路径保持隔离；当前页面只承担发现，不把 CC 方法送入旧 Runner。</p>
      </div>
    </section>

    <div id="globalStatus" class="status"></div>

    <section class="panel">
      <div id="skillGrid" class="grid"></div>
    </section>
  </div>

  <script>
    const apiSkillCatalogUrl = {{ api_skill_catalog_url|tojson }};
    const apiSkillBaseUrl = {{ api_skill_base_url|tojson }};
    const skillStudioBaseUrl = {{ skill_studio_base_url|tojson }};
    const appRoot = (() => {
      const marker = "/skills";
      const path = window.location.pathname;
      const idx = path.indexOf(marker);
      return idx >= 0 ? path.slice(0, idx) : "";
    })();
    function resolveUrl(url) {
      if (!url) return url;
      if (/^https?:\/\//.test(url)) return url;
      if (url.startsWith("/")) return url;
      return `${appRoot}/${String(url).replace(/^\/+/, "")}`;
    }
    const resolvedApiSkillCatalogUrl = resolveUrl(apiSkillCatalogUrl);
    const resolvedApiSkillBaseUrl = resolveUrl(apiSkillBaseUrl);
    const resolvedSkillStudioBaseUrl = resolveUrl(skillStudioBaseUrl);
    let currentItems = [];

    function setStatus(text, ok=false) {
      const el = document.getElementById("globalStatus");
      if (!text) { el.className = "status"; el.textContent = ""; return; }
      el.className = `status show ${ok ? "ok" : "err"}`;
      el.textContent = text;
    }

    async function fetchJson(url, options) {
      const res = await fetch(url, options || {});
      const text = await res.text();
      let payload = null;
      try { payload = text ? JSON.parse(text) : null; } catch (err) { throw new Error(`接口未返回 JSON: ${res.status}`); }
      if (!res.ok || (payload && payload.ok === false)) throw new Error((payload && payload.error) || `HTTP ${res.status}`);
      return payload;
    }

    async function updateAvailability(skillName, patch) {
      await fetchJson(`${resolvedApiSkillBaseUrl}/${encodeURIComponent(skillName)}/availability`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(patch || {}),
      });
      setStatus(`已更新 ${skillName}`, true);
      await loadCatalog();
    }

    function textElement(tagName, className, value) {
      const element = document.createElement(tagName);
      if (className) element.className = className;
      element.textContent = String(value ?? "");
      return element;
    }

    function switchButton(action, enabled, label) {
      const button = document.createElement("button");
      button.className = `switch ${enabled ? "on" : ""}`;
      button.dataset.action = action;
      button.type = "button";
      button.appendChild(textElement("span", "switch-track", ""));
      button.appendChild(textElement("span", "switch-label", label));
      return button;
    }

    function render(items) {
      currentItems = items || [];
      const root = document.getElementById("skillGrid");
      root.replaceChildren();
      for (const item of currentItems) {
        const availability = item.availability || {};
        const lifecycle = String(availability.lifecycle || "active");
        const retrievalMode = String(availability.retrieval_mode || "retrievable");
        const skillType = String(item.skill_type || "legacy_compiled");
        const isLegacy = skillType === "legacy_compiled";
        const isEditable = Boolean(item.editable);
        const title = String(item.display_name || item.skill_name || "-");
        const node = document.createElement("div");
        node.className = "card";

        if (item.workspace_url) {
          const titleLink = textElement("a", "title", title);
          titleLink.href = resolveUrl(String(item.workspace_url));
          node.appendChild(titleLink);
        } else {
          node.appendChild(textElement("div", "title", title));
        }
        node.appendChild(
          textElement("div", "muted", item.purpose || item.description || "")
        );

        const chips = document.createElement("div");
        chips.className = "chips";
        for (const value of [
          skillType,
          item.invocation_mode || "-",
          item.owner || "system",
          item.auth || "public",
          item.tool_mode || "strict",
          `${(item.tools || []).length} tools`,
          `${item.example_count || 0} examples`,
        ]) {
          chips.appendChild(textElement("div", "chip", value));
        }
        node.appendChild(chips);

        const actions = document.createElement("div");
        actions.className = "actions";
        if (isLegacy && isEditable) {
          const lifecycleButton = switchButton(
            "lifecycle",
            lifecycle === "active",
            lifecycle === "active" ? "在用" : "下线",
          );
          const retrievalButton = switchButton(
            "retrieval",
            retrievalMode === "retrievable",
            retrievalMode === "retrievable" ? "参与搜索" : "不参与搜索",
          );
          lifecycleButton.addEventListener("click", async (e) => {
            e.preventDefault();
            const next = lifecycle === "active" ? "retired" : "active";
            try { await updateAvailability(item.skill_name, { lifecycle: next }); } catch (err) { setStatus(String(err.message || err)); }
          });
          retrievalButton.addEventListener("click", async (e) => {
            e.preventDefault();
            const next = retrievalMode === "retrievable" ? "direct_only" : "retrievable";
            try { await updateAvailability(item.skill_name, { retrieval_mode: next }); } catch (err) { setStatus(String(err.message || err)); }
          });
          actions.append(lifecycleButton, retrievalButton);
        } else {
          if (item.workspace_url) {
            const detailLink = textElement("a", "btn", "查看方法");
            detailLink.href = resolveUrl(String(item.workspace_url));
            actions.appendChild(detailLink);
          }
          actions.appendChild(
            textElement(
              "span",
              "muted",
              isLegacy
                ? "历史兼容资产；新 Studio 只展示目录身份。"
                : "可查看已发布方法；由 Finance CC 按专业问题选择。",
            )
          );
        }
        node.appendChild(actions);
        root.appendChild(node);
      }
    }

    async function loadCatalog() {
      const payload = await fetchJson(resolvedApiSkillCatalogUrl);
      render(payload.items || []);
    }

    loadCatalog().catch((err) => setStatus(String(err.message || err)));
  </script>
</body>
</html>
