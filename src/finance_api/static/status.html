<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>金融数据状态</title>
<style>
:root{font-family:system-ui,-apple-system,"PingFang SC",sans-serif;color:#172b45;background:#f3f6fa}body{max-width:1440px;margin:0 auto;padding:28px}h1{font-size:28px;margin:0}header{display:flex;justify-content:space-between;align-items:center;gap:16px}a{color:#176b87;margin-left:16px}p{color:#607087;line-height:1.7}.cards{display:flex;gap:16px;margin:24px 0;flex-wrap:wrap}.card{background:white;padding:20px 26px;border-radius:14px;flex:1;min-width:140px;border:1px solid #e0e7ef}.card strong{display:block;font-size:30px;margin-top:8px}.toolbar{display:flex;gap:16px;align-items:center;margin-bottom:18px;flex-wrap:wrap}input,select,button{font:inherit;padding:10px;border:1px solid #cbd5e1;border-radius:8px;background:white}section{background:white;border:1px solid #e0e7ef;border-radius:14px;margin-bottom:20px;overflow:hidden}h2{font-size:18px;padding:16px 20px;margin:0;background:#edf5fa}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;font-size:14px;white-space:nowrap}th,td{text-align:left;padding:14px 18px;border-bottom:1px solid #edf0f5}th{color:#607087;font-weight:500}td small{display:block;color:#64748b;font-size:12px;max-width:340px;white-space:normal;margin-top:5px}.good{color:#087c65}.warn{color:#ad5500}.badge{padding:5px 9px;background:#edf7f4;border-radius:6px;display:inline-block}.warn .badge{background:#fff3df}.notice{background:#fff3df;border-radius:8px;padding:12px 18px}details{font-size:12px;color:#5d7084}summary{cursor:pointer}footer{font-size:13px;color:#607087;margin-top:24px}@media(max-width:640px){body{padding:16px}header{display:block}nav{margin-top:15px}.card{padding:14px}h1{font-size:24px}}
</style></head><body>
<header><div><h1>金融数据状态</h1><p>同步时效 · 数据量对比 · 数据范围</p></div><nav><a href="data-map">数据体系</a><a href="docs">API 文档</a></nav></header>
<div id="notice" class="notice">正在获取最近一次扫描结果…</div>
<div class="cards"><div class="card">监控数据集<strong id="total">—</strong></div><div class="card">需要关注<strong id="alerts">—</strong></div><div class="card">目标日记录总量<strong id="rows">—</strong></div><div class="card">最近扫描<strong id="checked" style="font-size:17px">—</strong></div></div>
<div class="toolbar"><input id="search" placeholder="查找股票、研报、现金流…" aria-label="搜索数据集"><select id="group" aria-label="数据分类"><option value="">全部分类</option></select><label><input type="checkbox" id="only"> 只看需要关注</label><button id="refresh">刷新页面数据</button></div>
<div id="groups"></div>
<footer>北京时间；分钟K线每分钟检查，默认允许5分钟延迟，午休及收盘冻结预期时点；数量为1分钟源K线与前五交易日同时点的累计量对比。其他日更数据默认15:30后每15分钟检查T-1：交易数据取前一交易日，研报取前一自然日。前五日均值包含零记录日期；休市日免更新缺失告警，数据库检查失败仍提示。财报、分红、股东等按披露更新，零新增不代表同步失败。数据量总和不代表证券数量；库内到达不等于同步任务完成。</footer>
<script>
let snapshot={items:[]};const $=id=>document.getElementById(id);const fmt=n=>n==null?'—':Number(n).toLocaleString('zh-CN',{maximumFractionDigits:1});
function el(tag,text,cls){const n=document.createElement(tag);if(text!=null)n.textContent=text;if(cls)n.className=cls;return n}
function render(){const items=snapshot.items||[];$('total').textContent=items.length;$('alerts').textContent=items.filter(x=>x.attention).length;$('rows').textContent=fmt(items.reduce((s,x)=>s+(x.count||0),0));$('checked').textContent=snapshot.checked_at?new Date(snapshot.checked_at).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'}):'尚未扫描';$('notice').textContent=[snapshot.scan_failed?'本轮检查失败。':'',snapshot.stale?'快照较旧，请关注扫描任务。':'',snapshot.trading_day===false?'今日非交易日，免更新缺失告警。':'',snapshot.message||''].join(' ');$('groups').replaceChildren();const selected=items.filter(x=>(!$('only').checked||x.attention)&&(!$('group').value||x.group===$('group').value)&&(x.group+x.label+x.message).includes($('search').value));for(const group of [...new Set(selected.map(x=>x.group))]){const section=el('section');section.append(el('h2',group));const wrap=el('div',null,'scroll'),table=el('table'),head=el('tr');for(const title of ['数据范围','状态','目标日期 / 频率','目标日量','前五日均值','相对均值','最新数据 / 入库时间'])head.append(el('th',title));const thead=el('thead');thead.append(head);table.append(thead);const body=el('tbody');for(const item of selected.filter(x=>x.group===group)){const row=el('tr');const name=el('td',item.label);name.append(el('small',item.id));row.append(name);const status=el('td',null,item.attention?'warn':'good');status.append(el('span',item.message,'badge'));if(item.volume_note)status.append(el('small',item.volume_note));row.append(status);const target=el('td',item.target_date||'—');target.append(el('small',item.cadence||''));row.append(target,el('td',fmt(item.count)));const baseline=el('td',fmt(item.baseline_mean));if(item.history){const details=el('details');details.append(el('summary','查看每日数量'));for(const day of item.history)details.append(el('div',day.date+' · '+fmt(day.count)));baseline.append(details)}row.append(baseline,el('td',item.ratio==null?'无可比基线':fmt(item.ratio*100)+'%'));const latest=el('td',item.latest_date||'—');latest.append(el('small','目标日批次最新入库/变更：'+(item.arrived_at||'—')));row.append(latest);body.append(row)}table.append(body);wrap.append(table);section.append(wrap);$('groups').append(section)}if(!selected.length)$('groups').append(el('p','暂无匹配数据。'))}
async function refresh(){try{const response=await fetch('status/data',{cache:'no-store'});if(!response.ok)throw Error();snapshot=await response.json();const selected=$('group').value;$('group').replaceChildren(new Option('全部分类',''));for(const g of [...new Set((snapshot.items||[]).map(x=>x.group))])$('group').add(new Option(g,g));$('group').value=selected;render()}catch{$('notice').textContent='状态接口暂不可用；请稍后重试。'}}
for(const id of ['search','group','only'])$(id).addEventListener('input',render);$('refresh').onclick=refresh;refresh();setInterval(refresh,60000);
</script></body></html>
