<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Claude Agent SDK Harness Demo</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    body { margin: 0; background: #f4f1eb; color: #1e2926; }
    main { width: min(880px, calc(100% - 32px)); margin: 48px auto; }
    h1 { margin-bottom: 8px; font-size: clamp(28px, 5vw, 46px); letter-spacing: -0.04em; }
    .sub { margin: 0 0 28px; color: #5b6864; }
    .card { background: #fff; border: 1px solid #d9dedb; border-radius: 18px; padding: 20px; box-shadow: 0 18px 50px #27332e12; }
    textarea { width: 100%; box-sizing: border-box; min-height: 110px; resize: vertical; border: 1px solid #cbd3cf; border-radius: 12px; padding: 14px; font: inherit; }
    .actions { display: flex; align-items: center; gap: 14px; margin-top: 12px; }
    button { border: 0; border-radius: 999px; padding: 11px 20px; font-weight: 700; background: #174f3f; color: white; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    label { color: #4c5b56; font-size: 14px; }
    #status { margin: 18px 0 10px; color: #52635d; min-height: 22px; }
    #answer { white-space: pre-wrap; line-height: 1.7; min-height: 120px; }
    details { margin-top: 18px; border-top: 1px solid #e4e8e6; padding-top: 12px; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12px; color: #52605c; }
  </style>
</head>
<body>
<main>
  <h1>Claude Agent Harness</h1>
  <p class="sub">独立 demo：skills、tools、web search、权限 hooks 与 SSE 流式协议。</p>
  <section class="card">
    <textarea id="question" aria-label="问题">请说明当前问题应该如何验证事实来源。</textarea>
    <div class="actions">
      <button id="send">发送</button>
      <label><input id="web" type="checkbox" checked /> 允许 Web Search</label>
    </div>
    <div id="status"></div>
    <div id="answer"></div>
    <details><summary>诊断事件</summary><pre id="events"></pre></details>
  </section>
</main>
<script>
const send = document.querySelector('#send');
const answer = document.querySelector('#answer');
const status = document.querySelector('#status');
const events = document.querySelector('#events');

function parseSseChunk(buffer, onEvent) {
  const frames = buffer.split('\n\n');
  const remainder = frames.pop() || '';
  for (const frame of frames) {
    if (!frame || frame.startsWith(':')) continue;
    const dataLine = frame.split('\n').find(line => line.startsWith('data: '));
    if (dataLine) onEvent(JSON.parse(dataLine.slice(6)));
  }
  return remainder;
}

send.addEventListener('click', async () => {
  const question = document.querySelector('#question').value.trim();
  if (!question) return;
  send.disabled = true;
  answer.textContent = '';
  events.textContent = '';
  status.textContent = '连接中…';
  try {
    const response = await fetch('/v1/runs/stream', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        question,
        skill_names: ['financial-research'],
        enable_web_search: document.querySelector('#web').checked
      })
    });
    if (!response.ok || !response.body) throw new Error(await response.text());
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    const onEvent = event => {
      events.textContent += JSON.stringify(event, null, 2) + '\n';
      if (event.type === 'assistant.delta') answer.textContent += event.data.text || '';
      if (event.type === 'tool.started') status.textContent = `调用工具：${event.data.tool_name || '-'}`;
      if (event.type === 'run.completed') status.textContent = `完成 · session ${event.data.session_id || '-'}`;
      if (event.type === 'run.failed') status.textContent = `失败：${event.data.message || event.data.error_code}`;
    };
    while (true) {
      const {value, done} = await reader.read();
      buffer += decoder.decode(value || new Uint8Array(), {stream: !done});
      buffer = parseSseChunk(buffer, onEvent);
      if (done) break;
    }
  } catch (error) {
    status.textContent = `请求失败：${error.message}`;
  } finally {
    send.disabled = false;
  }
});
</script>
</body>
</html>
