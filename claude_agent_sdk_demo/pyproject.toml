[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-agent-sdk-harness-demo"
version = "0.1.0"
description = "Independent Claude Agent SDK wrapper with skills, tools, web search, hooks, and SSE streaming"
requires-python = ">=3.10"
dependencies = [
  "claude-agent-sdk==0.2.116",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
packages = ["app"]
