# Keep the sdk-minimal lifecycle but expose only Fin Agent's financial tools.
# The minimal SDK does not mount the request-retry plugin. Retry interrupted
# model responses before any tool block is committed; never replay a whole turn.
- id: llm-deepseek
  config:
    retryPolicy:
      mode: normal
      maxRetries: 2
      retryableCodes: [EMPTY_RESPONSE, RATE_LIMIT, SERVER, TIMEOUT, TRANSPORT, STREAM_CLOSED]

- id: persistent-bash
  disabled: true

- id: persistent-pwsh
  disabled: true

- id: str-replace-editor
  disabled: true

- insert:
    - id: fin-agent-llm-retry
      name: '@deepseek-ai/dsh-llm-retry'

    - id: fin-agent-finance-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: finance
        transport: stdio
        command: !!js process.env.FIN_AGENT_DSH_PYTHON
        args: ['-m', 'src.scenarios.financial_qa.dsh_mcp_server']
        cwd: !!js process.env.FIN_AGENT_ROOT
        env:
          PYTHONPATH: !!js process.env.FIN_AGENT_ROOT
          FIN_AGENT_DSH_CONTEXT_PATH: !!js process.env.FIN_AGENT_DSH_CONTEXT_PATH
          FIN_AGENT_DSH_TRACE_PATH: !!js process.env.FIN_AGENT_DSH_TRACE_PATH
          LLM_BASE_URL: !!js process.env.LLM_BASE_URL
          LLM_API_KEY: !!js process.env.LLM_API_KEY
          LLM_DEFAULT_MODEL: !!js process.env.LLM_DEFAULT_MODEL
          LLM_VISION_MODEL: !!js process.env.LLM_VISION_MODEL
          LLM_FLASH_MODEL: !!js process.env.LLM_FLASH_MODEL
          LLM_REASONING_MODEL: !!js process.env.LLM_REASONING_MODEL
        toolCallTimeoutMs: 180000
        failOnStartupError: true
        reconnect:
          enabled: true
          initialDelayMs: 500
          maxDelayMs: 10000
          maxAttempts: 3
